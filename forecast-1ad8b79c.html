function fmtINR(n){
  n = Math.round(n);
  if(Math.abs(n) >= 10000000) return '\u20b9' + (n/10000000).toFixed(2) + 'Cr';
  if(Math.abs(n) >= 100000) return '\u20b9' + (n/100000).toFixed(2) + 'L';
  return '\u20b9' + n.toLocaleString('en-IN');
}
function fmtPct(n){ return (isFinite(n) ? n.toFixed(1) : '0.0') + '%'; }
function achColor(pct){
  if(pct >= 100) return 'var(--good)';
  if(pct >= 80) return 'var(--warn)';
  return 'var(--bad)';
}

function dayLabel(dk){
  const d = new Date(dk + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', weekday:'short'});
}

function renderForecast(body){
  const F = FORECAST;
  if(!F || !F.month){
    body.innerHTML = '<div style="color:var(--text-mute); font-size:13px;">No forecast yet — run <span class="bsc-mono">scripts/forecast.py run</span>.</div>';
    return;
  }
  const monthName = key => new Date(key + '-01T00:00:00').toLocaleDateString('en-GB', {month:'long', year:'numeric'});
  const monthShort = key => new Date(key + '-01T00:00:00').toLocaleDateString('en-GB', {month:'short'});
  const rangeTxt = (lo, hi) => (lo && hi) ? fmtINR(lo) + ' – ' + fmtINR(hi) : '—';
  const pctTxt = v => (v >= 0 ? '+' : '') + (v*100).toFixed(1) + '%';
  const missColor = (v, good, ok) => Math.abs(v) <= good ? 'var(--good)' : Math.abs(v) <= ok ? 'var(--warn)' : 'var(--bad)';
  const section = (title, sub) => {
    const h = document.createElement('div');
    h.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin:26px 0 10px;';
    h.innerHTML = title + (sub ? `<span style="font-weight:400; color:var(--text-mute); margin-left:8px;">${sub}</span>` : '');
    body.appendChild(h);
  };
  const tableWrap = html => {
    const w = document.createElement('div');
    w.style.cssText = 'overflow-x:auto; margin-bottom:8px;';
    w.innerHTML = `<table style="font-size:13px; min-width:100%;">${html}</table>`;
    body.appendChild(w);
  };
  const th = cols => '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    cols.map((c,i) => `<td style="padding:6px 10px; ${i ? 'text-align:right;' : ''} white-space:nowrap;">${c}</td>`).join('') + '</tr>';
  const td = (v, opts={}) => `<td style="padding:8px 10px; white-space:nowrap; ${opts.left ? '' : 'text-align:right;'} ${opts.color ? 'color:'+opts.color+'; font-weight:600;' : ''}"${opts.left ? '' : ' class="bsc-mono"'}>${v}</td>`;
  const tr = cells => `<tr style="border-top:1px solid var(--line);">${cells}</tr>`;
  const small = t => ` <span style="color:var(--text-mute); font-size:11.5px;">${t}</span>`;
  const cardGrid = (cards) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:8px;';
    cards.forEach(c => {
      const card = document.createElement('div');
      card.style.cssText = 'background:var(--panel); border-radius:10px; padding:14px 16px;';
      card.innerHTML = `<div style="font-size:12px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
        <div style="font-size:22px; font-weight:600; color:${c.color||'var(--text)'};" class="bsc-mono">${c.val}</div>
        ${c.sub ? `<div style="font-size:11.5px; color:var(--text-mute); margin-top:3px; line-height:1.5;">${c.sub}</div>` : ''}`;
      row.appendChild(card);
    });
    body.appendChild(row);
  };
  // targets come from the main dashboard's TARGETS/DAILY_TARGETS, copied in by forecast.py
  const TG = (F.targets && F.targets.monthKey === F.month.key) ? F.targets : null;
  const targetFor = dk => (TG && TG.daily[dk] !== undefined) ? TG.daily[dk] : null;

  const target = TG ? TG.month : null;
  const ach = target ? F.month.landing / target * 100 : null;
  const yoy = F.nextMonth.lastYear ? F.nextMonth.forecast / F.nextMonth.lastYear - 1 : null;

  const intro = document.createElement('div');
  intro.style.cssText = 'font-size:12px; color:var(--text-mute); margin-bottom:14px; line-height:1.6;';
  intro.textContent = 'Offline stores only (Online, Corporate Orders and Virtual Stylist excluded). Sales data through ' + dayLabel(F.dataThrough) +
    ', model retrained ' + F.generatedOn + '. Ranges are 80% ranges, set by how far past forecasts made the same distance ahead actually missed.';
  body.appendChild(intro);

  cardGrid([
    {label: monthName(F.month.key) + ' — forecast landing', val: fmtINR(F.month.landing), sub: '80%: ' + rangeTxt(F.month.lo, F.month.hi) + (F.landingMethod && F.landingMethod.method !== 'latest' ? '<br>blends the start-of-month and latest forecasts' : '')},
    {label: 'Landing vs month target', val: ach !== null ? fmtPct(ach) : '—', color: ach !== null ? achColor(ach) : null,
      sub: target ? 'target ' + fmtINR(target) + (target > F.month.landing ? ' · short by ' + fmtINR(target - F.month.landing) : ' · on track') : 'targets not loaded for this month'},
    {label: 'Still to come (' + F.month.daysLeft + ' day' + (F.month.daysLeft === 1 ? '' : 's') + ')', val: fmtINR(F.month.rest), sub: 'on top of ' + fmtINR(F.month.mtd) + ' MTD actual'},
    {label: monthName(F.nextMonth.key) + ' — forecast', val: fmtINR(F.nextMonth.forecast), sub: '80%: ' + rangeTxt(F.nextMonth.lo, F.nextMonth.hi) +
      (yoy !== null ? '<br>' + pctTxt(yoy) + ' vs ' + monthName(F.nextMonth.lastYearKey) + ' (' + fmtINR(F.nextMonth.lastYear) + ', fewer stores then)' : '')},
  ]);

  // ---- why this forecast: every number here is computed by forecast.py from the sales history
  const I = F.insights;
  if(I){
    const mS = monthShort(F.month.key), nS = monthShort(F.nextMonth.key);
    const x2 = v => v.toFixed(2) + '×';
    const sgn = v => (v >= 0 ? '+' : '') + (v*100).toFixed(0) + '%';
    const fmtD = dk => new Date(dk + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
    const REG = ['North','South','West'];
    const avgSeason = g => { const s = I.seasonal[g] || []; return s.length ? s.reduce((a,b) => a + b.calAdj, 0) / s.length : null; };
    const Bg = I.bridge, WM = I.weekendMultiplier;

    section('Why this forecast', 'computed fresh on every run from all sales since Jan 2024');

    // bridge: this month's landing -> next month's forecast
    const note = t => `<td style="padding:8px 10px; color:var(--text-mute); font-size:12px; min-width:220px;">${t}</td>`;
    const bRow = (label, v, t, strong) => tr(td(strong ? '<b>' + label + '</b>' : label, {left:true}) +
      td((strong ? '' : (v >= 0 ? '+' : '−')) + fmtINR(Math.abs(v))) + note(t));
    let br = th(['Step', 'Amount', 'What it means']);
    br += bRow(mS + ' forecast landing', Bg.landing, Bg.daysCur + ' days · ' + fmtINR(Bg.landing / Bg.daysCur) + ' a day', true);
    if(Bg.daysNext !== Bg.daysCur) br += bRow('Month length', Bg.samePace - Bg.landing, nS + ' has ' + Bg.daysNext + ' days vs ' + Bg.daysCur + ', at the same daily pace');
    br += bRow('Calendar', Bg.calendar, nS + ' has ' + Bg.weekendsNext + ' weekend days vs ' + Bg.weekendsCur + '; a weekend day sells ' + x2(WM.network) + ' a weekday');
    br += bRow('Season, festivals & trend', Bg.learned, 'what the models learned from past ' + nS + 's, festival timing and each store’s recent trend');
    br += bRow(nS + ' forecast', Bg.forecast, '80% range ' + rangeTxt(F.nextMonth.lo, F.nextMonth.hi), true);
    tableWrap(br);

    const bullets = [];
    // 1. seasonality vs history
    const sn = I.seasonal.network || [];
    if(sn.length && I.implied.network){
      const imp = I.implied.network.calAdj, h = Bg.historyRatio;
      const tone = imp < h - 0.04 ? 'more cautious than' : imp > h + 0.04 ? 'more optimistic than' : 'in line with';
      let t = `<b>Seasonality.</b> Stores that traded through both months sold ${sn.map(s => x2(s.calAdj) + ' in ' + s.year).join(' and ')} as much per day in ${nS} as in ${mS} (weekend count evened out). This forecast assumes ${x2(imp)} — ${tone} history.`;
      if(tone === 'more cautious than' && Bg.historyScenario){
        t += ` If ${nS} repeats the past pattern exactly, it would land near <b>${fmtINR(Bg.historyScenario)}</b>. The forecast holds back because ${mS} has been soft and one of its three methods (same-weekday pace) carries today’s pace forward with no seasonal lift — in the backtest, blending it in missed less than any single method did on its own.`;
      }
      bullets.push(t);
    }
    // 2. which region drives it
    const ranked = REG.filter(r => avgSeason(r) !== null).sort((a,b) => avgSeason(b) - avgSeason(a));
    const nFests = (I.festivals || []).filter(f => f.past.length && f.daysInNextMonth > 0).slice(0, 2);
    const fLift = (f, g) => f.past.reduce((a,p) => a + p[g], 0) / f.past.length;
    if(ranked.length === 3 && I.implied[ranked[0]]){
      const t0 = ranked[0];
      let t = `<b>${t0} drives the ${nS} lift.</b> ${t0}’s ${nS} has run ${I.seasonal[t0].map(s => x2(s.calAdj) + ' (' + s.year + ')').join(' and ')} its ${mS} per store per day, against ${ranked.slice(1).map(r => r + ' ' + x2(avgSeason(r))).join(' and ')} on average. The forecast gives ${t0} ${x2(I.implied[t0].calAdj)}.`;
      if(nFests.length){
        const reactsMost = nFests.every(f => REG.every(r => fLift(f, t0) >= fLift(f, r)));
        t += ` The lift lines up with the festive season` + (reactsMost ? `, and ${t0} reacts to it more than any other region` : '') + ': ' +
          nFests.map(f => `past ${f.name} windows lifted ${t0} ${sgn(fLift(f, t0))} over the 4 weeks before (` + REG.filter(r => r !== t0).map(r => r + ' ' + sgn(fLift(f, r))).join(', ') + ')').join('; ') + '.';
      }
      bullets.push(t);
    }
    // 3. festival timing
    (I.festivals || []).filter(f => f.past.length).forEach(f => {
      const prev = (f.previous || []).map(fmtD).join(' and ');
      bullets.push(`<b>${f.name}: ${fmtD(f.date)}</b>${prev ? ' (was ' + prev + ')' : ''}. The model treats ${-f.window[0]} days before to ${f.window[1]} after as its shopping window` +
        (f.daysInNextMonth ? ` — ${f.daysInNextMonth} of those ${f.windowDays} days fall in ${nS}` : '') +
        `. Past windows ran ${f.past.map(p => sgn(p.network) + ' (' + p.date.slice(0,4) + ')').join(' and ')} above the 4 weeks before them, network-wide.` +
        ((f.previous || []).length ? ` Its “last year” comparison lines up on the festival: each day is compared with the same day before/after ${f.name} ${fmtD(f.previous[f.previous.length - 1])}, not the same calendar date — so last year’s festival bump lands on this year’s dates.` : ''));
    });
    // 4. underlying growth
    if(I.yoy.network){
      bullets.push(`<b>Underlying growth.</b> Over the last 13 weeks, stores open a year ago sold ${sgn(I.yoy.network.growth)} vs the same weeks last year — ` +
        REG.filter(r => I.yoy[r]).map(r => r + ' ' + sgn(I.yoy[r].growth)).join(', ') + `. The models pick this up through each store’s recent sales level.`);
    }
    // 5. weekends
    bullets.push(`<b>Weekends carry the numbers.</b> A Saturday or Sunday sells ${x2(WM.network)} a weekday per store (` +
      REG.map(r => r + ' ' + x2(WM[r])).join(', ') + `) — so a month’s outcome depends heavily on how its weekends go, and the day-by-day chart zig-zags.`);
    // 6. current month vs target
    if(target && F.month.daysLeft > 0){
      const need = (target - F.month.mtd) / F.month.daysLeft, fcd = F.month.rest / F.month.daysLeft;
      bullets.push(`<b>${mS} target.</b> Hitting ${fmtINR(target)} needs ${fmtINR(Math.max(0, need))} a day over the last ${F.month.daysLeft} days; the forecast is ${fmtINR(fcd)} a day` +
        (need > fcd ? ` (${x2(need / fcd)} the expected pace).` : ' — already enough.'));
    }
    // 7. how sure
    const M = I.methods, vals = [M.A, M.B, M.G], spread = (Math.max(...vals) - Math.min(...vals)) / Bg.forecast;
    bullets.push(`<b>How sure is it?</b> The three methods say: same-weekday pace ${fmtINR(M.A)}, last-year pattern ${fmtINR(M.B)}, machine learning ${fmtINR(M.G)}. ` +
      (spread > 0.25 ? `They disagree a lot this time — the model has seen only ${sn.length} past ${nS}${sn.length === 1 ? '' : 's'} with different festival dates — so read the 80% range, not just the single number.`
                     : 'They broadly agree, so confidence is higher than usual.'));
    // 8. movers
    if(I.drift && I.drift.up.length){
      const lst = a => a.map(s => s.store + ' ' + sgn(s.change)).join(', ');
      bullets.push(`<b>Stores moving most vs the same 4 weeks last year</b> (stores open over a year): up — ${lst(I.drift.up.filter(s => s.change > 0))}; down — ${lst(I.drift.down.filter(s => s.change < 0))}.`);
    }
    const ul = document.createElement('ul');
    ul.style.cssText = 'margin:14px 0 6px; padding-left:18px; font-size:13px; line-height:1.65; color:var(--text);';
    ul.innerHTML = bullets.map(b => `<li style="margin-bottom:8px;">${b}</li>`).join('');
    body.appendChild(ul);

    // region table
    let rt = th(['Region', nS + ' ÷ ' + mS + ' per day, past years', 'Forecast assumes', 'Growth vs last year (13 wks)', 'Weekend × weekday'].concat(nFests.map(f => f.name + ' window lift (avg)')));
    ['network'].concat(REG).forEach(g => {
      const past = (I.seasonal[g] || []).map(s => x2(s.calAdj) + ' (’' + String(s.year).slice(2) + ')').join(' · ') || '—';
      rt += tr(td(g === 'network' ? '<b>All stores</b>' : g, {left:true}) + td(past) + td(I.implied[g] ? x2(I.implied[g].calAdj) : '—') +
        td(I.yoy[g] ? sgn(I.yoy[g].growth) : '—') + td(x2(WM[g])) + nFests.map(f => td(sgn(fLift(f, g)))).join(''));
    });
    tableWrap(rt);

    // the science
    const P = (F.backtest && F.backtest.policies && F.backtest.policies[F.backtest.champion]) || null;
    const det = document.createElement('details');
    det.style.cssText = 'background:var(--panel); border-radius:10px; padding:12px 16px; margin:12px 0 4px; font-size:12.5px; line-height:1.7; color:var(--text-dim);';
    det.innerHTML = `<summary style="cursor:pointer; color:var(--text); font-weight:600; font-size:13px;">The science behind it</summary>
      <p style="margin:10px 0 0;"><b style="color:var(--text);">What is predicted.</b> Every offline store, every day, up to 62 days ahead — then added up to regions and the network. It works store by store because the network grew from about 15 to 36 stores since 2024: a single network trend line would mistake store openings for growth.</p>
      <p style="margin:8px 0 0;"><b style="color:var(--text);">Three independent methods.</b> <b>A — same-weekday pace:</b> the store’s average of its last 4 same weekdays (a Sunday is predicted from recent Sundays). <b>B — last-year pattern:</b> A, scaled by how the whole network moved over the same weeks a year ago (this is what brings in seasonality). Around a festival whose date moves (Diwali, Dussehra, Holi, Eid, Rakhi, Ganesh Chaturthi) “the same weeks” means the same distance from last year’s festival, so last year’s festival bump is carried onto this year’s festival dates. <b>G — machine learning:</b> gradient-boosted decision trees that learn how far a store’s day will sit above or below its recent level, from weekday, month, days to each festival, days to month-end, store age, the store’s own weekday profile, 3-month momentum and last year’s seasonal factor (lined up on festival dates the same way). Predicting the <i>ratio</i> to a store’s own level lets one model learn from big and small stores together.</p>
      <p style="margin:8px 0 0;"><b style="color:var(--text);">Guarding against false patterns.</b> With only two years of history a flexible model can memorise one-off days — an early version “learned” that 1–2 October is always huge because Dussehra fell on 2 Oct in 2025. So G is heavily constrained (each rule must be backed by thousands of examples), has no day-of-month input, and festivals are described by distance to the festival date, which moves every year.</p>
      <p style="margin:8px 0 0;"><b style="color:var(--text);">How it was tested.</b> A walk-forward backtest over 18 months: for each month, the models were trained only on data available before it, then asked to forecast it — exactly the situation they face live, with no peeking at the future.${P ? ` Average misses: next day ${(P.day*100).toFixed(1)}%, next 7 days ${(P.week*100).toFixed(1)}%, full month ${(P.month*100).toFixed(1)}%, month landing from mid-month ${(P.landing14*100).toFixed(1)}%.` : ''}</p>
      <p style="margin:8px 0 0;"><b style="color:var(--text);">How it learns.</b> Every forecast is saved and scored once the real sales come in. Each morning the models retrain on all history including yesterday, and the blend re-weights toward whichever method has been more accurate over the last 120 days, separately for next-day, next-week and longer forecasts. Any change to the method has to beat the current one in the backtest before it goes live — a “bias-correction” idea was tested this way and rejected because it made month forecasts worse.</p>
      <p style="margin:8px 0 0;"><b style="color:var(--text);">The month-end landing.</b> Landing = sales so far + a forecast for the rest of the month. How that rest-of-month forecast is made depends on how far into the month we are: in the <b>first week</b> it uses the newest forecast; in <b>days 8&ndash;21</b> it averages the forecast made just before the month began with the newest one, because a strong or weak start to a month mostly doesn&rsquo;t last and chasing it misses more; from <b>day 22</b> it uses the newest forecast again, since by then the start-of-month forecast is stale. Today (<i>${F.landingMethod ? F.landingMethod.phase : ''}-month</i>) it uses the <i>${(F.landingMethod && F.landingMethod.label) || 'newest forecast'}</i>. Every day each phase re-scores these options against the model&rsquo;s own forecasts from the last 12 months and switches only if another is clearly (5%+) better.</p>
      <p style="margin:8px 0 0;"><b style="color:var(--text);">Where the ranges come from.</b> Not a textbook formula: the 80% range is how far the logged forecasts made the same number of days ahead actually missed, 8 times out of 10. As live accuracy improves, the ranges tighten on their own.</p>
      <p style="margin:8px 0 0;"><b style="color:var(--text);">What it can’t see.</b> Promotions and campaigns, stock problems, staff changes, store openings/closures before they happen, and anything that has never happened before. Festive months are the weakest (only two past examples each) and improve every year.</p>`;
    body.appendChild(det);
  }

  // daily chart
  section('Day by day', 'actual so far, forecast ahead');
  const canvasWrap = document.createElement('div');
  canvasWrap.style.cssText = 'position:relative; height:280px; margin-bottom:10px;';
  canvasWrap.innerHTML = '<canvas id="bsc-forecast-chart" role="img" aria-label="Daily actual and forecast offline revenue"></canvas>';
  body.appendChild(canvasWrap);
  requestAnimationFrame(() => {
    const ctx = document.getElementById('bsc-forecast-chart');
    if(!ctx || !window.Chart) return;
    const D = F.daily;
    new Chart(ctx, {
      data: {
        labels: D.map(d => dayLabel(d.date)),
        datasets: [
          {type:'bar', label:'Actual', data: D.map(d => d.actual ?? null), backgroundColor:'rgba(201,161,91,0.75)', borderRadius:2, order:3},
          {type:'line', label:'80% low', data: D.map(d => d.lo ?? null), borderWidth:0, pointRadius:0, fill:false, order:2},
          {type:'line', label:'80% high', data: D.map(d => d.hi ?? null), borderWidth:0, pointRadius:0, fill:'-1', backgroundColor:'rgba(154,157,165,0.18)', order:2},
          {type:'line', label:'Forecast', data: D.map(d => d.forecast ?? null), borderColor:'#e9e6df', borderWidth:1.5, pointRadius:1.5, tension:0.15, order:1},
          {type:'line', label:'Target', data: D.map(d => targetFor(d.date)), borderColor:'#8a8d95', borderDash:[4,3], borderWidth:1.2, pointRadius:0, order:0},
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
        scales: {
          x: {ticks:{color:'#9a9da5', maxRotation:60, autoSkip:true, maxTicksLimit:20}, grid:{display:false}},
          y: {ticks:{color:'#9a9da5', callback:(v)=>fmtINR(v)}, grid:{color:'#2c313a'}}
        },
        plugins: {
          legend:{display:false},
          tooltip:{filter: i => i.raw !== null && !i.dataset.label.startsWith('80%'),
                   callbacks:{label: i => i.dataset.label + ': ' + fmtINR(i.raw)}}
        }
      }
    });
  });
  const legend = document.createElement('div');
  legend.style.cssText = 'display:flex; flex-wrap:wrap; gap:16px; margin-bottom:6px; font-size:12px; color:var(--text-dim);';
  legend.innerHTML = `<span style="display:flex; align-items:center; gap:5px;"><span style="width:10px;height:10px;background:rgba(201,161,91,0.75);"></span>Actual</span>
    <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px;height:2px;background:#e9e6df;"></span>Forecast</span>
    <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px;height:10px;background:rgba(154,157,165,0.3);"></span>80% range</span>
    <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px;height:0;border-top:2px dashed #8a8d95;"></span>Target</span>`;
  body.appendChild(legend);

  // next 7 days
  const fest = {};
  (F.notes.festivals || []).forEach(f => { fest[f.date] = f.name; });
  section('Next 7 days');
  let rows = th(['Day', 'Forecast', '80% range', 'Target', 'Fcst vs target']);
  F.daily.filter(d => d.forecast !== undefined).slice(0, 7).forEach(d => {
    const t = targetFor(d.date);
    const a = t ? d.forecast / t * 100 : null;
    rows += tr(td(dayLabel(d.date) + (fest[d.date] ? ` <span style="color:var(--brass); font-size:11.5px;">· ${fest[d.date]}</span>` : ''), {left:true}) +
      td(fmtINR(d.forecast)) + td(rangeTxt(d.lo, d.hi)) + td(t ? fmtINR(t) : '—') + td(a !== null ? fmtPct(a) : '—', {color: a !== null ? achColor(a) : null}));
  });
  tableWrap(rows);

  // regions
  section('By region');
  rows = th(['Region', 'MTD actual', monthShort(F.month.key) + ' landing', monthShort(F.nextMonth.key) + ' forecast', 'vs ' + monthShort(F.month.key)]);
  ['North','South','West'].forEach(r => {
    const x = F.regions[r];
    rows += tr(td(r, {left:true}) + td(fmtINR(x.mtd)) + td(fmtINR(x.landing)) + td(fmtINR(x.nextMonth)) + td(x.landing ? pctTxt(x.nextMonth / x.landing - 1) : '—'));
  });
  tableWrap(rows);

  // stores, most at risk vs target first
  section('By store', 'lowest forecast landing vs month target first');
  const st = F.stores.map(s => {
    const tgt = TG && TG.stores[s.store] ? TG.stores[s.store] : null;
    return Object.assign({}, s, {target: tgt, ach: tgt ? s.landing / tgt * 100 : null});
  }).sort((a,b) => (a.ach ?? 1e9) - (b.ach ?? 1e9));
  rows = th(['Store', 'MTD actual', 'Forecast landing', 'Month target', 'Landing ach%', monthShort(F.nextMonth.key) + ' forecast']);
  st.forEach(s => {
    const flag = !s.forecast ? small('(not forecast)') : s.runRate ? small('(new — run-rate)') : '';
    rows += tr(td(s.store + flag + small(s.region), {left:true}) + td(fmtINR(s.mtd)) + td(fmtINR(s.landing)) +
      td(s.target ? fmtINR(s.target) : '—') + td(s.ach !== null ? fmtPct(s.ach) : '—', {color: s.ach !== null ? achColor(s.ach) : null}) +
      td(s.forecast ? fmtINR(s.nextMonth) : '—'));
  });
  tableWrap(rows);
  const stNote = document.createElement('div');
  stNote.style.cssText = 'font-size:11.5px; color:var(--text-mute); line-height:1.6;';
  stNote.textContent = 'Store forecasts are much noisier than the network total (one store’s single day can miss by 50%). Use them to spot who is drifting, not as exact numbers.';
  body.appendChild(stNote);

  // accuracy
  section('How accurate has it been?', 'every forecast is logged and scored once the actual comes in; misses are % of actual sales, negative = came in below forecast');
  const A = F.accuracy;
  const pct1 = v => v !== null && v !== undefined ? (v*100).toFixed(1) + '%' : '—';
  cardGrid([
    {label: 'Next-day miss — live, last 30 days', val: pct1(A.liveDay30.mape), sub: A.liveDay30.n ? A.liveDay30.n + ' days scored' : 'scores start from ' + dayLabel(F.dataThrough)},
    {label: 'Next-day miss — backtest', val: pct1(A.backtestDay.mape), sub: A.backtestDay.n + ' past days, as-if forecasts'},
    {label: 'Full-month miss — backtest', val: pct1(A.backtestMonth.mape), sub: A.backtestMonth.n + ' past months (1st to month-end), forecast made just before each began'},
  ]);
  rows = th(['Day', 'Forecast (made day before)', 'Actual', 'Miss (% of actual)', 'Type']);
  A.recent.slice().reverse().forEach(r => {
    rows += tr(td(dayLabel(r.date), {left:true}) + td(fmtINR(r.forecast)) + td(fmtINR(r.actual)) +
      td(pctTxt(-r.err), {color: missColor(r.err, 0.1, 0.2)}) + td(r.source === 'live' ? 'Live' : 'Backtest'));
  });
  tableWrap(rows);

  const bt = F.backtest || {};
  if(bt.perMonth){
    section('Monthly backtest', 'as-if forecasts using only data available at the time; all misses are % of actual sales, negative = came in below forecast');
    rows = th(['Month', 'Day-0 forecast miss', 'Day-14 landing miss', 'Avg next-day miss', 'Avg next-7-days miss']);
    const inv = v => -v; // stored as forecast/actual - 1; shown as (actual - forecast) / actual, same basis as the cards
    bt.perMonth.filter(m => m.full).slice().reverse().forEach(m => {
      rows += tr(td(monthName(m.month), {left:true}) +
        td(pctTxt(inv(m.monthAhead)), {color: missColor(m.monthAhead, 0.05, 0.1)}) +
        td(pctTxt(inv(m.landing14)), {color: missColor(m.landing14, 0.03, 0.06)}) +
        td(pct1(m.day)) + td(pct1(m.week)));
    });
    tableWrap(rows);
  }

  const W = F.policy.weights;
  const wtxt = b => `A ${(W[b].A*100).toFixed(0)}% · B ${(W[b].B*100).toFixed(0)}% · G ${(W[b].G*100).toFixed(0)}%`;
  const tc = Object.entries(F.notes.temporarilyClosed || {}).map(([s, why]) => s + ' (' + why + ')');
  const fs = (F.notes.festivals || []).map(f => f.name + ' ' + dayLabel(f.date));
  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:18px; line-height:1.7;';
  note.innerHTML = '<b style="color:var(--text-dim);">How it works.</b> Each store is forecast three ways and blended: ' +
    '<b>A</b> its last 4 same-weekday days; <b>B</b> A adjusted by how the network moved over the same weeks last year (lined up on festival dates); ' +
    '<b>G</b> a machine-learning model trained on all sales since Jan 2024 (weekday, month, festival timing, store age, momentum). ' +
    'It retrains every morning with yesterday’s sales, and re-learns the blend weights from the last 120 days of scored forecasts — now: next day ' + wtxt('day') +
    '; days 2–7 ' + wtxt('week') + '; further out ' + wtxt('month') + '. ' +
    'A change to the method only goes live if it beats the current one in an 18-month backtest (in use: <span class="bsc-mono">' + F.policy.mode + '</span>).' +
    (fs.length ? '<br><b style="color:var(--text-dim);">Festivals ahead the model accounts for:</b> ' + fs.join(', ') + '.' : '') +
    (tc.length ? '<br><b style="color:var(--text-dim);">Not forecast:</b> ' + tc.join('; ') + ' — rejoins automatically once it starts selling again.' : '') +
    ((F.notes.storeEvents || []).length ? '<br><b style="color:var(--text-dim);">Store changes the model can&rsquo;t see in past sales yet:</b> ' + F.notes.storeEvents.map(e => e.store + ' from ' + dayLabel(e.from) + ' &mdash; ' + e.note).join('; ') + '. Its forecast is based on sales under the old setup until a few weeks of new sales come in.' : '') +
    (F.notes.runRateStores.length ? '<br><b style="color:var(--text-dim);">New stores on run-rate</b> (under 4 weeks of history): ' + F.notes.runRateStores.join(', ') + '.' : '') +
    '<br>Stores that haven’t opened yet aren’t in the forecast until they start trading.';
  body.appendChild(note);
}

renderForecast(document.getElementById('bsc-forecast'));
})();
</script>
</body>
</html>
