(function(){

const state = { store: null, log: [] };

function fmtINR(n){
  if(n === null || n === undefined) return 'n/a';
  const neg = n < 0; n = Math.abs(Math.round(n));
  const s = n.toString();
  let last3 = s.slice(-3), rest = s.slice(0,-3);
  if(rest !== '') last3 = ',' + last3;
  const formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
  return (neg?'-':'') + 'Rs' + formatted;
}
function fmtPct(n){ return (n===null||n===undefined) ? 'n/a' : (n*100).toFixed(1) + '%'; }
function fmtNum(n){ return (n===null||n===undefined) ? 'n/a' : Math.round(n).toLocaleString('en-IN'); }
function fmtDateNice(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

async function logEvent(store, event){
  if(!APPS_SCRIPT_URL) return;
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, // avoids CORS preflight to Apps Script
      body: JSON.stringify({store, event}),
    });
  }catch(e){ /* tracking is best-effort -- never block the briefing on a network failure */ }
}

async function loadLog(){
  if(!APPS_SCRIPT_URL) return [];
  try{
    const res = await fetch(APPS_SCRIPT_URL, {method:'GET'});
    const data = await res.json();
    return data.rows || [];
  }catch(e){ return []; }
}

function statusFor(store){
  const rows = state.log.filter(r => r.store === store);
  const views = rows.filter(r => r.event === 'view');
  const prints = rows.filter(r => r.event === 'print');
  const last = arr => arr.length ? arr[arr.length-1].timestamp : null;
  return {
    viewed: views.length > 0, viewCount: views.length, lastViewed: last(views),
    printed: prints.length > 0, printCount: prints.length, lastPrinted: last(prints),
  };
}

function fmtWhen(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ' ' +
    d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}

// ---- New store-manager-facing briefing flow: target pace -> new-customer diagnosis ->

function sectionHead(icon, title, sub){
  return `<div style="display:flex; align-items:baseline; gap:8px; margin:22px 0 10px;">
    <i class="ti ${icon}" style="color:var(--brass); font-size:15px;"></i>
    <div style="font-size:13.5px; font-weight:700; color:var(--text); letter-spacing:.01em;">${title}</div>
    ${sub ? `<div style="font-size:11.5px; color:var(--text-mute);">${sub}</div>` : ''}
  </div>`;
}

function targetHero(d){
  // Target-to-date (sum of this store's daily targets through today) vs achieved-to-date -- the
  // same basis the main dashboard's MTD ach% uses. Comparing achieved-to-date against the FULL
  // month's target instead (what this used to do) understates every store early in the month.
  const targetToDate = d.monthTargetToDate || 0;
  const pct = targetToDate ? (d.achievedTotal / targetToDate * 100) : 0;
  const color = achColor(pct);
  const remaining = Math.max(d.monthTarget - d.achievedTotal, 0);
  return `<div style="background:var(--panel); border-radius:12px; padding:18px 20px; margin-bottom:6px; border-left:4px solid ${color};">
    <div style="font-size:11.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.05em;">Target vs Achievement (to date)</div>
    <div style="display:flex; align-items:baseline; gap:14px; margin-top:6px; flex-wrap:wrap;">
      <span class="bsc-mono" style="font-size:32px; font-weight:700; color:${color};">${pct.toFixed(0)}%</span>
      <span style="font-size:13px; color:var(--text-dim);">
        <b class="bsc-mono">${fmtINR(d.achievedTotal)}</b> of <b class="bsc-mono">${fmtINR(targetToDate)}</b> target-to-date
      </span>
    </div>
    <div style="font-size:12px; color:var(--text-mute); margin-top:8px;">
      Full month target <b class="bsc-mono">${fmtINR(d.monthTarget)}</b>
      &middot; ${fmtINR(remaining)} left to close in ${BRIEFING_DATA.daysRemaining} day(s)
    </div>
  </div>`;
}

// Built by scripts/update_store_briefing.py (d.today): today's number, then the store-team levers

        ${statTile(`Yesterday (${fmtDateNice(y.date).replace(/ \d{4}$/, '')})`, `${fmtINR(y.rev)}${yPct !== null ? ` <span style="font-size:12px; color:var(--text-mute); font-weight:500;">${yPct.toFixed(0)}% of target &middot; ${y.bills} bills</span>` : ''}`, yPct === null ? 'var(--text)' : achColor(yPct))}
      </div>
      <div style="font-size:12.5px; color:var(--text-dim); margin:10px 0 12px; line-height:1.6;">${paceLine}</div>
      ${focus || `<div style="font-size:12.5px; color:var(--good); padding-top:10px; border-top:1px solid var(--line);">Conversion, AOV and repeat customers are all on or above target. Keep doing what is working.</div>`}
      ${notes ? `<div style="border-top:1px solid var(--line); margin-top:2px; padding-top:4px;">${notes}</div>` : ''}
    </div>`;
}

function achColor(pct){
  if(pct >= 100) return 'var(--good)';
  if(pct >= 80) return 'var(--warn)';
  return 'var(--bad)';
}

function statTile(label, value, valueColor){
  return `<div style="background:var(--panel2); border-radius:8px; padding:10px 14px;">
    <div style="font-size:10.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.03em;">${label}</div>
    <div style="margin-top:3px; font-size:18px; font-weight:700; color:${valueColor||'var(--text)'};" class="bsc-mono">${value}</div>
  </div>`;
}

// AOV = ASP x UPT -- when AOV is below target, tell the manager which of the two levers moved
// more against them since last month, rather than just restating the AOV gap.
function diagnoseAOV(curAsp, curUpt, prevAsp, prevUpt){
  if(!curAsp || !curUpt) return '';
  if(prevAsp === undefined || prevAsp === null || prevUpt === undefined || prevUpt === null){
    return `<div style="font-size:12px; color:var(--text-mute); margin-top:8px;">
      ASP <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(curAsp)}</b> &middot;
      UPT <b class="bsc-mono" style="color:var(--text-dim);">${curUpt.toFixed(2)}</b></div>`;
  }
  const aspDelta = prevAsp ? (curAsp-prevAsp)/prevAsp*100 : 0;
  const uptDelta = prevUpt ? (curUpt-prevUpt)/prevUpt*100 : 0;
  const worseIsAsp = aspDelta <= uptDelta;
  const deltaStr = d => `<span style="color:${d>=0?'var(--good)':'var(--bad)'};">${d>=0?'+':''}${d.toFixed(1)}% vs last mo.</span>`;
  return `<div style="font-size:12px; color:var(--text-mute); margin-top:8px; line-height:1.7;">
      ASP <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(curAsp)}</b> (${deltaStr(aspDelta)}) &middot;
      UPT <b class="bsc-mono" style="color:var(--text-dim);">${curUpt.toFixed(2)}</b> (${deltaStr(uptDelta)})
    </div>
    <div style="font-size:12.5px; color:var(--warn); margin-top:4px;">
      <i class="ti ti-target-arrow"></i>&nbsp; ${worseIsAsp ? 'ASP' : 'UPT'} is the bigger drag on AOV here &mdash;
      ${worseIsAsp ? 'push up-selling / higher-value pieces' : 'push multi-item bills (add-ons, styling suggestions)'}</div>`;
}

// Only surface conversion when it's the actual, actionable shortfall (current below what's
// needed) -- a store can push harder on conversion today. Whether projected footfall alone could
// ever cover the remaining bills isn't something a store manager can act on, so that math isn't
// shown here even though the underlying data still has it (seg.conversionImpossible etc.).
function conversionPushLine(seg){
  if(seg.currentConversion !== undefined && seg.requiredConversion !== undefined
     && seg.currentConversion < seg.requiredConversion){
    return `<div style="color:var(--warn); font-size:12.5px; margin-top:8px;">
      <i class="ti ti-trending-up"></i>&nbsp; Bills behind target and conversion
      (<b class="bsc-mono">${fmtPct(seg.currentConversion)}</b>) is below what's needed
      (<b class="bsc-mono">${fmtPct(seg.requiredConversion)}</b>) &mdash; push for conversion on the floor</div>`;
  }
  return '';
}

function newCustomerSection(d){
  const seg = d.new;
  if(!seg) return '';
  if(seg.noTarget){
    return sectionHead('ti-user-plus', 'New Customers') + `<div style="color:var(--text-mute); font-size:13px;">No target set for this segment this month</div>`;
  }
  const aovColor = seg.hoTargetAOV ? (seg.currentAOV >= seg.hoTargetAOV ? 'var(--good)' : 'var(--bad)') : 'var(--text)';
  const belowAovTarget = seg.hoTargetAOV && seg.currentAOV < seg.hoTargetAOV;
  const billsColor = seg.status === 'achieved' ? 'var(--good)' : (seg.achievedBills/seg.targetOrders >= (BRIEFING_DATA.daysElapsed/BRIEFING_DATA.daysInMonth) ? 'var(--text)' : 'var(--warn)');

  return sectionHead('ti-user-plus', 'New Customers') + `
    <div style="background:var(--panel); border-radius:10px; padding:16px 18px; border-left:3px solid var(--brass-dim);">
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
        ${statTile('Conversion vs target', seg.currentConversion !== undefined ? `${fmtPct(seg.currentConversion)}${seg.targetConversion ? ` <span style="font-size:12px; color:var(--text-mute); font-weight:500;">/ ${fmtPct(seg.targetConversion)}</span>` : ''}` : '&mdash;', seg.currentConversion !== undefined && seg.targetConversion ? (seg.currentConversion >= seg.targetConversion ? 'var(--good)' : 'var(--bad)') : undefined)}
        ${statTile('AOV vs target', `${fmtINR(seg.currentAOV)} <span style="font-size:12px; color:var(--text-mute); font-weight:500;">/ ${fmtINR(seg.hoTargetAOV)}</span>`, aovColor)}
        ${statTile('Bills vs target', `${fmtNum(seg.achievedBills)} <span style="font-size:12px; color:var(--text-mute); font-weight:500;">/ ${fmtNum(seg.targetOrders)}</span>`, billsColor)}
      </div>
      ${belowAovTarget ? diagnoseAOV(seg.currentASP, seg.currentUPT, d.prevMonth && d.prevMonth.newAsp, d.prevMonth && d.prevMonth.newUpt) : ''}
      ${conversionPushLine(seg)}
      <div style="font-size:11.5px; color:var(--text-mute); margin-top:10px;">
        Revenue <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(seg.achievedRev)}</b> of
        <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(seg.targetRev)}</b> target
        ${seg.status==='achieved' ? ` &middot; <span style="color:var(--good);">${fmtINR(seg.surplus)} ahead</span>` : ''}
      </div>
    </div>`;
}

function repeatCustomerSection(d){

  }

  const billsColor = seg.status === 'achieved' ? 'var(--good)' : (behind ? 'var(--warn)' : 'var(--text)');

  return sectionHead('ti-repeat', 'Repeat Customers') + `
    <div style="background:var(--panel); border-radius:10px; padding:16px 18px; border-left:3px solid var(--brass-dim);">
      <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">
        ${statTile('Bills vs target', `${fmtNum(seg.achievedBills)} <span style="font-size:12px; color:var(--text-mute); font-weight:500;">/ ${fmtNum(seg.targetOrders)}</span>`, billsColor)}
        ${statTile('AOV vs target', `${fmtINR(seg.currentAOV)} <span style="font-size:12px; color:var(--text-mute); font-weight:500;">/ ${fmtINR(seg.hoTargetAOV)}</span>`, seg.hoTargetAOV && seg.currentAOV >= seg.hoTargetAOV ? 'var(--good)' : 'var(--bad)')}
      </div>
      ${behind ? `<div style="color:var(--brass); font-size:12.5px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);">
        <i class="ti ti-phone-call"></i>&nbsp; Behind on repeat bills &mdash; prioritize outbound calls to existing customers to close the gap.
        <div style="color:var(--text-mute); font-size:11.5px; margin-top:4px;">
          Calls made: <b class="bsc-mono">&mdash;</b> &middot; Pending: <b class="bsc-mono">&mdash;</b>
          <span style="font-style:italic;">(calling tracker not connected yet)</span>
        </div>
      </div>` : `<div style="color:var(--good); font-size:12.5px; margin-top:10px;">On pace &mdash; ${fmtINR(seg.surplus||0)} ${seg.status==='achieved'?'ahead':''}</div>`}
      <div style="font-size:11.5px; color:var(--text-mute); margin-top:10px;">
        Revenue <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(seg.achievedRev)}</b> of
        <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(seg.targetRev)}</b> target
      </div>

// Built by scripts/update_store_briefing.py (d.returns): shown at the very top of page 1, only for a
// store whose refunds + credit notes run well above the all-store rate, so the SM acts on it first.
function returnsAlert(d){
  const r = d.returns;
  if(!r || !r.high) return '';
  const actions = (r.actions || []).map(a => `<li style="margin-top:4px;">${a}</li>`).join('');
  return `<div class="brief-keep" style="background:var(--panel); border-radius:12px; padding:14px 18px; margin-bottom:12px; border-left:4px solid var(--bad);">
    <div style="display:flex; align-items:center; gap:8px;">
      <i class="ti ti-receipt-refund" style="color:var(--bad); font-size:16px;"></i>
      <span style="font-size:13.5px; font-weight:700; color:var(--bad);">${r.title}: control this first</span>
      <span class="bsc-mono" style="margin-left:auto; font-size:18px; font-weight:700; color:var(--bad);">${(r.rate*100).toFixed(1)}%</span>
    </div>
    <div style="font-size:12.5px; color:var(--text-dim); margin-top:6px; line-height:1.6;">${r.detail}</div>
    ${actions ? `<ul style="font-size:12.5px; color:var(--text); margin:6px 0 0; padding-left:18px; line-height:1.55;">${actions}</ul>` : ''}

function scoreBadge(label, val, suffix, goodMin, warnMin){
  let color = 'var(--text-mute)';
  let display = '&mdash;';
  if(val !== null && val !== undefined){
    color = val >= goodMin ? 'var(--good)' : (val >= warnMin ? 'var(--warn)' : 'var(--bad)');
    display = val.toFixed(1) + (suffix||'');
  }
  return `<div style="background:var(--panel2); border-radius:8px; padding:12px 14px; flex:1; min-width:110px; text-align:center;">
    <div style="font-size:10.5px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.03em;">${label}</div>
    <div style="margin-top:4px; font-size:20px; font-weight:700; color:${color};" class="bsc-mono">${display}</div>
  </div>`;
}

function scoresSection(d){
  const auditVal = d.audit ? d.audit.current : null;
  const auditLabel = d.audit && d.audit.currentLabel ? `Audit Score (${d.audit.currentLabel})` : 'Audit Score';
  return sectionHead('ti-clipboard-check', 'Scores') + `
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      ${scoreBadge(d.npsMeta ? `NPS (${d.npsMeta.label}${d.npsMeta.n ? `, ${d.npsMeta.n} resp.` : ''})` : 'NPS', d.nps ?? null, '', 50, 0)}
      ${scoreBadge(auditLabel, auditVal, '%', 90, 75)}
      ${scoreBadge('Customer Calling Score', null, '%', 90, 75)}
    </div>
    <div style="font-size:11px; color:var(--text-mute); margin-top:6px; font-style:italic;">Customer Calling Score is awaiting a connected calling tracker.</div>`;
}

// TESTING: detailed per-stylist pace-projected insight (see stylistPaceInsight below) is gated to
// this list of stores so it can be reviewed before rolling out network-wide. Once approved, either
// add more store names or just make stylistSection always use the detailed branch.
const STYLIST_INSIGHT_TEST_STORES = ['Jaipur Store'];

// No per-stylist target exists anywhere in the pipeline (only store-level), so there's no formal
// "bills needed" to project against. Instead: assume this stylist keeps selling at their own
// current bills/day pace for the rest of the month, project how many more bills that implies, and
// solve for the AOV those projected bills would need to average so that the stylist's FULL-MONTH
// AOV (already-achieved + projected) reaches the store's own HO AOV target for that segment. This
// mirrors the store-level "needed for the rest of the month: N bills averaging Rs.X AOV" math one
// level down, using a pace projection in place of the missing stylist target.
function stylistPaceInsight(seg, targetAov){
  if(!seg || !seg.bills || !targetAov || seg.aov >= targetAov) return null;
  const avgPerDay = seg.bills / BRIEFING_DATA.daysElapsed;
  const projRemaining = Math.round(avgPerDay * BRIEFING_DATA.daysRemaining);
  if(projRemaining <= 0){
    return {text: `At the current pace (~${avgPerDay.toFixed(2)}/day), too few bills are projected over the remaining ${BRIEFING_DATA.daysRemaining} day(s) to meaningfully project a required AOV.`, level:'mute'};
  }
  const desiredTotalRev = targetAov * (seg.bills + projRemaining);
  const revNeeded = desiredTotalRev - seg.rev;
  if(revNeeded <= 0){
    return {text: `At the current pace (~${avgPerDay.toFixed(2)}/day, ~${projRemaining} more bills projected), the month's AOV should reach target without needing a higher AOV on those bills.`, level:'good'};
  }
  const requiredAov = revNeeded / projRemaining;
  const stretch = requiredAov > seg.aov * 1.75; // more than 75% above their own current AOV -- flag as a big ask
  return {
    text: `At the current pace (~${avgPerDay.toFixed(2)} bills/day), ~${projRemaining} more bills are projected over the remaining ${BRIEFING_DATA.daysRemaining} day(s) &mdash;
      they'd need to average <b class="bsc-mono">${fmtINR(requiredAov)}</b> AOV to bring the month's AOV up to the ${fmtINR(targetAov)} target${stretch ? ' (a big jump from their current AOV -- likely needs coaching/upselling support, not just volume)' : ''}.`,
    level: stretch ? 'bad' : 'warn',
  };
}

// No per-stylist target exists anywhere in the pipeline (only store-level), so the only grounded
// comparison is each stylist's own AOV against the store's HO AOV target for that segment -- same
// number the New/Repeat Customers sections above already judge the store by. Color-code the AOV
// itself (green/red) rather than adding a separate delta column, and name the underperformers in
// a one-line callout so the manager has someone concrete to coach, not just a wall of numbers.
function stylistSection(d, store){
  const stylists = d.stylists || [];
  if(!stylists.length) return '';
  const newTarget = d.new && d.new.hoTargetAOV;
  const repTarget = d.rep && d.rep.hoTargetAOV;
  const detailed = STYLIST_INSIGHT_TEST_STORES.includes(store);

  const segCell = (seg, target) => {
    if(!seg || !seg.bills) return `<span style="color:var(--text-mute);">&mdash;</span>`;
    const aovColor = target ? (seg.aov >= target ? 'var(--good)' : 'var(--bad)') : 'var(--text)';
    return `<b style="color:${aovColor};">${fmtINR(seg.aov)}</b> <span style="color:var(--text-mute);">AOV</span> &middot;
      ${fmtINR(seg.asp)} <span style="color:var(--text-mute);">ASP</span> &middot;
      ${seg.upt.toFixed(2)} <span style="color:var(--text-mute);">UPT</span>
      <span style="color:var(--text-mute);">(${seg.bills})</span>`;
  };
  const rows = stylists.map(s => `<tr style="border-top:1px solid var(--line);">
      <td style="padding:7px 8px; font-weight:500;">${s.name}</td>
      <td style="padding:7px 8px; font-size:11.5px;" class="bsc-mono">${segCell(s.new, newTarget)}</td>
      <td style="padding:7px 8px; font-size:11.5px;" class="bsc-mono">${segCell(s.rep, repTarget)}</td>
      <td style="padding:7px 8px; text-align:right; font-weight:600;" class="bsc-mono">${fmtINR(s.totalRev)}</td>
      <td style="padding:7px 8px; text-align:right; font-size:11.5px;" class="bsc-mono">${s.targetToDate ? `<b style="color:${achColor(s.totalRev/s.targetToDate*100)};">${(s.totalRev/s.targetToDate*100).toFixed(0)}%</b> <span style="color:var(--text-mute);">of ${fmtINR(s.targetToDate)}</span>` : '<span style="color:var(--text-mute);">&mdash;</span>'}</td>
    </tr>`).join('');

  const belowNew = newTarget ? stylists.filter(s => s.new && s.new.bills && s.new.aov < newTarget) : [];
  const belowRep = repTarget ? stylists.filter(s => s.rep && s.rep.bills && s.rep.aov < repTarget) : [];

  let calloutsHtml;
  if(detailed){
    const levelColor = {good:'var(--good)', warn:'var(--warn)', bad:'var(--bad)', mute:'var(--text-mute)'};
    const detailBlock = (label, list, target) => list.map(s => {
      const insight = stylistPaceInsight(label === 'New' ? s.new : s.rep, target);
      if(!insight) return '';
      return `<div style="background:var(--panel2); border-radius:8px; padding:10px 12px; margin-top:6px;">
        <div style="font-size:12.5px; font-weight:600;">${s.name} <span style="color:var(--text-mute); font-weight:400;">&mdash; ${label}</span></div>
        <div style="font-size:12px; color:${levelColor[insight.level]}; margin-top:3px; line-height:1.6;">${insight.text}</div>
      </div>`;
    }).join('');
    calloutsHtml = `
      ${belowNew.length ? `<div style="font-size:12px; color:var(--bad); margin-top:4px;"><i class="ti ti-alert-circle"></i>&nbsp; Below New AOV target (${fmtINR(newTarget)}):</div>${detailBlock('New', belowNew, newTarget)}` : ''}
      ${belowRep.length ? `<div style="font-size:12px; color:var(--bad); margin-top:10px;"><i class="ti ti-alert-circle"></i>&nbsp; Below Repeat AOV target (${fmtINR(repTarget)}):</div>${detailBlock('Repeat', belowRep, repTarget)}` : ''}`;
  } else {
    const callouts = [];
    if(belowNew.length) callouts.push(`<div style="color:var(--bad); font-size:12px; margin-top:4px;">
      <i class="ti ti-alert-circle"></i>&nbsp; Below New AOV target (${fmtINR(newTarget)}): <b>${belowNew.map(s=>s.name).join(', ')}</b></div>`);
    if(belowRep.length) callouts.push(`<div style="color:var(--bad); font-size:12px; margin-top:4px;">
      <i class="ti ti-alert-circle"></i>&nbsp; Below Repeat AOV target (${fmtINR(repTarget)}): <b>${belowRep.map(s=>s.name).join(', ')}</b></div>`);
    calloutsHtml = callouts.join('');
  }

  return sectionHead('ti-user-star', 'Stylist-wise', 'this store, this month') + `
    ${calloutsHtml ? `<div style="margin-bottom:10px;">${calloutsHtml}</div>` : ''}
    <div style="overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
      <thead><tr style="color:var(--text-mute); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;">
        <td style="padding:6px 8px;">Stylist</td><td style="padding:6px 8px;">New (AOV &middot; ASP &middot; UPT &middot; bills)</td>
        <td style="padding:6px 8px;">Repeat (AOV &middot; ASP &middot; UPT &middot; bills)</td><td style="padding:6px 8px; text-align:right;">Total Rev</td>
        <td style="padding:6px 8px; text-align:right;">vs own target to date</td>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div style="font-size:11px; color:var(--text-mute); margin-top:6px; font-style:italic;">AOV colored green/red against the store's own HO AOV target for that segment. Revenue is compared with each stylist's own day-wise target, summed to date.</div>`;
}

function renderBriefing(store){
  const d = BRIEFING_DATA.stores[store];
  const body = document.getElementById('briefing-body');
  if(!d){ body.innerHTML = '<div style="color:var(--text-mute); padding:20px;">No briefing data for this store.</div>'; return; }

  // Every page repeats the store name in its band, so a printed sheet that gets separated from the
  // other two still says whose it is.
  const pageHead = (n, title, meta) => `<div class="brief-page-head">
      <span class="brief-page-num">Page ${n} of 3</span>
      <span class="brief-page-title">${title}</span>
      <span class="brief-page-meta">${meta}</span>
    </div>`;
  const hoDate = BRIEFING_CONTENT && BRIEFING_CONTENT.date ? fmtDateNice(BRIEFING_CONTENT.date) : '';

  body.innerHTML = `
    <section class="brief-page${d.returns && d.returns.high ? ' has-returns-alert' : ''}">
      ${pageHead(1, 'Synopsis', `As of day ${BRIEFING_DATA.daysElapsed} of the month (${BRIEFING_DATA.lastSalesDay}) &middot; ${BRIEFING_DATA.daysRemaining} day(s) remaining`)}
      <div style="font-size:20px; font-weight:700; margin-bottom:14px;">${store}</div>
      ${returnsAlert(d)}
      ${targetHero(d)}
      ${todaySection(d)}
      ${scoresSection(d)}
    </section>
    <section class="brief-page">
      ${pageHead(2, 'New, Repeat &amp; Stylist-wise', store)}
      ${newCustomerSection(d)}
      ${repeatCustomerSection(d)}
      ${stylistSection(d, store)}
    </section>
    <section class="brief-page">
      ${pageHead(3, 'General Briefing', `${store}${hoDate ? ` &middot; HO points dated ${hoDate}` : ''}`)}
      ${renderHOContent(store)}
    </section>
  `;
}

function renderHOContent(store){
  const c = BRIEFING_CONTENT;
  if(!c || !c.date) return '';

  // A reference table attached to a talking point (the HO doc often carries one as a picture).
  const hoTable = tb => `
      <div style="margin:10px 0 4px;">
        ${tb.title ? `<div style="font-size:12px; font-weight:600; color:var(--text); margin-bottom:6px;">${tb.title}</div>` : ''}
        <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr style="color:var(--text-mute); font-size:11px; text-transform:uppercase; letter-spacing:.03em;">
            ${tb.columns.map(h => `<td style="padding:5px 8px;">${h}</td>`).join('')}
          </tr></thead>
          <tbody>
            ${tb.rows.map(r => `<tr style="border-top:1px solid var(--line);">${r.map((v, i) => `<td style="padding:5px 8px; ${i ? 'color:var(--text-dim);' : 'font-weight:500;'}">${v}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>`;

  // A store flagged for high refunds + CNs (see returnsAlert) also gets it as the first talking point
  // here, so it is read out with the HO points and not only seen on page 1.
  const r = (BRIEFING_DATA.stores[store] || {}).returns;
  const returnsPoint = r && r.high ? `
    <div class="brief-keep" style="margin-bottom:12px; padding:10px 14px; background:var(--panel2); border-radius:8px; border-left:3px solid var(--bad);">
      <div style="font-size:13px; font-weight:600; color:var(--bad);">${store}: ${r.title}, ${(r.rate*100).toFixed(1)}% of revenue</div>
      <div style="font-size:13px; color:var(--text-dim); line-height:1.6; margin-top:4px;">${r.detail}</div>
      <ul style="margin:4px 0 0 18px; padding:0; font-size:13px; color:var(--text-dim); line-height:1.6;">
        ${(r.actions || []).map(a => `<li>${a}</li>`).join('')}
      </ul>
    </div>` : '';

  const points = (c.talkingPoints || []).map(p => `
    <div style="margin-bottom:10px;">
      <div style="font-size:13px; font-weight:600; color:var(--text);">${p.title}</div>
      ${p.intro ? `<div style="font-size:13px; color:var(--text-dim); line-height:1.6; margin-top:4px;">${p.intro}</div>` : ''}
      <ul style="margin:4px 0 0 18px; padding:0; font-size:13px; color:var(--text-dim); line-height:1.6;">
        ${p.body.map(b => `<li>${b}</li>`).join('')}
      </ul>
      ${(p.tables || []).map(hoTable).join('')}
    </div>`).join('');

  const spotlight = (c.productSpotlight || []).map(p => `
    <div class="brief-keep" style="background:var(--panel2); border-radius:8px; padding:12px 14px; margin-bottom:10px;">
      <div style="font-size:12px; color:var(--text-mute); font-style:italic; margin-bottom:6px;">Customer says: "${p.customerSays}"</div>
      <div style="font-size:13.5px; font-weight:600; color:var(--brass);">${p.name}</div>
      <div style="font-size:12.5px; color:var(--text-dim); margin-top:4px;">${p.description}</div>
      <div style="font-size:12px; color:var(--text-mute); margin-top:6px; line-height:1.5;">
        ${p.rememberAs ? `<b>Remember it as:</b> ${p.rememberAs} &nbsp;&middot;&nbsp; ` : ''}<b>Best for:</b> ${p.bestFor} &nbsp;&middot;&nbsp; <b>Pair it:</b> ${p.pairIt} &nbsp;&middot;&nbsp; <b>MRP:</b> ${fmtINR(p.mrp)}
      </div>
      <div style="font-size:12.5px; color:var(--text); margin-top:6px; font-style:italic;">Say this: "${p.sayThis}"</div>
    </div>`).join('');

  // These next few sections (cheat sheet / golden rule / extended TAT) are network-wide, not
  // per-store -- the HO doc doesn't always include the same sections day to day (some days it's a
  // product spotlight, others a pitch cheat sheet or a policy note), so each is only rendered when
  // that day's transcription actually has it.
  const cheatSheet = c.quickPitchCheatSheet ? `
    <div style="margin-bottom:14px;">
      <div style="font-size:13px; font-weight:600; color:var(--text); margin-bottom:8px;">Quick Pitch Cheat Sheet${c.quickPitchCheatSheet.label ? ` (${c.quickPitchCheatSheet.label})` : ''}</div>
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr style="color:var(--text-mute); font-size:11px; text-transform:uppercase; letter-spacing:.03em;">
          <td style="padding:5px 8px;">Category</td><td style="padding:5px 8px;">Customer need</td><td style="padding:5px 8px;">Remember it as</td>
        </tr></thead>
        <tbody>
          ${c.quickPitchCheatSheet.rows.map(r => `<tr style="border-top:1px solid var(--line);">
            <td style="padding:6px 8px; font-weight:500;">${r.category}</td>
            <td style="padding:6px 8px; color:var(--text-dim);">${r.customerNeed}</td>
            <td style="padding:6px 8px; color:var(--text-dim);">${r.rememberAs}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '';

  const goldenRule = c.goldenRule ? `
    <div style="background:var(--panel2); border-radius:8px; padding:12px 14px; margin-bottom:14px; border-left:3px solid var(--brass);">
      <div style="font-size:13px; font-weight:600; color:var(--brass); margin-bottom:6px;">${c.goldenRule.title}</div>
      <div style="font-size:12.5px; color:var(--text-dim); line-height:1.6;">${c.goldenRule.body}</div>
      ${c.goldenRule.example ? `<div style="font-size:12.5px; color:var(--text); margin-top:8px; font-style:italic; line-height:1.6;">${c.goldenRule.example}</div>` : ''}
    </div>` : '';

  const extendedTAT = c.extendedTAT ? `
    <div style="margin-bottom:14px;">
      <div style="font-size:13px; font-weight:600; color:var(--warn); margin-bottom:8px;">${c.extendedTAT.note || 'Extended TAT alert'}</div>
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr style="color:var(--text-mute); font-size:11px; text-transform:uppercase; letter-spacing:.03em;">
          <td style="padding:5px 8px;">Style</td><td style="padding:5px 8px;">Category</td><td style="padding:5px 8px;">Extended TAT</td>
        </tr></thead>
        <tbody>
          ${c.extendedTAT.rows.map(r => `<tr style="border-top:1px solid var(--line);">
            <td style="padding:6px 8px; font-weight:500;">${r.style}</td>
            <td style="padding:6px 8px; color:var(--text-dim);">${r.category}</td>
            <td style="padding:6px 8px; color:var(--warn);">${r.extendedTat}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '';

  const npsRows = (c.nps && c.nps.rows) || [];
  const myRow = npsRows.find(r => r.store === store);
  const npsColor = r => r.nps>=50?'var(--good)':r.nps>=0?'var(--warn)':'var(--bad)';
  const npsBlock = !c.nps ? '' : (myRow ? `
    <div style="background:var(--panel2); border-radius:8px; padding:10px 14px; margin:10px 0 0;">
      <div style="font-size:11px; color:var(--text-mute);">This store's NPS &mdash; ${c.nps.period}</div>
      <div style="margin-top:2px;">
        <span class="bsc-mono" style="font-size:19px; font-weight:700; color:${npsColor(myRow)};">${myRow.nps}%</span>
        <span style="color:var(--text-mute); font-size:12px;"> (${myRow.grandTotal} responses)</span>
      </div>
    </div>` : `<div style="color:var(--text-mute); font-size:12px; margin-top:8px;">No NPS responses for this store, ${c.nps.period || 'this period'}</div>`);

  return `
    <div>
      ${returnsPoint}
      ${points}
      ${spotlight ? `<div style="font-size:13px; font-weight:600; color:var(--text); margin:14px 0 8px;">Know Your Product${c.spotlightTitle ? ` <span style="font-weight:400; color:var(--text-dim);">&mdash; ${c.spotlightTitle}</span>` : ''}</div>${spotlight}` : ''}
      ${spotlight && c.spotlightNote ? `<div style="font-size:12.5px; color:var(--text-dim); margin:0 0 14px;"><i class="ti ti-ruler-measure" style="color:var(--brass);"></i>&nbsp; ${c.spotlightNote}</div>` : ''}
      ${cheatSheet}
      ${goldenRule}
      ${extendedTAT}
      ${npsBlock}
    </div>`;
}

function renderTrackingPanel(){
  const panel = document.getElementById('tracking-panel');
  if(!panel) return;
  const stores = Object.keys(BRIEFING_DATA.stores || {}).sort();
  const viewedCount = stores.filter(s => statusFor(s).viewed).length;
  const rows = stores.map(s => {
    const st = statusFor(s);
    const dot = st.viewed ? 'var(--good)' : 'var(--bad)';
    return `<tr>
      <td style="padding:5px 10px; font-size:12.5px;">
        <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:${dot}; margin-right:7px;"></span>${s}
      </td>
      <td style="padding:5px 10px; font-size:12px; color:var(--text-mute);">${fmtWhen(st.lastViewed) || 'Not viewed'}</td>
      <td style="padding:5px 10px; font-size:12px; color:var(--text-mute);">${fmtWhen(st.lastPrinted) || '—'}</td>
    </tr>`;
  }).join('');
  panel.innerHTML = `
    <div style="font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;">
      Viewed by ${viewedCount} of ${stores.length} stores
      ${!APPS_SCRIPT_URL ? '<span style="color:var(--warn); font-weight:400;"> (tracking backend not configured yet)</span>' : ''}
    </div>
    <div style="max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:8px;">
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="background:var(--panel2);">
          <th style="text-align:left; padding:6px 10px; font-size:11px; color:var(--text-mute);">Store</th>
          <th style="text-align:left; padding:6px 10px; font-size:11px; color:var(--text-mute);">Last viewed</th>
          <th style="text-align:left; padding:6px 10px; font-size:11px; color:var(--text-mute);">Last printed</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Stores with high refunds + credit notes this month, worst first (BRIEFING_DATA.returnsWatch).
function returnsWatchList(){
  const w = BRIEFING_DATA.returnsWatch;
  if(!w || !(w.stores || []).length) return '';
  const rows = w.stores.map(s => {
    const r = BRIEFING_DATA.stores[s].returns;
    return `<tr style="border-top:1px solid var(--line);">
      <td style="padding:5px 8px 5px 0;">${s}</td>
      <td class="bsc-mono" style="padding:5px 8px; text-align:right; color:var(--bad); font-weight:600;">${(r.rate*100).toFixed(1)}%</td>
      <td class="bsc-mono" style="padding:5px 8px; text-align:right;">${fmtINR(r.refund)}</td>
      <td class="bsc-mono" style="padding:5px 0 5px 8px; text-align:right;">${fmtINR(r.cn)}</td></tr>`;
  }).join('');
  return `<div style="background:var(--panel2); border-radius:8px; padding:10px 14px; margin-bottom:14px; border-left:3px solid var(--bad);">
    <div style="font-size:12.5px; font-weight:700; color:var(--bad);"><i class="ti ti-receipt-refund"></i>&nbsp; High refunds &amp; credit notes (1&ndash;${+w.through.slice(8)} ${fmtDateNice(w.through).split(' ')[1] || ''})</div>
    <div style="font-size:11.5px; color:var(--text-mute); margin:2px 0 6px;">As a % of each store's revenue over the same days; all-store rate ${(w.netRate*100).toFixed(1)}%. Each of these stores has the call-out at the top of its briefing.</div>
    <div style="overflow-x:auto;"><table style="font-size:12.5px; color:var(--text-dim); border-collapse:collapse; width:100%; max-width:520px;">
      <tr style="color:var(--text-mute); font-size:11px; text-transform:uppercase; letter-spacing:.04em;"><td style="padding:3px 8px 3px 0;">Store</td><td style="padding:3px 8px; text-align:right;">Refund + CN %</td><td style="padding:3px 8px; text-align:right;">Refunds</td><td style="padding:3px 0 3px 8px; text-align:right;">CN</td></tr>
      ${rows}</table></div>
  </div>`;
}

function renderSelectPage(){
  const root = document.getElementById('bsc-root');
  const stores = Object.keys(BRIEFING_DATA.stores || {}).sort();

  const contentDate = fmtDateNice(BRIEFING_CONTENT && BRIEFING_CONTENT.date);
  const salesDate = fmtDateNice(BRIEFING_DATA && BRIEFING_DATA.lastSalesDay);
  // The HO talking-points doc and the sales/target numbers are refreshed on separate schedules and
  // can legitimately be a day or more apart (e.g. an 11th doc built from "10th MTD" sales data) --
  // show both explicitly rather than one implied date, so nobody assumes they're the same day.
  const dateBanner = (contentDate || salesDate) ? `
    <div style="background:var(--panel2); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:12.5px; color:var(--text-dim);">
      ${BRIEFING_DATA.briefingFor ? `<div><b style="color:var(--text);">Store call-outs for:</b> ${fmtDateNice(BRIEFING_DATA.briefingFor)}</div>` : ''}
      ${salesDate ? `<div style="margin-top:2px;"><b style="color:var(--text);">Sales data through:</b> ${salesDate}</div>` : ''}
      ${contentDate ? `<div style="margin-top:2px;"><b style="color:var(--text);">HO talking points dated:</b> ${contentDate}</div>` : ''}
    </div>` : '';

  root.innerHTML = `
    <div style="padding:20px 24px; border-bottom:1px solid var(--line);">
      <div style="font-size:15px; font-weight:600; margin-bottom:14px;"><i class="ti ti-clipboard-text"></i>&nbsp; Store Briefing</div>
      ${dateBanner}
      ${returnsWatchList()}
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:12px;">Select a store to view its daily briefing</div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select id="store-select" class="bsc-select" style="min-width:220px;"></select>
        <button id="go-btn" class="bsc-select" style="cursor:pointer; background:var(--brass-dim); border-color:var(--brass-dim); color:#fff; font-weight:600;">View Briefing &rarr;</button>
        <a href="index.html" style="margin-left:auto; color:var(--text-mute); font-size:13px; text-decoration:none;">&larr; Back to dashboard</a>
      </div>
    </div>
    <div style="padding:20px 24px;">
      <div id="tracking-panel"></div>
    </div>
  `;

  const sel = document.getElementById('store-select');
  stores.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  document.getElementById('go-btn').onclick = () => goToStore(sel.value);
  sel.onkeydown = (e) => { if(e.key === 'Enter') goToStore(sel.value); };

  renderTrackingPanel();
}

async function goToStore(store){
  state.store = store;
  await logEvent(store, 'view');
  state.log.push({store, event:'view', timestamp:new Date().toISOString()});
  renderBriefingPage(store);
}

function goBack(){
  state.store = null;
  renderSelectPage();
}

function renderBriefingPage(store){
  const root = document.getElementById('bsc-root');
  root.innerHTML = `
    <div class="no-print" style="display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap;">
      <button id="back-btn" class="bsc-select" style="cursor:pointer;">&larr; Store list</button>
      <button id="print-btn" class="bsc-select" style="cursor:pointer;"><i class="ti ti-printer"></i>&nbsp; Print</button>
      <a href="index.html" style="margin-left:auto; color:var(--text-mute); font-size:13px; text-decoration:none;">&larr; Back to dashboard</a>
    </div>
    <div style="padding:20px 24px;">
      <div id="briefing-body"></div>
    </div>
  `;
  document.getElementById('back-btn').onclick = goBack;
  document.getElementById('print-btn').onclick = async () => {
    await logEvent(store, 'print');
    state.log.push({store, event:'print', timestamp:new Date().toISOString()});
    window.print();
  };
  renderBriefing(store);
}

async function init(){
  state.log = await loadLog();
  renderSelectPage();
}

init();

})();
</script>
</div>
</body>
</html>
