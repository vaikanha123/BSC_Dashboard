 6, "grandTotal": 7, "nps": 86}, {"store": "Express Avenue", "neutral": 0, "notLikely": 0, "veryLikely": 3, "grandTotal": 3, "nps": 100}, {"store": "Ambience Vasant Kunj", "neutral": 0, "notLikely": 0, "veryLikely": 1, "grandTotal": 1, "nps": 100}, {"store": "Koregaon Park", "neutral": 0, "notLikely": 0, "veryLikely": 5, "grandTotal": 5, "nps": 100}, {"store": "Khan Market", "neutral": 0, "notLikely": 0, "veryLikely": 3, "grandTotal": 3, "nps": 100}, {"store": "KNK Chennai", "neutral": 0, "notLikely": 0, "veryLikely": 3, "grandTotal": 3, "nps": 100}, {"store": "South Ex.", "neutral": 0, "notLikely": 0, "veryLikely": 1, "grandTotal": 1, "nps": 100}, {"store": "Lavelle Road", "neutral": 0, "notLikely": 0, "veryLikely": 4, "grandTotal": 4, "nps": 100}, {"store": "Juhu Store", "neutral": 0, "notLikely": 0, "veryLikely": 3, "grandTotal": 3, "nps": 100}, {"store": "Jaipur Store", "neutral": 0, "notLikely": 0, "veryLikely": 2, "grandTotal": 2, "nps": 100}, {"store": "Phoenix Palassio", "neutral": 0, "notLikely": 0, "veryLikely": 1, "grandTotal": 1, "nps": 100}, {"store": "Oberoi Mall Store", "neutral": 0, "notLikely": 0, "veryLikely": 1, "grandTotal": 1, "nps": 100}]}};

(function(){

const state = { store: null, log: [] };

function fmtINR(n){
  if(n === null || n === undefined) return 'n/a';
  const neg = n < 0; n = Math.abs(Math.round(n));
  const s = n.toString();
  let last3 = s.slice(-3), rest = s.slice(0,-3);
  if(rest !== '') last3 = ',' + last3;
  const formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
  return (neg?'-':'') + 'Rs' + formatted;
}
function fmtPct(n){ return (n===null||n===undefined) ? 'n/a' : (n*100).toFixed(1) + '%'; }
function fmtNum(n){ return (n===null||n===undefined) ? 'n/a' : Math.round(n).toLocaleString('en-IN'); }

async function logEvent(store, event){
  if(!APPS_SCRIPT_URL) return;
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, // avoids CORS preflight to Apps Script
      body: JSON.stringify({store, event}),
    });
  }catch(e){ /* tracking is best-effort -- never block the briefing on a network failure */ }
}

async function loadLog(){
  if(!APPS_SCRIPT_URL) return [];
  try{
    const res = await fetch(APPS_SCRIPT_URL, {method:'GET'});
    const data = await res.json();
    return data.rows || [];
  }catch(e){ return []; }
}

function statusFor(store){
  const rows = state.log.filter(r => r.store === store);
  const views = rows.filter(r => r.event === 'view');
  const prints = rows.filter(r => r.event === 'print');
  const last = arr => arr.length ? arr[arr.length-1].timestamp : null;
  return {
    viewed: views.length > 0, viewCount: views.length, lastViewed: last(views),
    printed: prints.length > 0, printCount: prints.length, lastPrinted: last(prints),
  };
}

function fmtWhen(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ' ' +
    d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}

function segmentCard(label, seg){
  if(!seg){
    return `<div style="background:var(--panel); border-radius:10px; padding:16px 18px; margin-bottom:14px;">
      <div style="font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:8px;">${label}</div>
      <div style="color:var(--text-mute); font-size:13px;">No data</div></div>`;
  }
  if(seg.noTarget){
    return `<div style="background:var(--panel); border-radius:10px; padding:16px 18px; margin-bottom:14px;">
      <div style="font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:8px;">${label}</div>
      <div style="color:var(--text-mute); font-size:13px;">No target set for this segment this month</div></div>`;
  }

  let statusLine;
  if(seg.status === 'achieved'){
    statusLine = `<div style="color:var(--good); font-size:13.5px; margin-top:10px;">
      Target already achieved for this segment &mdash; ${fmtINR(seg.surplus)} ahead of pace</div>`;
  } else if(seg.status === 'orders-hit-revenue-short'){
    statusLine = `<div style="color:var(--warn); font-size:13.5px; margin-top:10px;">
      Bills target already hit, but still ${fmtINR(seg.remainingRev)} short on revenue &mdash;
      needs extra bills beyond target, or a higher AOV on the ones already counted</div>`;
  } else {
    statusLine = `<div style="font-size:13.5px; margin-top:10px;">
      Needed for the rest of the month: <b class="bsc-mono">${fmtNum(seg.remainingOrders)}</b> more bills
      averaging <b class="bsc-mono" style="color:var(--brass);">${fmtINR(seg.requiredAOV)}</b> AOV
      to close <b class="bsc-mono">${fmtINR(seg.remainingRev)}</b></div>`;
  }

  // Nudge stores to work the phones when they're behind on repeat business specifically --
  // repeat customers are reachable by outbound call in a way new/walk-in customers aren't.
  const behindStatuses = ['on-track', 'orders-hit-revenue-short'];
  if(label === 'REPEAT CUSTOMERS' && behindStatuses.includes(seg.status)){
    statusLine += `<div style="color:var(--brass); font-size:12.5px; margin-top:6px;">
      <i class="ti ti-phone"></i>&nbsp; Behind on repeat bills &mdash; prioritize outbound calls to existing customers to close the gap</div>`;
  }

  // Footfall/conversion is supporting context, not the headline -- kept terse and muted.
  let convLine = '';
  if(seg.ffAvailable === false){
    convLine = `<div style="color:var(--text-mute); font-size:11.5px; margin-top:8px;">Footfall data not available for this store this month</div>`;
  } else if(seg.ffUnreliable){
    convLine = `<div style="color:var(--text-mute); font-size:11.5px; margin-top:8px;">
      Footfall MTD: ${fmtNum(seg.ffAchieved)} &mdash; more bills than recorded footfall, so this store's footfall
      isn't being logged reliably this month; conversion figures skipped</div>`;
  } else if(seg.ffAchieved !== undefined){
    convLine = `<div style="color:var(--text-mute); font-size:11.5px; margin-top:8px;">
      Footfall MTD ${fmtNum(seg.ffAchieved)} (${seg.avgDailyFF}/day) &middot; conversion so far ${fmtPct(seg.currentConversion)}`;
    if(seg.conversionImpossible){
      convLine += ` &middot; even at 100% conversion, projected footfall only covers ~${fmtNum(seg.projectedFFRemaining)}
        of the ${fmtNum(seg.effectiveOrdersRem)} bills still needed`
        + (seg.extraFFNeeded !== undefined ? ` (needs ~${fmtNum(seg.extraFFNeeded)} more footfall)` : '');
    } else if(seg.requiredConversion !== undefined){
      convLine += ` &middot; conversion needed on remaining days: ${fmtPct(seg.requiredConversion)}`;
    }
    convLine += `</div>`;
  }

  const aovTile = `<div style="background:var(--panel2); border-radius:8px; padding:10px 14px;">
      <div style="font-size:11px; color:var(--text-mute);">AOV &mdash; achieved / target</div>
      <div style="margin-top:2px;">
        <span class="bsc-mono" style="font-size:19px; font-weight:700;">${fmtINR(seg.currentAOV)}</span>
        <span style="color:var(--text-mute); font-size:13px;"> / </span>
        <span class="bsc-mono" style="font-size:15px; color:var(--brass);">${fmtINR(seg.hoTargetAOV)}</span>
      </div>
    </div>`;
  const billsTile = `<div style="background:var(--panel2); border-radius:8px; padding:10px 14px;">
      <div style="font-size:11px; color:var(--text-mute);">Bills &mdash; achieved / target</div>
      <div style="margin-top:2px;">
        <span class="bsc-mono" style="font-size:19px; font-weight:700;">${fmtNum(seg.achievedBills)}</span>
        <span style="color:var(--text-mute); font-size:13px;"> / </span>
        <span class="bsc-mono" style="font-size:15px; color:var(--brass);">${fmtNum(seg.effectiveTargetOrders !== undefined ? seg.effectiveTargetOrders : seg.targetOrders)}</span>
      </div>
    </div>`;

  return `<div style="background:var(--panel); border-radius:10px; padding:16px 18px; margin-bottom:14px; border-left:3px solid var(--brass-dim);">
    <div style="font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;">${label}</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      ${aovTile}
      ${billsTile}
    </div>
    <div style="font-size:12px; color:var(--text-mute); margin-top:8px;">
      Revenue: <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(seg.achievedRev)}</b> achieved of
      <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(seg.targetRev)}</b> target
    </div>
    ${statusLine}
    ${convLine}
  </div>`;
}

function renderBriefing(store){
  const d = BRIEFING_DATA.stores[store];
  const body = document.getElementById('briefing-body');
  if(!d){ body.innerHTML = '<div style="color:var(--text-mute); padding:20px;">No briefing data for this store.</div>'; return; }

  const pct = d.monthTarget ? (d.achievedTotal / d.monthTarget * 100) : 0;
  body.innerHTML = `
    <div style="font-size:12px; color:var(--text-mute); margin-bottom:4px;">
      As of day ${BRIEFING_DATA.daysElapsed} of the month (${BRIEFING_DATA.lastSalesDay}) &mdash;
      ${BRIEFING_DATA.daysRemaining} day(s) remaining
    </div>
    <div style="font-size:20px; font-weight:700; margin-bottom:4px;">${store}</div>
    <div style="font-size:13.5px; color:var(--text-dim); margin-bottom:18px;">
      Month target <b class="bsc-mono">${fmtINR(d.monthTarget)}</b> &nbsp;&middot;&nbsp;
      Achieved MTD <b class="bsc-mono">${fmtINR(d.achievedTotal)}</b> (${pct.toFixed(0)}%)
    </div>
    ${segmentCard('NEW CUSTOMERS', d.new)}
    ${segmentCard('REPEAT CUSTOMERS', d.rep)}
    ${renderHOContent(store)}
  `;
}

function renderHOContent(store){
  const c = BRIEFING_CONTENT;
  if(!c || !c.date) return '';

  const points = (c.talkingPoints || []).map(p => `
    <div style="margin-bottom:10px;">
      <div style="font-size:13px; font-weight:600; color:var(--text);">${p.title}</div>
      <ul style="margin:4px 0 0 18px; padding:0; font-size:13px; color:var(--text-dim); line-height:1.6;">
        ${p.body.map(b => `<li>${b}</li>`).join('')}
      </ul>
    </div>`).join('');

  const spotlight = (c.productSpotlight || []).map(p => `
    <div style="background:var(--panel2); border-radius:8px; padding:12px 14px; margin-bottom:10px;">
      <div style="font-size:12px; color:var(--text-mute); font-style:italic; margin-bottom:6px;">Customer says: "${p.customerSays}"</div>
      <div style="font-size:13.5px; font-weight:600; color:var(--brass);">${p.name}</div>
      <div style="font-size:12.5px; color:var(--text-dim); margin-top:4px;">${p.description}</div>
      <div style="font-size:12px; color:var(--text-mute); margin-top:6px; line-height:1.5;">
        <b>Best for:</b> ${p.bestFor} &nbsp;&middot;&nbsp; <b>Pair it:</b> ${p.pairIt} &nbsp;&middot;&nbsp; <b>MRP:</b> ${fmtINR(p.mrp)}
      </div>
      <div style="font-size:12.5px; color:var(--text); margin-top:6px; font-style:italic;">Say this: "${p.sayThis}"</div>
    </div>`).join('');

  const npsRows = (c.nps && c.nps.rows) || [];
  const myRow = npsRows.find(r => r.store === store);
  const npsColor = r => r.nps>=50?'var(--good)':r.nps>=0?'var(--warn)':'var(--bad)';
  const npsBlock = myRow ? `
    <div style="background:var(--panel2); border-radius:8px; padding:10px 14px; margin:10px 0 0;">
      <div style="font-size:11px; color:var(--text-mute);">This store's NPS &mdash; ${c.nps.period}</div>
      <div style="margin-top:2px;">
        <span class="bsc-mono" style="font-size:19px; font-weight:700; color:${npsColor(myRow)};">${myRow.nps}%</span>
        <span style="color:var(--text-mute); font-size:12px;"> (${myRow.grandTotal} responses)</span>
      </div>
    </div>` : `<div style="color:var(--text-mute); font-size:12px; margin-top:8px;">No NPS responses for this store, ${c.nps.period || 'this period'}</div>`;

  return `
    <div style="margin-top:22px; padding-top:18px; border-top:1px solid var(--line);">
      <div style="font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;">HO Briefing Points &mdash; ${c.date}</div>
      ${points}
      ${spotlight ? `<div style="font-size:13px; font-weight:600; color:var(--text); margin:14px 0 8px;">Know Your Product</div>${spotlight}` : ''}
      ${npsBlock}
    </div>`;
}

function renderTrackingPanel(){
  const panel = document.getElementById('tracking-panel');
  if(!panel) return;
  const stores = Object.keys(BRIEFING_DATA.stores || {}).sort();
  const viewedCount = stores.filter(s => statusFor(s).viewed).length;
  const rows = stores.map(s => {
    const st = statusFor(s);
    const dot = st.viewed ? 'var(--good)' : 'var(--bad)';
    return `<tr>
      <td style="padding:5px 10px; font-size:12.5px;">
        <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:${dot}; margin-right:7px;"></span>${s}
      </td>
      <td style="padding:5px 10px; font-size:12px; color:var(--text-mute);">${fmtWhen(st.lastViewed) || 'Not viewed'}</td>
      <td style="padding:5px 10px; font-size:12px; color:var(--text-mute);">${fmtWhen(st.lastPrinted) || '—'}</td>
    </tr>`;
  }).join('');
  panel.innerHTML = `
    <div style="font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;">
      Viewed by ${viewedCount} of ${stores.length} stores
      ${!APPS_SCRIPT_URL ? '<span style="color:var(--warn); font-weight:400;"> (tracking backend not configured yet)</span>' : ''}
    </div>
    <div style="max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:8px;">
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="background:var(--panel2);">
          <th style="text-align:left; padding:6px 10px; font-size:11px; color:var(--text-mute);">Store</th>
          <th style="text-align:left; padding:6px 10px; font-size:11px; color:var(--text-mute);">Last viewed</th>
          <th style="text-align:left; padding:6px 10px; font-size:11px; color:var(--text-mute);">Last printed</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderSelectPage(){
  const root = document.getElementById('bsc-root');
  const stores = Object.keys(BRIEFING_DATA.stores || {}).sort();

  root.innerHTML = `
    <div style="padding:20px 24px; border-bottom:1px solid var(--line);">
      <div style="font-size:15px; font-weight:600; margin-bottom:14px;"><i class="ti ti-clipboard-text"></i>&nbsp; Store Briefing</div>
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:12px;">Select a store to view its daily briefing</div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select id="store-select" class="bsc-select" style="min-width:220px;"></select>
        <button id="go-btn" class="bsc-select" style="cursor:pointer; background:var(--brass-dim); border-color:var(--brass-dim); color:#fff; font-weight:600;">View Briefing &rarr;</button>
        <a href="index.html" style="margin-left:auto; color:var(--text-mute); font-size:13px; text-decoration:none;">&larr; Back to dashboard</a>
      </div>
    </div>
    <div style="padding:20px 24px;">
      <div id="tracking-panel"></div>
    </div>
  `;

  const sel = document.getElementById('store-select');
  stores.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  document.getElementById('go-btn').onclick = () => goToStore(sel.value);
  sel.onkeydown = (e) => { if(e.key === 'Enter') goToStore(sel.value); };

  renderTrackingPanel();
}

async function goToStore(store){
  state.store = store;
  await logEvent(store, 'view');
  state.log.push({store, event:'view', timestamp:new Date().toISOString()});
  renderBriefingPage(store);
}

function goBack(){
  state.store = null;
  renderSelectPage();
}

function renderBriefingPage(store){
  const root = document.getElementById('bsc-root');
  root.innerHTML = `
    <div class="no-print" style="display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap;">
      <button id="back-btn" class="bsc-select" style="cursor:pointer;">&larr; Store list</button>
      <button id="print-btn" class="bsc-select" style="cursor:pointer;"><i class="ti ti-printer"></i>&nbsp; Print</button>
      <a href="index.html" style="margin-left:auto; color:var(--text-mute); font-size:13px; text-decoration:none;">&larr; Back to dashboard</a>
    </div>
    <div style="padding:20px 24px;">
      <div id="briefing-body"></div>
    </div>
  `;
  document.getElementById('back-btn').onclick = goBack;
  document.getElementById('print-btn').onclick = async () => {
    await logEvent(store, 'print');
    state.log.push({store, event:'print', timestamp:new Date().toISOString()});
    window.print();
  };
  renderBriefing(store);
}

async function init(){
  state.log = await loadLog();
  renderSelectPage();
}

init();

})();
</script>
