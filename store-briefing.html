<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSC Store Briefing</title>
<style>
  html, body { margin:0; padding:16px; background:#0e1013; }
  body { display:flex; justify-content:center; }
  .bsc-dash-wrap { width:100%; max-width:1080px; }
  @media print {
    html, body { background:#fff; padding:0; }
    .no-print { display:none !important; }
  }
</style>
</head>
<body>
<div class="bsc-dash-wrap">
<style>
  :root{
    --ink:#15181d; --panel:#1c2027; --panel2:#22262e; --line:#2c313a; --line2:#383e49;
    --brass:#c9a15b; --brass-dim:#8a713f; --text:#e9e6df; --text-dim:#b3b6bd; --text-mute:#8f94a0;
    --good:#5ea982; --bad:#c96b5e; --warn:#c9a15b;
  }
  *{box-sizing:border-box}
  .bsc-dash{font-family:'Inter',-apple-system,sans-serif; background:var(--ink); color:var(--text); line-height:1.5;
    border-radius:14px; overflow:hidden; border:1px solid var(--line); font-variant-numeric:tabular-nums;}
  .bsc-mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  select.bsc-select, button.bsc-select{background:var(--panel2); color:var(--text); border:1px solid var(--line2); border-radius:8px;
    padding:8px 12px; font-size:15px; font-family:inherit; cursor:pointer;}
  /* The briefing is three pages: 1 Synopsis, 2 New / Repeat / Stylist-wise, 3 General Briefing.
     On screen they stack with a page band between them; in print each starts a fresh sheet. */
  .brief-page + .brief-page{margin-top:34px;}
  .brief-page-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding-bottom:9px; margin-bottom:14px;
    border-bottom:1px solid var(--line2);}
  .brief-page-num{font-size:12px; font-weight:600; color:var(--brass); text-transform:uppercase; letter-spacing:.08em;}
  .brief-page-title{font-size:15px; font-weight:700; color:var(--text);}
  .brief-page-meta{margin-left:auto; font-size:13px; color:var(--text-mute);}
  /* ---- Motion & fun: mascot "Mr. Buttons", bouncy icon tabs, tape-measure bars, button confetti (see bscMotion) ---- */
  @keyframes bscRise{from{opacity:0; transform:translateY(14px) scale(.98)} to{opacity:1; transform:none}}
  @keyframes bscFade{from{opacity:0} to{opacity:1}}
  @keyframes bscPop{0%{transform:scale(.8)} 55%{transform:scale(1.12)} 100%{transform:scale(1)}}
  @keyframes bscShine{from{background-position:-160% 0} to{background-position:260% 0}}
  @keyframes bscJump{0%{transform:translateY(0) scale(1)} 30%{transform:translateY(-7px) scale(1.15) rotate(-8deg)} 60%{transform:translateY(1px) scale(.95)} 100%{transform:none}}
  @keyframes bscWiggle{0%,100%{transform:rotate(0)} 25%{transform:rotate(-14deg) scale(1.12)} 75%{transform:rotate(12deg) scale(1.12)}}
  @keyframes bscPillShimmer{from{background-position:0% 0} to{background-position:200% 0}}
  @keyframes bscWidth{from{width:0}}
  @keyframes bscStripes{from{background-position:0 0} to{background-position:24px 0}}
  @keyframes bscSnip{from{transform:translateY(-50%) rotate(-18deg)} to{transform:translateY(-50%) rotate(14deg)}}
  @keyframes bscCaret{50%{opacity:0}}
  @keyframes mBob{0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-4px) rotate(2deg)}}
  @keyframes mJump{0%,100%{transform:translateY(0) scale(1,1)} 20%{transform:translateY(2px) scale(1.06,.92)} 50%{transform:translateY(-14px) scale(.96,1.05) rotate(4deg)} 80%{transform:translateY(1px) scale(1.04,.96)}}
  @keyframes mBlink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
  @keyframes mWave{0%,100%{transform:rotate(-25deg)} 50%{transform:rotate(-85deg)}}
  @keyframes mWaveL{0%,100%{transform:rotate(25deg)} 50%{transform:rotate(85deg)}}
  @keyframes mSpark{0%,100%{opacity:0; transform:scale(.3) rotate(0)} 50%{opacity:1; transform:scale(1.1) rotate(45deg)}}
  @keyframes mDrop{0%{opacity:0; transform:translateY(-4px)} 30%{opacity:1} 100%{opacity:0; transform:translateY(8px)}}

  .bsc-rise{animation:bscRise .55s cubic-bezier(.34,1.4,.64,1) both; animation-delay:var(--bsc-d,0ms);}
  .bsc-fade{animation:bscFade .45s ease-out both; animation-delay:var(--bsc-d,0ms);}
  .bsc-pop{animation:bscPop .45s cubic-bezier(.34,1.56,.64,1) both;}
  .bsc-shine{position:relative; overflow:hidden;}
  .bsc-shine::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(105deg, transparent 35%, rgba(255,255,255,.10) 50%, transparent 65%) no-repeat;
    background-size:60% 100%; animation:bscShine 2.2s ease-in-out .6s infinite;}
  .bsc-dash button, .bsc-dash a, .bsc-dash select{transition:color .18s, background-color .18s, border-color .18s, transform .15s;}
  .bsc-dash button:active{transform:scale(.94);}
  .bsc-dash button.bsc-select:hover{border-color:var(--brass-dim); filter:brightness(1.12);}

  /* icon tabs + the sliding, glowing pill behind the active one */
  .bsc-tab{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .bsc-tab i{font-size:19px; line-height:1; display:inline-block; font-style:normal;}
  .bsc-tab:hover i{animation:bscWiggle .5s ease-in-out;}
  .bsc-tab.is-active i{animation:bscJump .65s cubic-bezier(.3,1.6,.5,1); color:var(--brass);}
  .bsc-tab-pill{position:absolute; z-index:0; border-radius:12px; pointer-events:none;
    background:linear-gradient(110deg, rgba(201,161,91,.08) 0%, rgba(201,161,91,.30) 25%, rgba(201,161,91,.08) 50%, rgba(201,161,91,.30) 75%, rgba(201,161,91,.08) 100%);
    background-size:200% 100%; border:1px solid rgba(201,161,91,.5);
    box-shadow:0 0 22px rgba(201,161,91,.28), inset 0 0 14px rgba(201,161,91,.15);
    animation:bscPillShimmer 4s linear infinite;
    transition:left .5s cubic-bezier(.34,1.56,.64,1), width .5s cubic-bezier(.34,1.56,.64,1), top .35s, height .35s;}

  /* mascot "Mr. Buttons" the butler */
  .bsc-mascot{overflow:visible; display:block; cursor:pointer;}
  .bsc-mascot .m-body{transform-box:fill-box; transform-origin:50% 100%; animation:mBob 2.6s ease-in-out infinite;}
  .bsc-mascot.mood-party .m-body{animation:mJump .8s ease-in-out infinite;}
  .bsc-mascot .m-eye{transform-box:fill-box; transform-origin:center; animation:mBlink 4.2s infinite;}
  .bsc-mascot .m-arm-r{transform-box:fill-box; transform-origin:15% 5%;}
  .bsc-mascot.mood-happy .m-arm-r, .bsc-mascot.mood-party .m-arm-r{animation:mWave 1.1s ease-in-out infinite;}
  .bsc-mascot .m-spark{transform-box:fill-box; transform-origin:center; animation:mSpark 1.3s ease-in-out infinite;}
  .bsc-mascot .m-spark:nth-of-type(2){animation-delay:.4s} .bsc-mascot .m-spark:nth-of-type(3){animation-delay:.8s}
  .bsc-mascot .m-drop{animation:mDrop 1.8s ease-in infinite;}
  .bsc-bubble{position:relative; background:var(--panel2); border:1px solid var(--line2); border-radius:14px;
    padding:8px 13px; font-size:14px; line-height:1.35; color:var(--text); max-width:270px; box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .bsc-bubble::before{content:''; position:absolute; left:-7px; top:50%; width:12px; height:12px; margin-top:-6px;
    background:var(--panel2); border-left:1px solid var(--line2); border-bottom:1px solid var(--line2); transform:rotate(45deg);}
  .bsc-caret::after{content:'▍'; color:var(--brass); margin-left:1px; animation:bscCaret .8s steps(1) infinite;}

  /* tape-measure progress bar with candy stripes and snipping scissors */
  .bsc-tape{position:relative; height:18px; border-radius:5px; background-color:var(--panel2);
    background-image:repeating-linear-gradient(90deg, var(--line2) 0 1px, transparent 1px 2%),
                     repeating-linear-gradient(90deg, var(--text-mute) 0 1.5px, transparent 1.5px 10%);
    background-size:100% 35%, 100% 70%; background-repeat:no-repeat; background-position:0 0, 0 0;
    border:1px solid var(--line2); overflow:visible;}
  .bsc-tape-fill{position:relative; height:100%; border-radius:4px; animation:bscWidth 1.6s cubic-bezier(.2,.8,.2,1) .35s both;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 6px, transparent 6px 12px) , var(--c, var(--brass));
    background-size:24px 100%, 100% 100%; box-shadow:0 0 14px var(--c, var(--brass));}
  .bsc-tape-fill::before{content:''; position:absolute; inset:0; border-radius:4px;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 6px, transparent 6px 12px); background-size:24px 100%;
    animation:bscStripes .6s linear infinite;}
  .bsc-tape-snip{position:absolute; right:-13px; top:50%; font-size:20px; transform:translateY(-50%);
    animation:bscSnip .18s ease-in-out 12 alternate both; animation-delay:.35s; filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));}
  .bsc-tape-scale{display:flex; justify-content:space-between; margin-top:4px; font-size:11px; color:var(--text-mute);}
  .bsc-mood{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; padding:4px 10px; border-radius:999px;
    background:rgba(201,161,91,.14); color:var(--brass); border:1px solid rgba(201,161,91,.35);}
  .bsc-mood.good{background:rgba(94,169,130,.15); color:var(--good); border-color:rgba(94,169,130,.4);}

  .bsc-logo{transition:transform .6s cubic-bezier(.3,.8,.25,1.3); cursor:pointer;}
  .bsc-logo:hover{transform:rotate(-20deg) scale(1.1);}

  @media (prefers-reduced-motion: reduce){
    .bsc-rise, .bsc-fade, .bsc-pop, .bsc-shine::after, .bsc-tab i, .bsc-tab-pill, .bsc-mascot *, .bsc-tape-fill,
    .bsc-tape-fill::before, .bsc-tape-snip, .bsc-caret::after{animation:none !important;}
    .bsc-tab-pill, .bsc-logo{transition:none !important;}
  }
  @media print{
    .bsc-rise, .bsc-fade, .bsc-pop, .bsc-shine::after{animation:none !important; opacity:1 !important; transform:none !important;}
    .bsc-hero-pad{padding-right:20px !important;}
  }
  @media print {
    @page { size:A4; margin:12mm; }
    /* page breaks are ignored inside a flex container or an overflow:hidden box */
    body{display:block;}
    .bsc-dash{border:none; border-radius:0; background:#fff; color:#111; overflow:visible;}
    :root{ --panel:#f7f7f7; --panel2:#f0f0f0; --text:#111; --text-dim:#333; --text-mute:#555; --line:#ccc; --line2:#bbb; }
    /* 0.9 kept the longest page 2 (an 11-stylist store) on one A4 sheet at the old text sizes; text is ~12% larger now */
    #briefing-body{zoom:.8;}
    .brief-page + .brief-page{margin-top:0; break-before:page; page-break-before:always;}
    .brief-keep, .brief-page tr{break-inside:avoid; page-break-inside:avoid;}
    /* the refunds/CN call-out adds ~130px to page 1; this keeps that page on one sheet too */
    .brief-page.has-returns-alert{zoom:.93;}  /* on top of the .8 above */
  }
</style>

<div class="bsc-dash">
  <div id="bsc-root"></div>
</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

<script>
// ---- bscMotion: the fun layer shared by index.html and store-briefing.html (no libraries) ----
// mascot(mood, size)   "Mr. Buttons", a shirt dressed as a butler: 'happy' waves, 'party' jumps, 'determined' frowns and sweats
// say(el, text)        types text into a speech bubble
// enter(el) / countUp  bouncy rise-in of a view's blocks; big numbers tick up from zero
// confetti(x, y)       a burst of shirt buttons, ribbons, stars and shirts
// tabPill(bar, el)     a glowing pill that springs from the previous tab to the new one
// Everything is skipped for prefers-reduced-motion, and count-ups snap to their final value before print.
window.bscMotion = (function(){
  const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const live = new Set();

  function enter(el, baseDelay){
    if(!el || reduced()) return;
    const base = baseDelay || 0;
    [...el.children].forEach((c, i) => {
      c.classList.remove('bsc-rise'); void c.offsetWidth;
      c.style.setProperty('--bsc-d', (base + Math.min(i, 12) * 70) + 'ms');
      c.classList.add('bsc-rise');
    });
    el.querySelectorAll('tbody').forEach(tb => {
      [...tb.rows].slice(0, 24).forEach((r, i) => {
        r.style.setProperty('--bsc-d', (base + 150 + i * 28) + 'ms');
        r.classList.add('bsc-fade');
      });
    });
  }

  const NUM = /^([^\d\-−+]{0,2})([+\-−]?)\s?([\d,]*\.?\d+)\s?([A-Za-z%]{0,3})$/;
  function countUp(el, opts){
    if(!el || reduced()) return;
    const minSize = (opts && opts.minSize) || 17;
    const nodes = [...el.querySelectorAll('div, span, b')].filter(n =>
      n.children.length === 0 && n.textContent.trim().length <= 14 && NUM.test(n.textContent.trim()) &&
      parseFloat(getComputedStyle(n).fontSize) >= minSize);
    nodes.slice(0, 40).forEach(n => {
      const text = n.textContent.trim();
      const [, pre, sign, num, suf] = text.match(NUM);
      const target = parseFloat(num.replace(/,/g, ''));
      if(!isFinite(target) || target === 0) return;
      const dec = (num.split('.')[1] || '').length;
      const grouped = num.includes(',');
      const fmt = v => pre + sign + (grouped
        ? v.toLocaleString('en-IN', {minimumFractionDigits:dec, maximumFractionDigits:dec})
        : v.toFixed(dec)) + suf;
      const job = {n, text};
      live.add(job);
      const t0 = performance.now(), dur = 1000 + Math.random() * 300;
      if(getComputedStyle(n).display === 'inline') n.style.display = 'inline-block';
      n.style.minWidth = n.offsetWidth + 'px';          // no jitter while the digits change
      (function tick(now){
        if(!live.has(job)) return;
        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        n.textContent = p < 1 ? fmt(target * e) : text;
        if(p < 1) requestAnimationFrame(tick); else { live.delete(job); n.style.minWidth = ''; }
      })(t0);
      // a background tab pauses animation frames; never leave a number stuck mid-count
      setTimeout(() => { if(live.has(job)){ live.delete(job); n.textContent = text; n.style.minWidth = ''; } }, dur + 400);
    });
  }
  function finishAll(){ live.forEach(j => { j.n.textContent = j.text; j.n.style.minWidth = ''; }); live.clear(); }
  window.addEventListener('beforeprint', finishAll);

  // ---- Mr. Buttons: a shirt on a hanger dressed as a butler (open tailcoat, bow tie, monocle, moustache, gloves, tray) ----
  function mascot(mood, size){
    mood = mood || 'happy';
    const ink = '#15181d', hair = '#2a2420', brass = '#c9a15b', cloth = '#f3efe6', seam = '#d8cfbd';
    const coat = '#2f3440', coatEdge = '#4d5462', satin = '#414857';
    const brows = mood === 'determined'
      ? `<path d="M46 51 L54 53.5 M74 51 L66 53.5" stroke="${hair}" stroke-width="2.2" stroke-linecap="round"/>`
      : `<path d="M46.5 52.5 Q50.5 50.3 54.5 52.5" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>
         <path d="M65.5 49.5 Q69.5 47 73.5 49.5" stroke="${hair}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    const mouth = {
      party: `<path d="M54 69 Q60 77 66 69 Z" fill="${ink}"/><path d="M56.5 72.5 Q60 75.5 63.5 72.5 Q60 76.5 56.5 72.5Z" fill="#d9736a"/>`,
      happy: `<path d="M55 69.5 Q60 73.5 65 69.5" stroke="${ink}" stroke-width="2" fill="none" stroke-linecap="round"/>`,
      determined: `<path d="M55 71.5 Q60 69.8 65 71.5" stroke="${ink}" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    }[mood];
    const spark = (x, y, s, c) => `<path class="m-spark" transform="translate(${x} ${y}) scale(${s})"
      d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z" fill="${c}"/>`;
    const extras = mood === 'party'
      ? spark(12, 22, .9, brass) + spark(108, 18, .8, '#5ea982') + spark(108, 92, .7, '#e3c78f')
      : mood === 'determined' ? `<path class="m-drop" d="M86 44 q4 7 0 9 q-4 -2 0 -9z" fill="#8cc3ee"/>` : '';
    return `<svg class="bsc-mascot mood-${mood}" viewBox="0 0 120 120" width="${size || 64}" height="${size || 64}" aria-hidden="true">
      ${extras}
      <g class="m-body">
        <path d="M60 31 V22 a6 6 0 1 1 6 -6" stroke="#9a9da5" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <path d="M33 41 L60 27 L87 41" stroke="#9a9da5" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
        <path d="M39 101 L42 117 L51 104 Z M81 101 L78 117 L69 104 Z" fill="#262a33" stroke="${coatEdge}" stroke-width="1.4" stroke-linejoin="round"/>
        <g class="m-arm-l">
          <path d="M37 40 L20 63 Q21 70 29 69 L41 54 Z" fill="${coat}" stroke="${coatEdge}" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M20.5 63.5 Q21.5 69.5 29 68.6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <circle cx="23.5" cy="68.5" r="5" fill="#fff" stroke="${seam}" stroke-width="1.2"/>
          <ellipse cx="19" cy="63" rx="14" ry="3.1" fill="#c9ccd3" stroke="#8a8f99" stroke-width="1.2"/>
          <path d="M8.5 62 Q19 41 29.5 62 Z" fill="#e2e5ea" stroke="#8a8f99" stroke-width="1.2"/>
          <path d="M13 57 Q15 50 20 47.5" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/>
          <circle cx="19" cy="48" r="2.2" fill="#c9ccd3" stroke="#8a8f99" stroke-width="1"/>
        </g>
        <g class="m-arm-r">
          <path d="M83 40 L100 63 Q99 70 91 69 L79 54 Z" fill="${coat}" stroke="${coatEdge}" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M99.5 63.5 Q98.5 69.5 91 68.6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <circle cx="96" cy="69" r="5" fill="#fff" stroke="${seam}" stroke-width="1.2"/>
        </g>
        <path d="M37 40 L50 31 Q60 36 70 31 L83 40 L83 104 Q60 110 37 104 Z" fill="${cloth}" stroke="${brass}" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M60 77 V106" stroke="${seam}" stroke-width="1.6"/>
        <circle cx="60" cy="85" r="2.7" fill="${brass}"/><circle cx="60" cy="96" r="2.7" fill="${brass}"/>
        <path d="M37 40 L49 32.5 L44 60 L47 105.5 Q41 105.3 37 104 Z" fill="${coat}" stroke="${coatEdge}" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M83 40 L71 32.5 L76 60 L73 105.5 Q79 105.3 83 104 Z" fill="${coat}" stroke="${coatEdge}" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M49 32.5 L44 60 L39.5 45 Z M71 32.5 L76 60 L80.5 45 Z" fill="${satin}"/>
        <path d="M76.5 72 h5.5" stroke="${coatEdge}" stroke-width="1.2"/><path d="M77 72 L81.5 72 L80.2 68.6 L78.6 70.2 Z" fill="#fff"/>
        <path d="M50 31 L60 44 L47 43 Z" fill="#fff" stroke="${brass}" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M70 31 L60 44 L73 43 Z" fill="#fff" stroke="${brass}" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M60 45 L51 40.5 L51 49.5 Z M60 45 L69 40.5 L69 49.5 Z" fill="${ink}" stroke="${brass}" stroke-width="1"/>
        <circle cx="60" cy="45" r="2.3" fill="#2a2f38" stroke="${brass}" stroke-width=".8"/>
        ${brows}
        <ellipse class="m-eye" cx="50.5" cy="58" rx="3.2" ry="4.1" fill="${ink}"/>
        <ellipse class="m-eye" cx="69.5" cy="58" rx="3.2" ry="4.1" fill="${ink}"/>
        <circle cx="51.6" cy="56.5" r="1" fill="#fff"/><circle cx="70.6" cy="56.5" r="1" fill="#fff"/>
        <circle cx="69.5" cy="58" r="7" fill="rgba(200,230,255,.25)" stroke="${brass}" stroke-width="1.8"/>
        <path d="M66.3 54.3 Q68.5 53 71 53.7" stroke="#fff" stroke-width="1" fill="none" opacity=".85"/>
        <path d="M76.3 60 Q80 66 77.5 71" stroke="${brass}" stroke-width="1.1" fill="none" stroke-dasharray="1.6 1.4"/>
        <circle cx="45" cy="64" r="3.2" fill="#e8a09a" opacity=".55"/><circle cx="75" cy="64" r="3.2" fill="#e8a09a" opacity=".55"/>
        <path d="M60 65 Q54 60.5 49 64.5 Q46.5 66.5 47.5 63.5 Q46 67.5 50.5 67 Q55.5 66.8 60 66 Q64.5 66.8 69.5 67 Q74 67.5 72.5 63.5 Q73.5 66.5 71 64.5 Q66 60.5 60 65 Z" fill="${hair}"/>
        ${mouth}
      </g>
    </svg>`;
  }

  // Types text into el (a .bsc-bubble); a newer call on the same element cancels the older one.
  function say(el, text, instant){
    if(!el) return;
    const id = (el._sayId || 0) + 1; el._sayId = id;
    if(instant || reduced()){ el.textContent = text; el.classList.remove('bsc-caret'); return; }
    const chars = [...text]; let i = 0;
    el.textContent = ''; el.classList.add('bsc-caret');
    (function step(){
      if(el._sayId !== id) return;
      el.textContent = chars.slice(0, ++i).join('');
      if(i < chars.length) setTimeout(step, 22 + Math.random() * 30);
      else setTimeout(() => { if(el._sayId === id) el.classList.remove('bsc-caret'); }, 1400);
    })();
  }

  // ---- confetti: shirt buttons, ribbons, stars, the odd shirt ----
  function confetti(originX, originY, amount){
    if(reduced()) return;
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:9999;';

(function(){

const state = { store: null, log: [] };

function fmtINR(n){
  if(n === null || n === undefined) return 'n/a';
  const neg = n < 0; n = Math.abs(Math.round(n));
  const s = n.toString();
  let last3 = s.slice(-3), rest = s.slice(0,-3);
  if(rest !== '') last3 = ',' + last3;
  const formatted = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + last3;
  return (neg?'-':'') + 'Rs' + formatted;
}
function fmtPct(n){ return (n===null||n===undefined) ? 'n/a' : (n*100).toFixed(1) + '%'; }
function fmtNum(n){ return (n===null||n===undefined) ? 'n/a' : Math.round(n).toLocaleString('en-IN'); }
function fmtDateNice(iso){
  if(!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
}

async function logEvent(store, event){
  if(!APPS_SCRIPT_URL) return;
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, // avoids CORS preflight to Apps Script
      body: JSON.stringify({store, event}),
    });
  }catch(e){ /* tracking is best-effort -- never block the briefing on a network failure */ }
}

async function loadLog(){
  if(!APPS_SCRIPT_URL) return [];
  try{
    const res = await fetch(APPS_SCRIPT_URL, {method:'GET'});
    const data = await res.json();
    return data.rows || [];
  }catch(e){ return []; }
}

function statusFor(store){
  const rows = state.log.filter(r => r.store === store);
  const views = rows.filter(r => r.event === 'view');
  const prints = rows.filter(r => r.event === 'print');
  const last = arr => arr.length ? arr[arr.length-1].timestamp : null;
  return {
    viewed: views.length > 0, viewCount: views.length, lastViewed: last(views),
    printed: prints.length > 0, printCount: prints.length, lastPrinted: last(prints),
  };
}

function fmtWhen(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) + ' ' +
    d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}

// ---- New store-manager-facing briefing flow: target pace -> new-customer diagnosis ->
// repeat-customer diagnosis -> scores -> stylist-wise -> general briefing. Each helper below
// renders one section; renderBriefing() below stitches them in that order.

function sectionHead(icon, title, sub){
  return `<div style="display:flex; align-items:baseline; gap:8px; margin:22px 0 10px;">
    <i class="ti ${icon}" style="color:var(--brass); font-size:15px;"></i>
    <div style="font-size:15px; font-weight:700; color:var(--text); letter-spacing:.01em;">${title}</div>
    ${sub ? `<div style="font-size:13px; color:var(--text-mute);">${sub}</div>` : ''}
  </div>`;
}

function targetHero(d){
  // Target-to-date (sum of this store's daily targets through today) vs achieved-to-date -- the
  // same basis the main dashboard's MTD ach% uses. Comparing achieved-to-date against the FULL
  // month's target instead (what this used to do) understates every store early in the month.
  const targetToDate = d.monthTargetToDate || 0;
  const pct = targetToDate ? (d.achievedTotal / targetToDate * 100) : 0;
  const color = achColor(pct);
  const remaining = Math.max(d.monthTarget - d.achievedTotal, 0);
  const barPct = Math.max(0, Math.min(pct, 100));
  // Mr. Buttons reacts to the number: a party at/over target, a wave when close, game face below
  const mood = pct >= 100 ? 'party' : pct >= 90 ? 'happy' : 'determined';
  const moodText = pct >= 100 ? '🏆 Target smashed!' : pct >= 90 ? '🔥 So close &mdash; push!' : '💪 Game on &mdash; let\'s chase it';
  return `<div class="bsc-shine bsc-hero-pad" data-ach="${pct.toFixed(1)}" style="background:var(--panel); border-radius:12px; padding:18px 140px 18px 20px; margin-bottom:6px; border-left:4px solid ${color};">
    <div class="no-print" style="position:absolute; right:22px; top:50%; transform:translateY(-50%); text-align:center;">${bscMotion.mascot(mood, 96)}</div>
    <div style="font-size:13px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.05em;">Target vs Achievement (to date)</div>
    <div style="display:flex; align-items:baseline; gap:14px; margin-top:6px; flex-wrap:wrap;">
      <span class="bsc-mono" style="font-size:32px; font-weight:700; color:${color};">${pct.toFixed(0)}%</span>
      <span class="bsc-mood no-print${pct >= 100 ? ' good' : ''}">${moodText}</span>
      <span style="font-size:14.5px; color:var(--text-dim);">
        <b class="bsc-mono">${fmtINR(d.achievedTotal)}</b> of <b class="bsc-mono">${fmtINR(targetToDate)}</b> target-to-date
      </span>
    </div>
    <div style="font-size:13.5px; color:var(--text-mute); margin-top:8px;">
      Full month target <b class="bsc-mono">${fmtINR(d.monthTarget)}</b>
      &middot; ${fmtINR(remaining)} left to close in ${BRIEFING_DATA.daysRemaining} day(s)
    </div>
    <div class="no-print" style="margin-top:14px;">
      <div class="bsc-tape"><div class="bsc-tape-fill" style="width:${barPct}%; --c:${color};"><span class="bsc-tape-snip">✂️</span></div></div>
      <div class="bsc-tape-scale bsc-mono"><span>0</span><span>25%</span><span>50%</span><span>75%</span><span>🎯 100%</span></div>
    </div>
  </div>`;
}

// Built by scripts/update_store_briefing.py (d.today): today's number, then the store-team levers
// that are behind target, biggest revenue cost first, then who to talk to in the huddle. The text
// is written by the script so the page and any other consumer of BRIEFING_DATA say the same thing.
function todaySection(d){
  const t = d.today;
  if(!t) return '';
  const p = t.pace, y = t.yesterday;
  const ahead = p.aheadBy >= 0;
  const yPct = y && y.target ? y.rev / y.target * 100 : null;
  const paceLine = `${ahead ? `<b style="color:var(--good);">${fmtINR(p.aheadBy)} ahead</b> of target` : `<b style="color:var(--bad);">${fmtINR(-p.aheadBy)} behind</b> target`} to date.
    ${p.needPerDay !== null ? `The month needs <b class="bsc-mono">${fmtINR(p.needPerDay)}</b> a day from here; you have averaged <b class="bsc-mono">${fmtINR(p.runRate)}</b>.` : ''}`;
  const focus = (t.focus || []).map((f, i) => `
    <div style="display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line);">
      <div class="bsc-mono" style="font-size:15px; font-weight:700; color:var(--brass); min-width:18px;">${i+1}</div>

        <div style="font-size:15px; font-weight:700; color:var(--text);">${f.title}</div>
        <div style="font-size:14px; color:var(--text-dim); margin-top:3px; line-height:1.6;">${f.detail}</div>
      </div>
    </div>`).join('');
  const noteIcon = {behind:'ti-user-exclamation', ahead:'ti-award', untagged:'ti-tag'};
  const noteColor = {behind:'var(--warn)', ahead:'var(--good)', untagged:'var(--warn)'};
  const notes = (t.stylistNotes || []).map(n => `
    <div style="font-size:14px; color:var(--text-dim); margin-top:8px; line-height:1.6;">
      <i class="ti ${noteIcon[n.kind]||'ti-user'}" style="color:${noteColor[n.kind]||'var(--text-mute)'};"></i>&nbsp; ${n.text}</div>`).join('');
  return sectionHead('ti-checklist', 'What to do today', fmtDateNice(BRIEFING_DATA.briefingFor) || '') + `
    <div class="brief-keep" style="background:var(--panel); border-radius:10px; padding:16px 18px; border-left:3px solid var(--brass);">
      <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px;">
        ${statTile("Today's target", p.todayTarget ? fmtINR(p.todayTarget) : '&mdash;')}
        ${statTile(`Yesterday (${fmtDateNice(y.date).replace(/ \d{4}$/, '')})`, `${fmtINR(y.rev)}${yPct !== null ? ` <span style="font-size:13.5px; color:var(--text-mute); font-weight:500;">${yPct.toFixed(0)}% of target &middot; ${y.bills} bills</span>` : ''}`, yPct === null ? 'var(--text)' : achColor(yPct))}
      </div>
      <div style="font-size:14px; color:var(--text-dim); margin:10px 0 12px; line-height:1.6;">${paceLine}</div>
      ${focus || `<div style="font-size:14px; color:var(--good); padding-top:10px; border-top:1px solid var(--line);">Conversion, AOV and repeat customers are all on or above target. Keep doing what is working.</div>`}
      ${notes ? `<div style="border-top:1px solid var(--line); margin-top:2px; padding-top:4px;">${notes}</div>` : ''}

}

function achColor(pct){
  if(pct >= 100) return 'var(--good)';
  if(pct >= 80) return 'var(--warn)';
  return 'var(--bad)';
}

function statTile(label, value, valueColor){
  return `<div style="background:var(--panel2); border-radius:8px; padding:10px 14px;">
    <div style="font-size:12px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.03em;">${label}</div>
    <div style="margin-top:3px; font-size:18px; font-weight:700; color:${valueColor||'var(--text)'};" class="bsc-mono">${value}</div>
  </div>`;
}

// AOV = ASP x UPT -- when AOV is below target, tell the manager which of the two levers moved
// more against them since last month, rather than just restating the AOV gap.
function diagnoseAOV(curAsp, curUpt, prevAsp, prevUpt){
  if(!curAsp || !curUpt) return '';
  if(prevAsp === undefined || prevAsp === null || prevUpt === undefined || prevUpt === null){
    return `<div style="font-size:13.5px; color:var(--text-mute); margin-top:8px;">
      ASP <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(curAsp)}</b> &middot;
      UPT <b class="bsc-mono" style="color:var(--text-dim);">${curUpt.toFixed(2)}</b></div>`;
  }
  const aspDelta = prevAsp ? (curAsp-prevAsp)/prevAsp*100 : 0;
  const uptDelta = prevUpt ? (curUpt-prevUpt)/prevUpt*100 : 0;
  const worseIsAsp = aspDelta <= uptDelta;
  const deltaStr = d => `<span style="color:${d>=0?'var(--good)':'var(--bad)'};">${d>=0?'+':''}${d.toFixed(1)}% vs last mo.</span>`;
  return `<div style="font-size:13.5px; color:var(--text-mute); margin-top:8px; line-height:1.7;">
      ASP <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(curAsp)}</b> (${deltaStr(aspDelta)}) &middot;
      UPT <b class="bsc-mono" style="color:var(--text-dim);">${curUpt.toFixed(2)}</b> (${deltaStr(uptDelta)})
    </div>
    <div style="font-size:14px; color:var(--warn); margin-top:4px;">
      <i class="ti ti-target-arrow"></i>&nbsp; ${worseIsAsp ? 'ASP' : 'UPT'} is the bigger drag on AOV here &mdash;
      ${worseIsAsp ? 'push up-selling / higher-value pieces' : 'push multi-item bills (add-ons, styling suggestions)'}</div>`;
}

// Only surface conversion when it's the actual, actionable shortfall (current below what's
// needed) -- a store can push harder on conversion today. Whether projected footfall alone could
// ever cover the remaining bills isn't something a store manager can act on, so that math isn't
// shown here even though the underlying data still has it (seg.conversionImpossible etc.).
function conversionPushLine(seg){
  if(seg.currentConversion !== undefined && seg.requiredConversion !== undefined
     && seg.currentConversion < seg.requiredConversion){
    return `<div style="color:var(--warn); font-size:14px; margin-top:8px;">
      <i class="ti ti-trending-up"></i>&nbsp; Bills behind target and conversion
      (<b class="bsc-mono">${fmtPct(seg.currentConversion)}</b>) is below what's needed
      (<b class="bsc-mono">${fmtPct(seg.requiredConversion)}</b>) &mdash; push for conversion on the floor</div>`;
  }
  return '';
}

function newCustomerSection(d){
  const seg = d.new;
  if(!seg) return '';
  if(seg.noTarget){
    return sectionHead('ti-user-plus', 'New Customers') + `<div style="color:var(--text-mute); font-size:14.5px;">No target set for this segment this month</div>`;
  }
  const aovColor = seg.hoTargetAOV ? (seg.currentAOV >= seg.hoTargetAOV ? 'var(--good)' : 'var(--bad)') : 'var(--text)';
  const belowAovTarget = seg.hoTargetAOV && seg.currentAOV < seg.hoTargetAOV;
  const billsColor = seg.status === 'achieved' ? 'var(--good)' : (seg.achievedBills/seg.targetOrders >= (BRIEFING_DATA.daysElapsed/BRIEFING_DATA.daysInMonth) ? 'var(--text)' : 'var(--warn)');

  return sectionHead('ti-user-plus', 'New Customers') + `
    <div style="background:var(--panel); border-radius:10px; padding:16px 18px; border-left:3px solid var(--brass-dim);">
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">
        ${statTile('Conversion vs target', seg.currentConversion !== undefined ? `${fmtPct(seg.currentConversion)}${seg.targetConversion ? ` <span style="font-size:13.5px; color:var(--text-mute); font-weight:500;">/ ${fmtPct(seg.targetConversion)}</span>` : ''}` : '&mdash;', seg.currentConversion !== undefined && seg.targetConversion ? (seg.currentConversion >= seg.targetConversion ? 'var(--good)' : 'var(--bad)') : undefined)}
        ${statTile('AOV vs target', `${fmtINR(seg.currentAOV)} <span style="font-size:13.5px; color:var(--text-mute); font-weight:500;">/ ${fmtINR(seg.hoTargetAOV)}</span>`, aovColor)}
        ${statTile('Bills vs target', `${fmtNum(seg.achievedBills)} <span style="font-size:13.5px; color:var(--text-mute); font-weight:500;">/ ${fmtNum(seg.targetOrders)}</span>`, billsColor)}
      </div>
      ${belowAovTarget ? diagnoseAOV(seg.currentASP, seg.currentUPT, d.prevMonth && d.prevMonth.newAsp, d.prevMonth && d.prevMonth.newUpt) : ''}
      ${conversionPushLine(seg)}
      <div style="font-size:13px; color:var(--text-mute); margin-top:10px;">

        <b class="bsc-mono" style="color:var(--text-dim);">${fmtINR(seg.targetRev)}</b> target

}

function repeatCustomerSection(d){

        ${statTile('Bills vs target', `${fmtNum(seg.achievedBills)} <span style="font-size:13.5px; color:var(--text-mute); font-weight:500;">/ ${fmtNum(seg.targetOrders)}</span>`, billsColor)}
        ${statTile('AOV vs target', `${fmtINR(seg.currentAOV)} <span style="font-size:13.5px; color:var(--text-mute); font-weight:500;">/ ${fmtINR(seg.hoTargetAOV)}</span>`, seg.hoTargetAOV && seg.currentAOV >= seg.hoTargetAOV ? 'var(--good)' : 'var(--bad)')}
      </div>

        <i class="ti ti-phone-call"></i>&nbsp; Behind on repeat bills &mdash; prioritize outbound calls to existing customers to close the gap.
        <div style="color:var(--text-mute); font-size:13px; margin-top:4px;">

// Built by scripts/update_store_briefing.py (d.returns): shown at the very top of page 1, only for a
// store whose refunds are above 0.6% of revenue or whose credit notes are above the all-store rate.
function returnsAlert(d){

    <div style="display:flex; align-items:center; gap:8px;">
      <i class="ti ti-receipt-refund" style="color:var(--bad); font-size:16px;"></i>

function scoreBadge(label, val, suffix, goodMin, warnMin){
  let color = 'var(--text-mute)';
  let display = '&mdash;';
  if(val !== null && val !== undefined){
    color = val >= goodMin ? 'var(--good)' : (val >= warnMin ? 'var(--warn)' : 'var(--bad)');
    display = val.toFixed(1) + (suffix||'');
  }
  return `<div style="background:var(--panel2); border-radius:8px; padding:12px 14px; flex:1; min-width:110px; text-align:center;">
    <div style="font-size:12px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.03em;">${label}</div>
    <div style="margin-top:4px; font-size:20px; font-weight:700; color:${color};" class="bsc-mono">${display}</div>
  </div>`;
}

function scoresSection(d){
  const auditVal = d.audit ? d.audit.current : null;
  const auditLabel = d.audit && d.audit.currentLabel ? `Audit Score (${d.audit.currentLabel})` : 'Audit Score';
  return sectionHead('ti-clipboard-check', 'Scores') + `
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      ${scoreBadge(d.npsMeta ? `NPS (${d.npsMeta.label}${d.npsMeta.n ? `, ${d.npsMeta.n} resp.` : ''})` : 'NPS', d.nps ?? null, '', 50, 0)}
      ${scoreBadge(auditLabel, auditVal, '%', 90, 75)}
      ${scoreBadge('Customer Calling Score', null, '%', 90, 75)}
    </div>
    <div style="font-size:12.5px; color:var(--text-mute); margin-top:6px; font-style:italic;">Customer Calling Score is awaiting a connected calling tracker.</div>`;
}

// TESTING: detailed per-stylist pace-projected insight (see stylistPaceInsight below) is gated to
// this list of stores so it can be reviewed before rolling out network-wide. Once approved, either
// add more store names or just make stylistSection always use the detailed branch.
const STYLIST_INSIGHT_TEST_STORES = ['Jaipur Store'];

// No per-stylist target exists anywhere in the pipeline (only store-level), so there's no formal
// "bills needed" to project against. Instead: assume this stylist keeps selling at their own
// current bills/day pace for the rest of the month, project how many more bills that implies, and
// solve for the AOV those projected bills would need to average so that the stylist's FULL-MONTH
// AOV (already-achieved + projected) reaches the store's own HO AOV target for that segment. This
// mirrors the store-level "needed for the rest of the month: N bills averaging Rs.X AOV" math one
// level down, using a pace projection in place of the missing stylist target.
function stylistPaceInsight(seg, targetAov){
  if(!seg || !seg.bills || !targetAov || seg.aov >= targetAov) return null;
  const avgPerDay = seg.bills / BRIEFING_DATA.daysElapsed;
  const projRemaining = Math.round(avgPerDay * BRIEFING_DATA.daysRemaining);
  if(projRemaining <= 0){
    return {text: `At the current pace (~${avgPerDay.toFixed(2)}/day), too few bills are projected over the remaining ${BRIEFING_DATA.daysRemaining} day(s) to meaningfully project a required AOV.`, level:'mute'};
  }
  const desiredTotalRev = targetAov * (seg.bills + projRemaining);
  const revNeeded = desiredTotalRev - seg.rev;
  if(revNeeded <= 0){
    return {text: `At the current pace (~${avgPerDay.toFixed(2)}/day, ~${projRemaining} more bills projected), the month's AOV should reach target without needing a higher AOV on those bills.`, level:'good'};
  }
  const requiredAov = revNeeded / projRemaining;
  const stretch = requiredAov > seg.aov * 1.75; // more than 75% above their own current AOV -- flag as a big ask
  return {
    text: `At the current pace (~${avgPerDay.toFixed(2)} bills/day), ~${projRemaining} more bills are projected over the remaining ${BRIEFING_DATA.daysRemaining} day(s) &mdash;
      they'd need to average <b class="bsc-mono">${fmtINR(requiredAov)}</b> AOV to bring the month's AOV up to the ${fmtINR(targetAov)} target${stretch ? ' (a big jump from their current AOV -- likely needs coaching/upselling support, not just volume)' : ''}.`,
    level: stretch ? 'bad' : 'warn',
  };
}

// No per-stylist target exists anywhere in the pipeline (only store-level), so the only grounded
// comparison is each stylist's own AOV against the store's HO AOV target for that segment -- same
// number the New/Repeat Customers sections above already judge the store by. Color-code the AOV
// itself (green/red) rather than adding a separate delta column, and name the underperformers in
// a one-line callout so the manager has someone concrete to coach, not just a wall of numbers.
function stylistSection(d, store){
  const stylists = d.stylists || [];
  if(!stylists.length) return '';
  const newTarget = d.new && d.new.hoTargetAOV;
  const repTarget = d.rep && d.rep.hoTargetAOV;
  const detailed = STYLIST_INSIGHT_TEST_STORES.includes(store);

  const segCell = (seg, target) => {
    if(!seg || !seg.bills) return `<span style="color:var(--text-mute);">&mdash;</span>`;
    const aovColor = target ? (seg.aov >= target ? 'var(--good)' : 'var(--bad)') : 'var(--text)';
    return `<b style="color:${aovColor};">${fmtINR(seg.aov)}</b> <span style="color:var(--text-mute);">AOV</span> &middot;
      ${fmtINR(seg.asp)} <span style="color:var(--text-mute);">ASP</span> &middot;
      ${seg.upt.toFixed(2)} <span style="color:var(--text-mute);">UPT</span>
      <span style="color:var(--text-mute);">(${seg.bills})</span>`;
  };
  const rows = stylists.map(s => `<tr style="border-top:1px solid var(--line);">
      <td style="padding:7px 8px; font-weight:500;">${s.name}</td>
      <td style="padding:7px 8px; font-size:13px;" class="bsc-mono">${segCell(s.new, newTarget)}</td>
      <td style="padding:7px 8px; font-size:13px;" class="bsc-mono">${segCell(s.rep, repTarget)}</td>
      <td style="padding:7px 8px; text-align:right; font-weight:600;" class="bsc-mono">${fmtINR(s.totalRev)}</td>
      <td style="padding:7px 8px; text-align:right; font-size:13px;" class="bsc-mono">${s.targetToDate ? `<b style="color:${achColor(s.totalRev/s.targetToDate*100)};">${(s.totalRev/s.targetToDate*100).toFixed(0)}%</b> <span style="color:var(--text-mute);">of ${fmtINR(s.targetToDate)}</span>` : '<span style="color:var(--text-mute);">&mdash;</span>'}</td>
    </tr>`).join('');

  const belowNew = newTarget ? stylists.filter(s => s.new && s.new.bills && s.new.aov < newTarget) : [];
  const belowRep = repTarget ? stylists.filter(s => s.rep && s.rep.bills && s.rep.aov < repTarget) : [];

  let calloutsHtml;
  if(detailed){
    const levelColor = {good:'var(--good)', warn:'var(--warn)', bad:'var(--bad)', mute:'var(--text-mute)'};
    const detailBlock = (label, list, target) => list.map(s => {
      const insight = stylistPaceInsight(label === 'New' ? s.new : s.rep, target);
      if(!insight) return '';
      return `<div style="background:var(--panel2); border-radius:8px; padding:10px 12px; margin-top:6px;">
        <div style="font-size:14px; font-weight:600;">${s.name} <span style="color:var(--text-mute); font-weight:400;">&mdash; ${label}</span></div>
        <div style="font-size:13.5px; color:${levelColor[insight.level]}; margin-top:3px; line-height:1.6;">${insight.text}</div>
      </div>`;
    }).join('');
    calloutsHtml = `
      ${belowNew.length ? `<div style="font-size:13.5px; color:var(--bad); margin-top:4px;"><i class="ti ti-alert-circle"></i>&nbsp; Below New AOV target (${fmtINR(newTarget)}):</div>${detailBlock('New', belowNew, newTarget)}` : ''}
      ${belowRep.length ? `<div style="font-size:13.5px; color:var(--bad); margin-top:10px;"><i class="ti ti-alert-circle"></i>&nbsp; Below Repeat AOV target (${fmtINR(repTarget)}):</div>${detailBlock('Repeat', belowRep, repTarget)}` : ''}`;
  } else {
    const callouts = [];
    if(belowNew.length) callouts.push(`<div style="color:var(--bad); font-size:13.5px; margin-top:4px;">
      <i class="ti ti-alert-circle"></i>&nbsp; Below New AOV target (${fmtINR(newTarget)}): <b>${belowNew.map(s=>s.name).join(', ')}</b></div>`);
    if(belowRep.length) callouts.push(`<div style="color:var(--bad); font-size:13.5px; margin-top:4px;">
      <i class="ti ti-alert-circle"></i>&nbsp; Below Repeat AOV target (${fmtINR(repTarget)}): <b>${belowRep.map(s=>s.name).join(', ')}</b></div>`);
    calloutsHtml = callouts.join('');
  }

  return sectionHead('ti-user-star', 'Stylist-wise', 'this store, this month') + `
    ${calloutsHtml ? `<div style="margin-bottom:10px;">${calloutsHtml}</div>` : ''}
    <div style="overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; font-size:14px;">
      <thead><tr style="color:var(--text-mute); font-size:12px; text-transform:uppercase; letter-spacing:.03em;">
        <td style="padding:6px 8px;">Stylist</td><td style="padding:6px 8px;">New (AOV &middot; ASP &middot; UPT &middot; bills)</td>
        <td style="padding:6px 8px;">Repeat (AOV &middot; ASP &middot; UPT &middot; bills)</td><td style="padding:6px 8px; text-align:right;">Total Rev</td>
        <td style="padding:6px 8px; text-align:right;">vs own target to date</td>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    <div style="font-size:12.5px; color:var(--text-mute); margin-top:6px; font-style:italic;">AOV colored green/red against the store's own HO AOV target for that segment. Revenue is compared with each stylist's own day-wise target, summed to date.</div>`;
}

function renderBriefing(store){
  const d = BRIEFING_DATA.stores[store];
  const body = document.getElementById('briefing-body');
  if(!d){ body.innerHTML = '<div style="color:var(--text-mute); padding:20px;">No briefing data for this store.</div>'; return; }

  // Every page repeats the store name in its band, so a printed sheet that gets separated from the
  // other two still says whose it is.
  const pageHead = (n, title, meta) => `<div class="brief-page-head">
      <span class="brief-page-num">Page ${n} of 3</span>
      <span class="brief-page-title">${title}</span>
      <span class="brief-page-meta">${meta}</span>
    </div>`;
  const hoDate = BRIEFING_CONTENT && BRIEFING_CONTENT.date ? fmtDateNice(BRIEFING_CONTENT.date) : '';

  body.innerHTML = `
    <section class="brief-page${d.returns && d.returns.high ? ' has-returns-alert' : ''}">
      ${pageHead(1, 'Synopsis', `As of day ${BRIEFING_DATA.daysElapsed} of the month (${BRIEFING_DATA.lastSalesDay}) &middot; ${BRIEFING_DATA.daysRemaining} day(s) remaining`)}
      <div style="font-size:20px; font-weight:700; margin-bottom:14px;">${store}</div>
      ${returnsAlert(d)}
      ${targetHero(d)}
      ${todaySection(d)}
      ${scoresSection(d)}
    </section>
    <section class="brief-page">
      ${pageHead(2, 'New, Repeat &amp; Stylist-wise', store)}
      ${newCustomerSection(d)}
      ${repeatCustomerSection(d)}
      ${stylistSection(d, store)}
    </section>
    <section class="brief-page">
      ${pageHead(3, 'General Briefing', `${store}${hoDate ? ` &middot; HO points dated ${hoDate}` : ''}`)}
      ${renderHOContent(store)}
    </section>
  `;

  // Each page rises in, its big numbers tick up, and a store at or past its target-to-date gets confetti.
  body.querySelectorAll('.brief-page').forEach((pg, i) => bscMotion.enter(pg, i * 140));
  bscMotion.countUp(body);
  const hero = body.querySelector('[data-ach]');
  if(hero && parseFloat(hero.dataset.ach) >= 100){
    setTimeout(() => {
      const m = hero.querySelector('.bsc-mascot') || hero;
      const r = m.getBoundingClientRect();
      bscMotion.confetti(r.left + r.width / 2, r.top + r.height / 3, 220);
    }, 900);
  }
}

function renderHOContent(store){
  const c = BRIEFING_CONTENT;
  if(!c || !c.date) return '';

  // A reference table attached to a talking point (the HO doc often carries one as a picture).
  const hoTable = tb => `
      <div style="margin:10px 0 4px;">
        ${tb.title ? `<div style="font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:6px;">${tb.title}</div>` : ''}
        <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:14px;">
          <thead><tr style="color:var(--text-mute); font-size:12.5px; text-transform:uppercase; letter-spacing:.03em;">
            ${tb.columns.map(h => `<td style="padding:5px 8px;">${h}</td>`).join('')}
          </tr></thead>
          <tbody>
            ${tb.rows.map(r => `<tr style="border-top:1px solid var(--line);">${r.map((v, i) => `<td style="padding:5px 8px; ${i ? 'color:var(--text-dim);' : 'font-weight:500;'}">${v}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
        </div>
      </div>`;

  // A store flagged for high refunds + CNs (see returnsAlert) also gets it as the first talking point
  // here, so it is read out with the HO points and not only seen on page 1.
  const r = (BRIEFING_DATA.stores[store] || {}).returns;
  const returnsPoint = r && r.high ? `
    <div class="brief-keep" style="margin-bottom:12px; padding:10px 14px; background:var(--panel2); border-radius:8px; border-left:3px solid var(--bad);">
      <div style="font-size:14.5px; font-weight:600; color:var(--bad);">${store}: ${r.title}, ${(r.rate*100).toFixed(1)}% of revenue</div>
      <div style="font-size:14.5px; color:var(--text-dim); line-height:1.6; margin-top:4px;">${r.detail}</div>
      ${r.why ? `<div style="font-size:14.5px; color:var(--text); line-height:1.6; margin-top:4px;">${r.why}</div>` : ''}
      <ul style="margin:4px 0 0 18px; padding:0; font-size:14.5px; color:var(--text-dim); line-height:1.6;">
        ${(r.actions || []).map(a => `<li>${a}</li>`).join('')}
      </ul>
    </div>` : '';

  const points = (c.talkingPoints || []).map(p => `
    <div style="margin-bottom:10px;">
      <div style="font-size:14.5px; font-weight:600; color:var(--text);">${p.title}</div>
      ${p.intro ? `<div style="font-size:14.5px; color:var(--text-dim); line-height:1.6; margin-top:4px;">${p.intro}</div>` : ''}
      ${(p.body || []).length ? `<ul style="margin:4px 0 0 18px; padding:0; font-size:14.5px; color:var(--text-dim); line-height:1.6;">
        ${p.body.map(b => `<li>${b}</li>`).join('')}
      </ul>` : ''}
      ${(p.tables || []).map(hoTable).join('')}
    </div>`).join('');

  const spotlight = (c.productSpotlight || []).map(p => `
    <div class="brief-keep" style="background:var(--panel2); border-radius:8px; padding:12px 14px; margin-bottom:10px;">
      <div style="font-size:13.5px; color:var(--text-mute); font-style:italic; margin-bottom:6px;">Customer says: "${p.customerSays}"</div>
      <div style="font-size:15px; font-weight:600; color:var(--brass);">${p.name}</div>
      <div style="font-size:14px; color:var(--text-dim); margin-top:4px;">${p.description}</div>
      <div style="font-size:13.5px; color:var(--text-mute); margin-top:6px; line-height:1.5;">
        ${p.rememberAs ? `<b>Remember it as:</b> ${p.rememberAs} &nbsp;&middot;&nbsp; ` : ''}<b>Best for:</b> ${p.bestFor} &nbsp;&middot;&nbsp; <b>Pair it:</b> ${p.pairIt} &nbsp;&middot;&nbsp; <b>MRP:</b> ${fmtINR(p.mrp)}
      </div>
      <div style="font-size:14px; color:var(--text); margin-top:6px; font-style:italic;">Say this: "${p.sayThis}"</div>
    </div>`).join('');

  // These next few sections (cheat sheet / golden rule / extended TAT) are network-wide, not
  // per-store -- the HO doc doesn't always include the same sections day to day (some days it's a
  // product spotlight, others a pitch cheat sheet or a policy note), so each is only rendered when
  // that day's transcription actually has it.
  const cheatSheet = c.quickPitchCheatSheet ? `
    <div style="margin-bottom:14px;">
      <div style="font-size:14.5px; font-weight:600; color:var(--text); margin-bottom:8px;">Quick Pitch Cheat Sheet${c.quickPitchCheatSheet.label ? ` (${c.quickPitchCheatSheet.label})` : ''}</div>
      <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <thead><tr style="color:var(--text-mute); font-size:12.5px; text-transform:uppercase; letter-spacing:.03em;">
          <td style="padding:5px 8px;">Category</td><td style="padding:5px 8px;">Customer need</td><td style="padding:5px 8px;">Remember it as</td>
        </tr></thead>
        <tbody>
          ${c.quickPitchCheatSheet.rows.map(r => `<tr style="border-top:1px solid var(--line);">
            <td style="padding:6px 8px; font-weight:500;">${r.category}</td>
            <td style="padding:6px 8px; color:var(--text-dim);">${r.customerNeed}</td>
            <td style="padding:6px 8px; color:var(--text-dim);">${r.rememberAs}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '';

  const goldenRule = c.goldenRule ? `
    <div style="background:var(--panel2); border-radius:8px; padding:12px 14px; margin-bottom:14px; border-left:3px solid var(--brass);">
      <div style="font-size:14.5px; font-weight:600; color:var(--brass); margin-bottom:6px;">${c.goldenRule.title}</div>
      <div style="font-size:14px; color:var(--text-dim); line-height:1.6;">${c.goldenRule.body}</div>
      ${c.goldenRule.example ? `<div style="font-size:14px; color:var(--text); margin-top:8px; font-style:italic; line-height:1.6;">${c.goldenRule.example}</div>` : ''}
    </div>` : '';

  const extendedTAT = c.extendedTAT ? `
    <div style="margin-bottom:14px;">
      <div style="font-size:14.5px; font-weight:600; color:var(--warn); margin-bottom:8px;">${c.extendedTAT.note || 'Extended TAT alert'}</div>
      <table style="width:100%; border-collapse:collapse; font-size:14px;">
        <thead><tr style="color:var(--text-mute); font-size:12.5px; text-transform:uppercase; letter-spacing:.03em;">
          <td style="padding:5px 8px;">Style</td><td style="padding:5px 8px;">Category</td><td style="padding:5px 8px;">Extended TAT</td>
        </tr></thead>
        <tbody>
          ${c.extendedTAT.rows.map(r => `<tr style="border-top:1px solid var(--line);">
            <td style="padding:6px 8px; font-weight:500;">${r.style}</td>
            <td style="padding:6px 8px; color:var(--text-dim);">${r.category}</td>
            <td style="padding:6px 8px; color:var(--warn);">${r.extendedTat}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '';

  const npsRows = (c.nps && c.nps.rows) || [];
  const myRow = npsRows.find(r => r.store === store);
  const npsColor = r => r.nps>=50?'var(--good)':r.nps>=0?'var(--warn)':'var(--bad)';
  const npsBlock = !c.nps ? '' : (myRow ? `
    <div style="background:var(--panel2); border-radius:8px; padding:10px 14px; margin:10px 0 0;">
      <div style="font-size:12.5px; color:var(--text-mute);">This store's NPS &mdash; ${c.nps.period}</div>
      <div style="margin-top:2px;">
        <span class="bsc-mono" style="font-size:19px; font-weight:700; color:${npsColor(myRow)};">${myRow.nps}%</span>
        <span style="color:var(--text-mute); font-size:13.5px;"> (${myRow.grandTotal} responses)</span>
      </div>
    </div>` : `<div style="color:var(--text-mute); font-size:13.5px; margin-top:8px;">No NPS responses for this store, ${c.nps.period || 'this period'}</div>`);

  return `
    <div>
      ${returnsPoint}
      ${points}
      ${spotlight ? `<div style="font-size:14.5px; font-weight:600; color:var(--text); margin:14px 0 8px;">Know Your Product${c.spotlightTitle ? ` <span style="font-weight:400; color:var(--text-dim);">&mdash; ${c.spotlightTitle}</span>` : ''}</div>${spotlight}` : ''}
      ${spotlight && c.spotlightNote ? `<div style="font-size:14px; color:var(--text-dim); margin:0 0 14px;"><i class="ti ti-ruler-measure" style="color:var(--brass);"></i>&nbsp; ${c.spotlightNote}</div>` : ''}
      ${cheatSheet}
      ${goldenRule}
      ${extendedTAT}
      ${npsBlock}
    </div>`;
}

function renderTrackingPanel(){
  const panel = document.getElementById('tracking-panel');
  if(!panel) return;
  const stores = Object.keys(BRIEFING_DATA.stores || {}).sort();
  const viewedCount = stores.filter(s => statusFor(s).viewed).length;
  const rows = stores.map(s => {
    const st = statusFor(s);
    const dot = st.viewed ? 'var(--good)' : 'var(--bad)';
    return `<tr>
      <td style="padding:5px 10px; font-size:14px;">
        <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:${dot}; margin-right:7px;"></span>${s}
      </td>
      <td style="padding:5px 10px; font-size:13.5px; color:var(--text-mute);">${fmtWhen(st.lastViewed) || 'Not viewed'}</td>
      <td style="padding:5px 10px; font-size:13.5px; color:var(--text-mute);">${fmtWhen(st.lastPrinted) || '—'}</td>
    </tr>`;
  }).join('');
  panel.innerHTML = `
    <div style="font-size:14.5px; font-weight:600; color:var(--text-dim); margin-bottom:10px;">
      Viewed by ${viewedCount} of ${stores.length} stores
      ${!APPS_SCRIPT_URL ? '<span style="color:var(--warn); font-weight:400;"> (tracking backend not configured yet)</span>' : ''}
    </div>
    <div style="max-height:220px; overflow-y:auto; border:1px solid var(--line); border-radius:8px;">
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="background:var(--panel2);">
          <th style="text-align:left; padding:6px 10px; font-size:12.5px; color:var(--text-mute);">Store</th>
          <th style="text-align:left; padding:6px 10px; font-size:12.5px; color:var(--text-mute);">Last viewed</th>
          <th style="text-align:left; padding:6px 10px; font-size:12.5px; color:var(--text-mute);">Last printed</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Stores with high refunds + credit notes this month, worst first (BRIEFING_DATA.returnsWatch).
function returnsWatchList(){
  const w = BRIEFING_DATA.returnsWatch;
  if(!w || !(w.stores || []).length) return '';
  const rows = w.stores.map(s => {
    const r = BRIEFING_DATA.stores[s].returns;
    return `<tr style="border-top:1px solid var(--line);">
      <td style="padding:5px 8px 5px 0;">${s}</td>
      <td class="bsc-mono" style="padding:5px 8px; text-align:right; ${r.refundRate > (w.refundLimit||0.006) ? 'color:var(--bad); font-weight:600;' : ''}">${fmtINR(r.refund)} <small>${(r.refundRate*100).toFixed(1)}%</small></td>
      <td class="bsc-mono" style="padding:5px 8px; text-align:right; ${r.cnRate > (w.netCnRate||0) ? 'color:var(--bad); font-weight:600;' : ''}">${fmtINR(r.cn)} <small>${(r.cnRate*100).toFixed(1)}%</small></td>
      <td style="padding:5px 0 5px 8px;">${r.mainReason || '&mdash;'}</td></tr>`;
  }).join('');
  return `<div style="background:var(--panel2); border-radius:8px; padding:10px 14px; margin-bottom:14px; border-left:3px solid var(--bad);">
    <div style="font-size:14px; font-weight:700; color:var(--bad);"><i class="ti ti-receipt-refund"></i>&nbsp; High refunds &amp; credit notes (1&ndash;${+w.through.slice(8)} ${fmtDateNice(w.through).split(' ')[1] || ''})</div>
    <div style="font-size:13px; color:var(--text-mute); margin:2px 0 6px;">As a % of each store's revenue over the same days. Flagged when refunds are above ${((w.refundLimit||0.006)*100).toFixed(1)}% or credit notes are above the all-store average of ${((w.netCnRate||0)*100).toFixed(1)}%. Each of these stores has the call-out at the top of its briefing.</div>
    <div style="overflow-x:auto;"><table style="font-size:14px; color:var(--text-dim); border-collapse:collapse; width:100%; max-width:640px;">
      <tr style="color:var(--text-mute); font-size:12.5px; text-transform:uppercase; letter-spacing:.04em;"><td style="padding:3px 8px 3px 0;">Store</td><td style="padding:3px 8px; text-align:right;">Refunds</td><td style="padding:3px 8px; text-align:right;">CN</td><td style="padding:3px 0 3px 8px;">Main reason</td></tr>
      ${rows}</table></div>
  </div>`;
}

function renderSelectPage(){
  const root = document.getElementById('bsc-root');
  const stores = Object.keys(BRIEFING_DATA.stores || {}).sort();

  const contentDate = fmtDateNice(BRIEFING_CONTENT && BRIEFING_CONTENT.date);
  const salesDate = fmtDateNice(BRIEFING_DATA && BRIEFING_DATA.lastSalesDay);
  // The HO talking-points doc and the sales/target numbers are refreshed on separate schedules and
  // can legitimately be a day or more apart (e.g. an 11th doc built from "10th MTD" sales data) --
  // show both explicitly rather than one implied date, so nobody assumes they're the same day.
  const dateBanner = (contentDate || salesDate) ? `
    <div style="background:var(--panel2); border-radius:8px; padding:10px 14px; margin-bottom:14px; font-size:14px; color:var(--text-dim);">
      ${BRIEFING_DATA.briefingFor ? `<div><b style="color:var(--text);">Store call-outs for:</b> ${fmtDateNice(BRIEFING_DATA.briefingFor)}</div>` : ''}
      ${salesDate ? `<div style="margin-top:2px;"><b style="color:var(--text);">Sales data through:</b> ${salesDate}</div>` : ''}
      ${contentDate ? `<div style="margin-top:2px;"><b style="color:var(--text);">HO talking points dated:</b> ${contentDate}</div>` : ''}
    </div>` : '';

  root.innerHTML = `
    <div style="padding:20px 24px; border-bottom:1px solid var(--line);">
      <div style="font-size:15px; font-weight:600; margin-bottom:14px;"><i class="ti ti-clipboard-text"></i>&nbsp; Store Briefing</div>
      <div class="no-print" style="display:flex; align-items:center; gap:14px; margin:-4px 0 14px;">
        <div id="picker-buddy" style="cursor:pointer;" title="Mr. Buttons">${bscMotion.mascot('happy', 84)}</div>
        <div class="bsc-bubble" id="picker-bubble" style="font-size:15px; max-width:360px;"></div>
      </div>
      ${dateBanner}
      ${returnsWatchList()}
      <div style="font-size:14.5px; color:var(--text-dim); margin-bottom:12px;">Select a store to view its daily briefing</div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <select id="store-select" class="bsc-select" style="min-width:220px;"></select>
        <button id="go-btn" class="bsc-select" style="cursor:pointer; background:var(--brass-dim); border-color:var(--brass-dim); color:#fff; font-weight:600;">View Briefing &rarr;</button>
        <a href="index.html" style="margin-left:auto; color:var(--text-mute); font-size:14.5px; text-decoration:none;">&larr; Back to dashboard</a>
      </div>
    </div>
    <div style="padding:20px 24px;">
      <div id="tracking-panel"></div>
    </div>
  `;

  const sel = document.getElementById('store-select');
  stores.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
  document.getElementById('go-btn').onclick = () => goToStore(sel.value);
  sel.onkeydown = (e) => { if(e.key === 'Enter') goToStore(sel.value); };

  renderTrackingPanel();
  bscMotion.enter(root.firstElementChild);
  bscMotion.enter(root.lastElementChild, 300);
  const hour = new Date().getHours();
  const hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const bubble = document.getElementById('picker-bubble');
  setTimeout(() => bscMotion.say(bubble, `${hello}, team! 🎩 Mr. Buttons at your service. Pick your store and let's make today count.`), 350);
  document.getElementById('picker-buddy').onclick = (e) => {
    const holder = document.getElementById('picker-buddy');
    holder.innerHTML = bscMotion.mascot('party', 84);
    bscMotion.confetti(e.clientX, e.clientY);
    bscMotion.say(bubble, 'Splendid! Now, off you go and sell some shirts 👔🎉');
    setTimeout(() => { if(holder.isConnected) holder.innerHTML = bscMotion.mascot('happy', 84); }, 2600);
  };
}

async function goToStore(store){
  state.store = store;
  await logEvent(store, 'view');
  state.log.push({store, event:'view', timestamp:new Date().toISOString()});
  renderBriefingPage(store);
}

function goBack(){
  state.store = null;
  renderSelectPage();
}

function renderBriefingPage(store){
  const root = document.getElementById('bsc-root');
  root.innerHTML = `
    <div class="no-print" style="display:flex; align-items:center; gap:12px; padding:20px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap;">
      <button id="back-btn" class="bsc-select" style="cursor:pointer;">&larr; Store list</button>
      <button id="print-btn" class="bsc-select" style="cursor:pointer;"><i class="ti ti-printer"></i>&nbsp; Print</button>
      <a href="index.html" style="margin-left:auto; color:var(--text-mute); font-size:14.5px; text-decoration:none;">&larr; Back to dashboard</a>
    </div>
    <div style="padding:20px 24px;">
      <div id="briefing-body"></div>
    </div>
  `;
  document.getElementById('back-btn').onclick = goBack;
  document.getElementById('print-btn').onclick = async () => {
    await logEvent(store, 'print');
    state.log.push({store, event:'print', timestamp:new Date().toISOString()});
    window.print();
  };
  renderBriefing(store);
}

async function init(){
  state.log = await loadLog();
  renderSelectPage();
}

init();

})();
</script>
</div>
</body>
</html>
