function renderStylists(body, days){
  const stylistTotals = {};
  const stylistStoreAgg = {}; // stylist -> store -> revenue, to find their home store
  days.forEach(dk => {
    const revs = state.stylistRevDays[dk] || {};
    const bills = state.stylistBillDays[dk] || {};
    const storeRev = state.stylistStoreRevDays[dk] || {};
    Object.keys(revs).forEach(st => {
      stylistTotals[st] = stylistTotals[st] || {rev:0, bills:0};
      stylistTotals[st].rev += revs[st] || 0;
      stylistTotals[st].bills += bills[st] || 0;
    });
    Object.keys(storeRev).forEach(st => {
      stylistStoreAgg[st] = stylistStoreAgg[st] || {};
      Object.keys(storeRev[st]).forEach(store => {
        stylistStoreAgg[st][store] = (stylistStoreAgg[st][store] || 0) + storeRev[st][store];
      });
    });
  });

  function homeStoreFor(stylist){
    const stores = stylistStoreAgg[stylist];
    if(!stores) return '\u2014';
    let best = null, bestRev = -1;
    Object.keys(stores).forEach(store => { if(stores[store] > bestRev){ bestRev = stores[store]; best = store; } });
    return best || '\u2014';
  }

  const stArr = Object.keys(stylistTotals).map(st => ({
    stylist: st, store: homeStoreFor(st), rev: stylistTotals[st].rev, bills: stylistTotals[st].bills,
    aov: stylistTotals[st].bills ? stylistTotals[st].rev/stylistTotals[st].bills : 0,
  })).sort((a,b) => b.rev - a.rev);

  const cmk = currentMonthKey();

  if(stArr.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:30px 14px; text-align:center; color:var(--text-mute); font-size:13px;';
    empty.textContent = 'No stylist data found in your uploaded CSV(s) \u2014 make sure the file has an \u201cAssisting staff member name\u201d column populated.';
    body.appendChild(empty);
    return;
  }

  const totalRev = stArr.reduce((s,r)=>s+r.rev,0);

  // ---- Call-outs: notable performers, not just the raw list ----
  const MIN_BILLS_FOR_RATE_CALLOUTS = 3; // avoid a 1-bill stylist "winning" AOV by fluke
  const eligibleForRate = stArr.filter(r => r.bills >= MIN_BILLS_FOR_RATE_CALLOUTS);

  const byRevenue = stArr[0];
  const byBills = [...stArr].sort((a,b) => b.bills - a.bills)[0];
  const byAov = eligibleForRate.length ? [...eligibleForRate].sort((a,b) => b.aov - a.aov)[0] : null;

  const calloutHead = document.createElement('div');
  calloutHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  calloutHead.textContent = 'Call-outs \u2014 ' + cmk;
  body.appendChild(calloutHead);

  const calloutGrid = document.createElement('div');
  calloutGrid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:24px;';
  const callouts = [
    {label:'Top revenue', name: byRevenue.stylist, store: byRevenue.store, val: fmtINR(byRevenue.rev), sub: byRevenue.bills + ' bills \u00b7 AOV ' + fmtINR(byRevenue.aov), color:'var(--good)'},
    {label:'Busiest (most bills)', name: byBills.stylist, store: byBills.store, val: byBills.bills + ' bills', sub: fmtINR(byBills.rev) + ' revenue', color:'var(--brass)'},
    byAov ? {label:'Highest AOV (' + MIN_BILLS_FOR_RATE_CALLOUTS + '+ bills)', name: byAov.stylist, store: byAov.store, val: fmtINR(byAov.aov), sub: byAov.bills + ' bills', color:'var(--good)'} : null,
  ].filter(Boolean);
  callouts.forEach(c => {
    const card = document.createElement('div');
    card.style.cssText = `background:var(--panel); border-radius:10px; padding:14px 16px; border-left:3px solid ${c.color};`;
    card.innerHTML = `<div style="font-size:11.5px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
      <div style="font-size:14px; font-weight:600; color:var(--text); margin-bottom:2px;">${c.name}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-bottom:6px;">${c.store}</div>
      <div style="font-size:18px; font-weight:600; color:${c.color};" class="bsc-mono">${c.val}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-top:4px;">${c.sub}</div>`;
    calloutGrid.appendChild(card);
  });
  body.appendChild(calloutGrid);

  const cardsRow = document.createElement('div');
  cardsRow.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;';
  const cards = [
    {label:'Stylists with sales (' + cmk + ')', val: String(stArr.length)},
    {label:'Total attributed revenue', val: fmtINR(totalRev)},
    {label:'Avg revenue / stylist', val: fmtINR(totalRev/stArr.length)},
    {label:'Avg bills / stylist', val: (stArr.reduce((s,r)=>s+r.bills,0)/stArr.length).toFixed(1)},
  ];
  cards.forEach(c => {
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--panel); border-radius:10px; padding:14px 16px;';
    card.innerHTML = `<div style="font-size:12px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
      <div style="font-size:20px; font-weight:600; color:var(--text);" class="bsc-mono">${c.val}</div>`;
    cardsRow.appendChild(card);
  });
  body.appendChild(cardsRow);

  const head = document.createElement('div');
  head.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  head.textContent = 'MTD stylist-wise performance \u2014 ' + cmk;
  body.appendChild(head);

  const table = document.createElement('table');
  table.style.cssText = 'font-size:13px;';
  let rows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">#</td><td style="padding:6px 10px;">Stylist</td><td style="padding:6px 10px;">Store</td>' +
    '<td style="padding:6px 10px; text-align:right;">Revenue</td><td style="padding:6px 10px; text-align:right;">% of total</td>' +
    '<td style="padding:6px 10px; text-align:right;">Bills</td><td style="padding:6px 10px; text-align:right;">AOV</td></tr>';
  stArr.forEach((r,i) => {
    rows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; color:var(--text-mute);" class="bsc-mono">${i+1}</td>
      <td style="padding:8px 10px; font-weight:500;">${r.stylist}</td>
      <td style="padding:8px 10px; color:var(--text-mute);">${r.store}</td>
      <td style="padding:8px 10px; text-align:right; color:var(--brass); font-weight:600;" class="bsc-mono">${fmtINR(r.rev)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtPct(totalRev?r.rev/totalRev*100:0)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${r.bills}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(r.aov)}</td>
    </tr>`;
  });
  table.innerHTML = rows;
  body.appendChild(table);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:14px; line-height:1.6;';
  note.textContent = 'Attributed from the \u201cAssisting staff member name\u201d column in your sales CSV. Store shown is wherever each stylist generated the most revenue \u2014 useful if a stylist covers more than one location. Orders with no stylist recorded (e.g. most online orders) are excluded here, so this total will be lower than the store-wide MTD revenue.';
  body.appendChild(note);
}

function renderCategoryAOV(body, days){
  // Category revenue and units, aggregated across all uploaded days
  const catTotals = {};
  const catUnits = {};
  days.forEach(dk => {
    const cats = state.catDays[dk] || {};
    const units = state.catUnitDays[dk] || {};
    Object.keys(cats).forEach(c => { catTotals[c] = (catTotals[c] || 0) + cats[c]; });
    Object.keys(units).forEach(c => { catUnits[c] = (catUnits[c] || 0) + units[c]; });
  });
  const catArr = Object.keys(catTotals).map(c => ({cat:c, rev:catTotals[c], units: catUnits[c]||0})).sort((a,b)=>b.rev-a.rev);
  const catTotal = catArr.reduce((s,c)=>s+c.rev,0);

  // Last month (July 2026) category mix, for the % of sales comparison
  const lastMonthCat = BASELINE.july26Category || {};
  const lastMonthTotal = Object.values(lastMonthCat).reduce((s,v)=>s+v,0);

  // Exact MTD-vs-MTD units comparison: match each selected day to the SAME day-of-month
  // in July 2026 (e.g. Aug 3 vs Jul 3), rather than pro-rating a full-month total. Falls
  // back gracefully for any day-of-month July doesn't have data for (only 1-30 exist).
  const julyDailyCatUnits = BASELINE.july26DailyCategoryUnits || {};
  const matchedJulyCatUnits = {};
  let matchedDayCount = 0;
  days.forEach(dk => {
    const dayNum = new Date(dk + 'T00:00:00').getDate();
    const julyDay = julyDailyCatUnits[dayNum] || julyDailyCatUnits[String(dayNum)];
    if(julyDay){
      matchedDayCount++;
      Object.keys(julyDay).forEach(c => { matchedJulyCatUnits[c] = (matchedJulyCatUnits[c] || 0) + julyDay[c]; });
    }
  });

  const catHead = document.createElement('div');
  catHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  catHead.textContent = 'Category-wise sales vs last month (July 2026) \u2014 all uploaded days combined';
  body.appendChild(catHead);

  const catTable = document.createElement('table');
  catTable.style.cssText = 'font-size:13px;';
  let catRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">Category</td><td style="padding:6px 10px; text-align:right;">Revenue</td>' +
    '<td style="padding:6px 10px; text-align:right;">Units</td><td style="padding:6px 10px; text-align:right;">Units vs Jul (MTD)</td>' +
    '<td style="padding:6px 10px; text-align:right;">% of sales</td><td style="padding:6px 10px; text-align:right;">Jul % of sales</td>' +
    '<td style="padding:6px 10px; text-align:right;">Change (pp)</td></tr>';
  catArr.forEach(c => {
    const pctNow = catTotal ? c.rev/catTotal*100 : 0;
    const pctLast = lastMonthTotal ? (lastMonthCat[c.cat]||0)/lastMonthTotal*100 : null;
    const delta = (pctLast !== null) ? pctNow - pctLast : null;
    const julyUnitsMatched = matchedDayCount > 0 ? (matchedJulyCatUnits[c.cat] || 0) : null;
    const unitsGrowth = (julyUnitsMatched !== null && julyUnitsMatched > 0) ? (c.units - julyUnitsMatched) / julyUnitsMatched * 100 : null;
    catRows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; font-weight:500;">${c.cat}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(c.rev)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${Math.round(c.units).toLocaleString('en-IN')}</td>
      <td style="padding:8px 10px; text-align:right; color:${unitsGrowth===null?'var(--text-mute)':(unitsGrowth>=0?'var(--good)':'var(--bad)')}; font-weight:600;" class="bsc-mono">${unitsGrowth!==null?((unitsGrowth>=0?'+':'')+unitsGrowth.toFixed(1)+'%'):'\u2014'}</td>
      <td style="padding:8px 10px; text-align:right; color:var(--brass);" class="bsc-mono">${fmtPct(pctNow)}</td>
      <td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">${pctLast!==null?fmtPct(pctLast):'\u2014'}</td>
      <td style="padding:8px 10px; text-align:right; color:${delta===null?'var(--text-mute)':(delta>=0?'var(--good)':'var(--bad)')}; font-weight:600;" class="bsc-mono">${delta!==null?((delta>=0?'+':'')+delta.toFixed(1)+'pp'):'\u2014'}</td>
    </tr>`;
  });
  catTable.innerHTML = catRows;
  body.appendChild(catTable);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:14px; line-height:1.6;';
  note.textContent = 'MTM vs RTW Shirt: SKUs with a dash (e.g. BOM-SHI-33034) are RTW; SKUs without one (e.g. BOMSH04CM00256) are MTM. ' +
    '"Units vs Jul (MTD)" matches each of your ' + days.length + ' selected day(s) to the SAME day-of-month in July 2026 (' + matchedDayCount + ' day(s) matched) \u2014 a real MTD-vs-MTD comparison, not a pro-rated estimate. ' +
    'The July % of sales column is a fixed baseline from July 2026\u2019s full month \u2014 ' +
    'a rising % here means that category is taking a bigger share of the mix than it did last month, not necessarily that its revenue is up in absolute terms. ' +
    'AOV and UPT by store live on the Store-wise tab.';
  body.appendChild(note);
}

function renderRefunds(body){
  const cmk = currentMonthKey();

  const rangeNote = document.createElement('div');
  rangeNote.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-bottom:16px;';
  rangeNote.textContent = 'This tab always shows the current calendar month (' + cmk + ') and doesn\u2019t follow the date range picker above \u2014 refund/CN data is only tracked at month-level, not day-by-day.';
  body.appendChild(rangeNote);

  
  const refundMonth = state.refundsData && state.refundsData.byMonth ? state.refundsData.byMonth[cmk] : null;
  const cnMonth = state.cnData && state.cnData.byMonth ? state.cnData.byMonth[cmk] : null;

  if(!refundMonth && !cnMonth){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:30px 14px; text-align:center; color:var(--text-mute); font-size:13px;';
    empty.textContent = 'No refund or credit note data uploaded for ' + cmk + ' yet. Upload the CSVs above to see it here.';
    body.appendChild(empty);
    attachRefundHandlers();
    return;
  }

  // ---- Revenue for this month, from uploaded sales CSVs ----
  const days = getSortedDays().filter(dk => {
    const d = new Date(dk + 'T00:00:00');
    return currentMonthKeyForDate(d) === cmk;
  });
  let onlineRev = 0, offlineRev = 0;
  const regionRev = {North:0, South:0, West:0};
  const storeRev = {};
  days.forEach(dk => {
    const revs = state.days[dk] || {};
    Object.keys(revs).forEach(store => {
      const reg = offlineRegion(store);
      storeRev[store] = (storeRev[store] || 0) + revs[store];
      if(reg){ offlineRev += revs[store]; regionRev[reg] += revs[store]; }
      else { onlineRev += revs[store]; }
    });
  });
  const totalRev = onlineRev + offlineRev;
  const hasRevenue = totalRev > 0;

  if(!hasRevenue){
    const warn = document.createElement('div');
    warn.style.cssText = 'font-size:12px; color:var(--warn); margin-bottom:16px; padding:10px 14px; background:var(--panel); border-radius:8px;';
    warn.textContent = 'No sales CSV uploaded for ' + cmk + ' yet \u2014 upload one on the Overview tab to see refund/CN as a % of revenue. Showing raw amounts only for now.';
    body.appendChild(warn);
  }

  const refundTotal = refundMonth ? refundMonth.total : 0;
  const cnTotal = cnMonth ? cnMonth.total : 0;

  const cardsRow = document.createElement('div');
  cardsRow.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;';
  const cards = [
    {label:'Total refunds (' + cmk + ')', val: fmtINR(refundTotal), sub: refundMonth ? (refundMonth.lineItems + ' line items, ' + refundMonth.orders + ' orders') : 'No data'},
    {label:'Total credit notes (' + cmk + ')', val: fmtINR(cnTotal), sub: cnMonth ? (cnMonth.lineItems + ' line items, ' + cnMonth.orders + ' orders') : 'No data'},
    {label:'Refund + CN combined', val: fmtINR(refundTotal+cnTotal), sub: hasRevenue ? fmtPct((refundTotal+cnTotal)/totalRev*100) + ' of total revenue' : 'Upload sales CSV for %'},
    {label:'Refund % of revenue', val: hasRevenue ? fmtPct(refundTotal/totalRev*100) : '\u2014', sub: hasRevenue ? fmtINR(totalRev) + ' revenue' : 'Upload sales CSV'},
    {label:'CN % of revenue', val: hasRevenue ? fmtPct(cnTotal/totalRev*100) : '\u2014', sub: hasRevenue ? 'vs same revenue base' : 'Upload sales CSV'},
  ];
  cards.forEach(c => {
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--panel); border-radius:10px; padding:14px 16px;';
    card.innerHTML = `<div style="font-size:12px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
      <div style="font-size:20px; font-weight:600; color:var(--text);" class="bsc-mono">${c.val}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-top:4px;">${c.sub}</div>`;
    cardsRow.appendChild(card);
  });
  body.appendChild(cardsRow);

  // ---- Online vs Offline ----
  if(hasRevenue){
    const channelHead = document.createElement('div');
    channelHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    channelHead.textContent = 'Online vs offline \u2014 ' + cmk;
    body.appendChild(channelHead);

    const chTable = document.createElement('table');
    chTable.style.cssText = 'font-size:13px; margin-bottom:24px;';
    const onlineRefund = refundMonth ? refundMonth.onlineTotal : 0;
    const storeRefund = refundMonth ? refundMonth.storeTotal : 0;
    const onlineCN = cnMonth ? cnMonth.onlineTotal : 0;
    const storeCN = cnMonth ? cnMonth.storeTotal : 0;
    chTable.innerHTML = `<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">
        <td style="padding:6px 10px;">Channel</td><td style="padding:6px 10px; text-align:right;">Revenue</td>
        <td style="padding:6px 10px; text-align:right;">Refund %</td><td style="padding:6px 10px; text-align:right;">CN %</td><td style="padding:6px 10px; text-align:right;">Total %</td></tr>
      <tr style="border-top:1px solid var(--line);"><td style="padding:8px 10px; font-weight:500;">Online</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(onlineRev)}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${onlineRev?fmtPct(onlineRefund/onlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${onlineRev?fmtPct(onlineCN/onlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600; color:var(--brass);" class="bsc-mono">${onlineRev?fmtPct((onlineRefund+onlineCN)/onlineRev*100):'\u2014'}</td></tr>
      <tr style="border-top:1px solid var(--line);"><td style="padding:8px 10px; font-weight:500;">Offline</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(offlineRev)}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${offlineRev?fmtPct(storeRefund/offlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${offlineRev?fmtPct(storeCN/offlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600; color:var(--brass);" class="bsc-mono">${offlineRev?fmtPct((storeRefund+storeCN)/offlineRev*100):'\u2014'}</td></tr>
      <tr style="border-top:1.5px solid var(--line2);"><td style="padding:8px 10px; font-weight:700;">Total</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700;" class="bsc-mono">${fmtINR(totalRev)}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700;" class="bsc-mono">${totalRev?fmtPct(refundTotal/totalRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700;" class="bsc-mono">${totalRev?fmtPct(cnTotal/totalRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700; color:var(--brass);" class="bsc-mono">${totalRev?fmtPct((refundTotal+cnTotal)/totalRev*100):'\u2014'}</td></tr>`;
    body.appendChild(chTable);

    // ---- Region-wise ----
    const regHead = document.createElement('div');
    regHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    regHead.textContent = 'Region-wise \u2014 ' + cmk;
    body.appendChild(regHead);

    const regTable = document.createElement('table');
    regTable.style.cssText = 'font-size:13px; margin-bottom:24px;';
    let regRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
      '<td style="padding:6px 10px;">Region</td><td style="padding:6px 10px; text-align:right;">Revenue</td>' +
      '<td style="padding:6px 10px; text-align:right;">Refunds</td><td style="padding:6px 10px; text-align:right;">Refund %</td>' +
      '<td style="padding:6px 10px; text-align:right;">CN</td><td style="padding:6px 10px; text-align:right;">CN %</td></tr>';
    ['North','South','West'].forEach(reg => {
      let regRefund = 0, regCN = 0;
      if(refundMonth) Object.keys(refundMonth.byStore || {}).forEach(s => { if(offlineRegion(s) === reg) regRefund += refundMonth.byStore[s]; });
      if(cnMonth) Object.keys(cnMonth.byStore || {}).forEach(s => { if(offlineRegion(s) === reg) regCN += cnMonth.byStore[s]; });
      const rev = regionRev[reg];
      regRows += `<tr style="border-top:1px solid var(--line);">
        <td style="padding:8px 10px; font-weight:500;">${reg}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(rev)}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(regRefund)}</td>
        <td style="padding:8px 10px; text-align:right; color:var(--brass); font-weight:600;" class="bsc-mono">${rev?fmtPct(regRefund/rev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(regCN)}</td>
        <td style="padding:8px 10px; text-align:right; color:var(--brass); font-weight:600;" class="bsc-mono">${rev?fmtPct(regCN/rev*100):'\u2014'}</td>
      </tr>`;
    });
    regTable.innerHTML = regRows;
    body.appendChild(regTable);

    // ---- Store-wise ----
    const stHead = document.createElement('div');
    stHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    stHead.textContent = 'Store-wise \u2014 ' + cmk;
    body.appendChild(stHead);

    const allStores = new Set(Object.keys(storeRev).filter(s => offlineRegion(s)));
    if(refundMonth) Object.keys(refundMonth.byStore || {}).forEach(s => { if(offlineRegion(s)) allStores.add(s); });
    if(cnMonth) Object.keys(cnMonth.byStore || {}).forEach(s => { if(offlineRegion(s)) allStores.add(s); });

    const stArr = Array.from(allStores).map(s => {
      const rev = storeRev[s] || 0;
      const rf = refundMonth && refundMonth.byStore ? (refundMonth.byStore[s] || 0) : 0;
      const cn = cnMonth && cnMonth.byStore ? (cnMonth.byStore[s] || 0) : 0;
      return {store:s, region: offlineRegion(s), rev, rf, cn, rfPct: rev?rf/rev*100:0, cnPct: rev?cn/rev*100:0};
    }).sort((a,b) => (b.rfPct+b.cnPct)-(a.rfPct+a.cnPct));

    const stTable = document.createElement('table');
    stTable.style.cssText = 'font-size:13px; margin-bottom:16px;';
    let stRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
      '<td style="padding:6px 10px;">Store</td><td style="padding:6px 10px;">Region</td>' +
      '<td style="padding:6px 10px; text-align:right;">Revenue</td><td style="padding:6px 10px; text-align:right;">Refund %</td>' +
      '<td style="padding:6px 10px; text-align:right;">CN %</td></tr>';
    stArr.forEach(s => {
      stRows += `<tr style="border-top:1px solid var(--line);">
        <td style="padding:8px 10px; font-weight:500;">${s.store}</td>
        <td style="padding:8px 10px; color:var(--text-mute);">${s.region}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(s.rev)}</td>
        <td style="padding:8px 10px; text-align:right; color:${achColor(100-s.rfPct*8)}; font-weight:600;" class="bsc-mono">${s.rev?fmtPct(s.rfPct):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; color:${achColor(100-s.cnPct*3)}; font-weight:600;" class="bsc-mono">${s.rev?fmtPct(s.cnPct):'\u2014'}</td>
      </tr>`;
    });
    stTable.innerHTML = stRows;
    body.appendChild(stTable);
  }

  function reasonTableByChannel(title, onlineObj, offlineObj){
    const onlineEntries = onlineObj ? Object.entries(onlineObj).sort((a,b)=>b[1]-a[1]) : [];
    const offlineEntries = offlineObj ? Object.entries(offlineObj).sort((a,b)=>b[1]-a[1]) : [];
    if(!onlineEntries.length && !offlineEntries.length) return;

    const head = document.createElement('div');
    head.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    head.textContent = title + ' \u2014 ' + cmk + (hasRevenue ? ' (% of that channel\u2019s own revenue)' : ' (% of that channel\u2019s total in this table)');
    body.appendChild(head);

    function oneChannelTable(label, entries, channelRevenue){
      if(!entries.length) return;
      const sub = document.createElement('div');
      sub.style.cssText = 'font-size:11.5px; font-weight:600; color:var(--brass); margin:6px 0 6px 2px;';
      sub.textContent = label;
      body.appendChild(sub);
      const localTotal = entries.reduce((s,e)=>s+e[1],0);
      const denom = (hasRevenue && channelRevenue) ? channelRevenue : localTotal;
      const denomLabel = (hasRevenue && channelRevenue) ? '% of ' + label.toLowerCase() + ' revenue' : '% of ' + label.toLowerCase() + ' total';
      const t = document.createElement('table');
      t.style.cssText = 'font-size:13px; margin-bottom:18px;';
      let rows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
        '<td style="padding:6px 10px;">Reason</td><td style="padding:6px 10px; text-align:right;">Amount</td>' +
        '<td style="padding:6px 10px; text-align:right;">' + denomLabel + '</td></tr>';
      entries.forEach(([reason, amt]) => {
        rows += `<tr style="border-top:1px solid var(--line);">
          <td style="padding:8px 10px; font-weight:500;">${reason}</td>
          <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(amt)}</td>
          <td style="padding:8px 10px; text-align:right; color:var(--brass);" class="bsc-mono">${denom?fmtPct(amt/denom*100):'\u2014'}</td>
        </tr>`;
      });
      t.innerHTML = rows;
      body.appendChild(t);
    }

    oneChannelTable('Online', onlineEntries, onlineRev);
    oneChannelTable('Offline', offlineEntries, offlineRev);
  }

  reasonTableByChannel('Refunds by reason', refundMonth ? refundMonth.byReasonOnline : null, refundMonth ? refundMonth.byReasonOffline : null);
  reasonTableByChannel('Credit notes by reason', cnMonth ? cnMonth.byReasonOnline : null, cnMonth ? cnMonth.byReasonOffline : null);
  reasonTableByChannel('Refunds by category', refundMonth ? refundMonth.byCategoryOnline : null, refundMonth ? refundMonth.byCategoryOffline : null);
  reasonTableByChannel('Credit notes by category', cnMonth ? cnMonth.byCategoryOnline : null, cnMonth ? cnMonth.byCategoryOffline : null);

  attachRefundHandlers();
}

function currentMonthKeyForDate(d){
  const monNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return monNames[d.getMonth()] + '-' + d.getFullYear();
}

function attachRefundHandlers(){
  const ri = document.getElementById('bsc-refund-input');
  if(ri) ri.addEventListener('change', (e) => { if(e.target.files[0]) handleCombinedRefundFile(e.target.files[0]); });
}

function attachHandlers(){
  const rangeApply = document.getElementById('bsc-range-apply');
  if(rangeApply) rangeApply.addEventListener('click', () => {
    const s = document.getElementById('bsc-range-start').value;
    const e = document.getElementById('bsc-range-end').value;
    if(!s || !e){ alert('Pick both a start and end date.'); return; }
    if(s > e){ alert('Start date must be before end date.'); return; }
    state.dateRange = {start: s, end: e};
    render();
  });
  const rangeReset = document.getElementById('bsc-range-reset');
  if(rangeReset) rangeReset.addEventListener('click', () => {
    state.dateRange = null;
    render();
  });
}

function renderManageDataPanel(){

  const allDays = getSortedDays();
  const byMonth = {};
  allDays.forEach(dk => {
    const mk = currentMonthKeyForDate(new Date(dk+'T00:00:00'));
    byMonth[mk] = byMonth[mk] || [];
    byMonth[mk].push(dk);
  });

  let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div style="font-size:13px; font-weight:600; color:var(--text-dim);">Stored sales days (by month)</div>

  </div>`;

    html += '<div style="font-size:12.5px; color:var(--text-mute);">No sales data stored yet.</div>';
  } else {
    Object.keys(byMonth).sort().forEach(mk => {
      const daysInMonth = byMonth[mk].sort();
      const monthTotal = daysInMonth.reduce((s,dk) => {
        const revs = state.days[dk] || {};
        return s + Object.values(revs).reduce((a,b)=>a+b,0);
      }, 0);
      const isCurrent = mk === currentMonthKey();
      html += `<div style="margin-bottom:10px; padding:10px 12px; background:var(--panel2); border-radius:8px; ${isCurrent?'border:1px solid var(--brass);':''}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <div style="font-size:12.5px; font-weight:600; color:${isCurrent?'var(--brass)':'var(--text-dim)'};">${mk}${isCurrent?' (current \u2014 shown on dashboard)':' (hidden from dashboard tabs)'}</div>
          <button data-delete-month="${mk}" style="background:none; border:0.5px solid var(--bad); color:var(--bad); font-size:11px; padding:3px 8px; border-radius:6px; cursor:pointer; font-family:inherit;">Delete this month</button>
        </div>
        <div style="font-size:11.5px; color:var(--text-mute); margin-bottom:6px;">${daysInMonth.length} day(s) \u2014 ${fmtINR(monthTotal)} total</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">`;
      daysInMonth.forEach(dk => {
        const dayTotal = Object.values(state.days[dk]||{}).reduce((a,b)=>a+b,0);
        html += `<span style="font-size:11px; color:var(--text-mute); background:var(--ink); padding:3px 8px; border-radius:6px; display:inline-flex; align-items:center; gap:6px;">
          ${dk} (${fmtINR(dayTotal)}) <button data-delete-day="${dk}" style="background:none; border:none; color:var(--bad); cursor:pointer; font-size:12px; padding:0; line-height:1;">&times;</button>
        </span>`;
      });
      html += `</div></div>`;
    });
  }

  html += `<div style="display:flex; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">
    <button id="bsc-clear-all-sales" style="background:none; border:0.5px solid var(--bad); color:var(--bad); font-size:12px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:inherit;">Clear all sales data</button>
    <button id="bsc-clear-refunds" style="background:none; border:0.5px solid var(--bad); color:var(--bad); font-size:12px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:inherit;">Clear refund/CN data</button>
  </div>
  <div style="font-size:11px; color:var(--text-mute); margin-top:10px; line-height:1.5;">
    If a store\u2019s numbers look too high, check here for days from other months sitting in storage \u2014 they\u2019re excluded from the dashboard\u2019s calculations automatically, but this is where you can permanently delete them if you\u2019d rather clean things up.
  </div>`;

  panel.innerHTML = html;
  return panel;
}

async function deleteDay(dk){
  await db.delete('day-' + dk);
  delete state.days[dk];
  delete state.billDays[dk];
  delete state.catDays[dk];
  delete state.newRevDays[dk];
  delete state.repRevDays[dk];
  delete state.newBillDays[dk];
  delete state.repBillDays[dk];
  delete state.catUnitDays[dk];
  delete state.stylistRevDays[dk];
  delete state.stylistBillDays[dk];
  delete state.storeUnitDays[dk];
  delete state.stylistStoreRevDays[dk];
}

async function clearAllSalesData(){
  const allDays = getSortedDays();
  for(const dk of allDays) await deleteDay(dk);
}

async function clearRefundData(){
  await db.delete('refunds-summary');
  await db.delete('cn-summary');
  state.refundsData = null;
  state.cnData = null;
}

function attachManagePanelHandlers(){
  const closeBtn = document.getElementById('bsc-close-manage');
  if(closeBtn) closeBtn.addEventListener('click', () => { state.showManagePanel = false; render(); });

  document.querySelectorAll('[data-delete-day]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await deleteDay(btn.getAttribute('data-delete-day'));
      render();
    });
  });
  document.querySelectorAll('[data-delete-month]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const mk = btn.getAttribute('data-delete-month');
      const toDelete = getSortedDays().filter(dk => currentMonthKeyForDate(new Date(dk+'T00:00:00')) === mk);
      if(!confirm('Delete all ' + toDelete.length + ' day(s) of stored data for ' + mk + '? This can\u2019t be undone.')) return;
      for(const dk of toDelete) await deleteDay(dk);
      render();
    });
  });
  const clearAllBtn = document.getElementById('bsc-clear-all-sales');
  if(clearAllBtn) clearAllBtn.addEventListener('click', async () => {
    if(!confirm('Delete ALL stored sales days, across every month? This can\u2019t be undone.')) return;
    await clearAllSalesData();
    render();
  });
  const clearRefundsBtn = document.getElementById('bsc-clear-refunds');
  if(clearRefundsBtn) clearRefundsBtn.addEventListener('click', async () => {
    if(!confirm('Delete all stored refund and credit note data? This can\u2019t be undone.')) return;
    await clearRefundData();
    render();
  });
}

async function exportAllData(){
  const raw = await db.allKeysRaw();
  const blob = new Blob([JSON.stringify({exportedAt: new Date().toISOString(), data: raw}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bsc-console-data-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importAllData(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const data = parsed.data || parsed;
    for(const key of Object.keys(data)){
      if(data[key] !== null && data[key] !== undefined) await db.set(key, data[key]);
    }
    await loadAllDays();
    await loadRefundData();
    render();
  }catch(e){
    console.error('Import failed', e);
    alert('Could not read that file \u2014 make sure it\u2019s a JSON file exported from this dashboard.');
  }
}

// ---------- init ----------
async function init(){
  const root = document.getElementById('bsc-root');
  storageBackend = detectStorageBackend();
  if(storageBackend === 'none'){
    root.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-mute); font-size:13px;">' +
      'This browser will not allow any local storage (private/incognito mode, or storage disabled). ' +
      'Try a normal browser window, or open this file inside Claude.ai.</div>';
    return;
  }
  root.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-mute); font-size:13px;">Loading saved data...</div>';
  await loadAllDays();
  await loadRefundData();
  await loadNPSData();
  await loadSeedDataIfEmpty();
  state.loading = false;
  render();
}

async function loadSeedDataIfEmpty(){
  // Only runs the very first time this file is opened against a given storage backend
  // (i.e. nothing uploaded there yet). Any real upload always takes precedence going
  // forward -- this just avoids showing a blank dashboard before you've re-uploaded.
  const noDaysYet = Object.keys(state.days).length === 0;
  if(noDaysYet && typeof SEED_DAYS !== 'undefined'){
    for(const dk of Object.keys(SEED_DAYS)){
      const d = SEED_DAYS[dk];
      state.days[dk] = d.stores;
      state.billDays[dk] = d.bills || {};
      state.catDays[dk] = d.categories || {};
      state.newRevDays[dk] = d.newRev || {};
      state.repRevDays[dk] = d.repRev || {};
      state.newBillDays[dk] = d.newBills || {};
      state.repBillDays[dk] = d.repBills || {};
      state.catUnitDays[dk] = d.categoryUnits || {};
      state.stylistRevDays[dk] = d.stylistRev || {};
      state.stylistBillDays[dk] = d.stylistBills || {};
      state.storeUnitDays[dk] = d.storeUnits || {};
      state.stylistStoreRevDays[dk] = d.stylistStoreRev || {};
      await saveDay(dk, d.stores, d.bills, d.categories, d.newRev, d.repRev, d.newBills, d.repBills, d.categoryUnits, d.stylistRev, d.stylistBills, d.storeUnits, d.stylistStoreRev);
    }
  }
  if(!state.refundsData && typeof SEED_REFUNDS !== 'undefined'){
    state.refundsData = SEED_REFUNDS;
    await db.set('refunds-summary', JSON.stringify(SEED_REFUNDS));
  }
  if(!state.cnData && typeof SEED_CN !== 'undefined'){
    state.cnData = SEED_CN;
    await db.set('cn-summary', JSON.stringify(SEED_CN));
  }
}
init();

})();
</script>
