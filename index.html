  async get(key){
    if(storageBackend === 'claude'){
      try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
    }
    if(storageBackend === 'local'){
      try{ return localStorage.getItem(STORAGE_PREFIX + key); }catch(e){ return null; }
    }
    return null;
  },
  async set(key, value){
    if(storageBackend === 'claude'){
      try{ const r = await window.storage.set(key, value, false); return !!r; }catch(e){ return false; }

      try{ const r = await window.storage.list(prefix, false); return r ? r.keys : []; }catch(e){ return []; }

      const keys = [];
      try{
        for(let i=0;i<localStorage.length;i++){

    }
    return out;
  },
};

// ---------- storage ----------
function monthKeyFromDate(dateStr){
  if(!dateStr) return null;
  const s = String(dateStr).trim();
  const monNames = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const plausibleYear = (y) => y >= 2020 && y <= 2100; // guards against corrupted years like "0206"
  // ISO: 2026-08-01 (what our XLSX reader normalizes dates to)
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m && plausibleYear(parseInt(m[1],10))){
    const monIdx = parseInt(m[2],10) - 1;
    if(monIdx >= 0 && monIdx < 12) return monNames[monIdx].charAt(0).toUpperCase()+monNames[monIdx].slice(1) + '-' + m[1];
  }
  // "16-Jun-2026" / "12 July 2026"
  m = s.match(/(\d{1,2})[-\s]([A-Za-z]{3,9})[-\s](\d{4})/);
  if(m && plausibleYear(parseInt(m[3],10))){
    const mon = m[2].slice(0,3).toLowerCase();
    const idx = monNames.indexOf(mon);
    if(idx >= 0) return monNames[idx].charAt(0).toUpperCase()+monNames[idx].slice(1) + '-' + m[3];
  }
  // "06/07/2026" or "27-01-2026" (assume DD-MM-YYYY)
  m = s.match(/^(\d{1,2})[\-\.\/](\d{1,2})[\-\.\/](\d{4})$/);
  if(m && plausibleYear(parseInt(m[3],10))){
    const monIdx = parseInt(m[2],10) - 1;
    if(monIdx >= 0 && monIdx < 12) return monNames[monIdx].charAt(0).toUpperCase()+monNames[monIdx].slice(1) + '-' + m[3];
  }
  return null; // includes corrupted years (e.g. "01-Aug-0206") -- falls through to the current-month assumption upstream
}
function monthKeyFromHelper(helperStr){
  // "Jun-2026" style, already close to our target format
  if(!helperStr) return null;
  const s = String(helperStr).trim();
  const m = s.match(/^([A-Za-z]{3})[a-z]*-(\d{4})$/);
  if(m) return m[1].charAt(0).toUpperCase()+m[1].slice(1,3).toLowerCase() + '-' + m[2];
  return null;
}
function currentMonthKey(){
  const monNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d = new Date();
  return monNames[d.getMonth()] + '-' + d.getFullYear();
}
function todayDateKey(){
  const d = new Date();
  const pad = (n) => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

async function handleNPSFile(file){
  const statusEl = document.getElementById('bsc-nps-upload-status');
  if(statusEl){ statusEl.textContent = 'Reading file...'; statusEl.style.color = 'var(--text-mute)'; }
  try{
    const rawRows = await fileToRawRows(file);
    let headerRow = null, headerIdx = -1;
    for(let i=0;i<rawRows.length;i++){
      const row = rawRows[i];
      if(isRawRowEmpty(row)) continue;
      const joined = row.map(c => String(c||'').toLowerCase()).join('|');
      if(joined.indexOf('nps') >= 0){ headerRow = row; headerIdx = i; break; }
    }
    if(!headerRow){
      if(statusEl){ statusEl.textContent = 'Couldn\u2019t find a column containing \u201cNPS\u201d in that file.'; statusEl.style.color = 'var(--bad)'; }
      render();
      return;
    }
    const colMap = buildColMap(headerRow);
    const storeKey = findKeyFuzzy(colMap, ['store', 'pos location', 'location']);
    const npsKey = findKeyFuzzy(colMap, ['nps score', 'nps']);
    if(!storeKey || !npsKey){
      if(statusEl){ statusEl.textContent = 'Found an NPS column but couldn\u2019t identify the store column \u2014 expected something like \u201cStore\u201d or \u201cPOS Location\u201d.'; statusEl.style.color = 'var(--bad)'; }
      render();
      return;
    }
    const byStoreVals = {};
    for(let i=headerIdx+1;i<rawRows.length;i++){
      const row = rawRows[i];
      if(isRawRowEmpty(row)) continue;
      const store = String(row[colMap[storeKey]] || '').trim();
      const npsRaw = row[colMap[npsKey]];
      if(!store || npsRaw === undefined || npsRaw === null || npsRaw === '') continue;
      const nps = parseFloat(String(npsRaw).replace(/[^0-9.\-]/g, ''));
      if(isNaN(nps)) continue;
      byStoreVals[store] = byStoreVals[store] || [];
      byStoreVals[store].push(nps);
    }
    const byStore = {};
    Object.keys(byStoreVals).forEach(store => {
      const vals = byStoreVals[store];
      byStore[store] = vals.reduce((a,b)=>a+b,0) / vals.length;
    });
    const allVals = Object.values(byStore);
    const overall = allVals.length ? allVals.reduce((a,b)=>a+b,0)/allVals.length : null;
    const summary = { byStore, overall, uploadedAt: new Date().toISOString() };
    await db.set('nps-summary', JSON.stringify(summary));
    state.npsData = summary;
    if(statusEl){
      statusEl.textContent = 'NPS updated: ' + Object.keys(byStore).length + ' store(s), overall ' + (overall!==null?overall.toFixed(1):'\u2014');
      statusEl.style.color = 'var(--good)';
    }
  }catch(e){
    if(statusEl){ statusEl.textContent = 'Could not read that file. ' + (e && e.message ? e.message : ''); statusEl.style.color = 'var(--bad)'; }
    console.error(e);
  }
  render();
}

function parseAmount(v){
  if(v === undefined || v === null || v === '') return 0;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

function isRawRowEmpty(row){
  return !row || row.every(c => c === undefined || c === null || String(c).trim() === '');
}

function buildColMap(headerRow){
  const map = {};
  headerRow.forEach((h,i) => { if(h && String(h).trim()) map[String(h).trim()] = i; });
  return map;
}

function findCol(colMap, patterns){
  const keys = Object.keys(colMap);
  for(const p of patterns){
    const hit = keys.find(k => k.toLowerCase().indexOf(p.toLowerCase()) === 0);
    if(hit) return colMap[hit];
  }
  for(const p of patterns){
    const hit = keys.find(k => k.toLowerCase().indexOf(p.toLowerCase()) >= 0);
    if(hit) return colMap[hit];
  }
  return -1;
}

async function fileToRawRows(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.xlsx') || name.endsWith('.xls')){
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    let allRows = [];
    wb.SheetNames.forEach(sheetName => {
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:'', dateNF:'yyyy-mm-dd'});
      allRows = allRows.concat(rows);
      allRows.push([]); // separator between sheets
    });
    return allRows;
  }
  // CSV fallback
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: false, skipEmptyLines: false,
      complete: (res) => resolve(res.data),
      error: reject,
    });
  });
}

// Walks raw rows (array-of-arrays), auto-detecting the Refund Log table and the
// Credit Note table wherever they sit in the sheet, and returns two arrays of
// row-objects (keyed by header name) for downstream aggregation.
function findKeyFuzzy(colMap, patterns){
  const keys = Object.keys(colMap);
  for(const p of patterns){
    const hit = keys.find(k => k.toLowerCase().trim() === p.toLowerCase());
    if(hit) return hit;
  }
  for(const p of patterns){
    const hit = keys.find(k => k.toLowerCase().indexOf(p.toLowerCase()) === 0);
    if(hit) return hit;
  }
  for(const p of patterns){
    const hit = keys.find(k => k.toLowerCase().indexOf(p.toLowerCase()) >= 0);
    if(hit) return hit;
  }
  return null;
}

function splitRefundAndCNRows(rawRows){
  const refundRows = [];
  const cnRows = [];
  let mode = null;
  let colMap = {};
  let resolvedCols = { refundAmountKey:null, refundReasonKey:null, refundDateKey:null, cnAmountKey:null, cnReasonKey:null, cnDateKey:null };
  let headerRowsSeen = 0;

  for(let i=0;i<rawRows.length;i++){
    const row = rawRows[i];
    if(isRawRowEmpty(row)){ mode = null; continue; }
    const joined = row.map(c => String(c||'').toLowerCase()).join('|');

    const looksLikeRefundHeader = joined.indexOf('reason for refund') >= 0;
    const looksLikeCNHeader = joined.indexOf('reason for credit note') >= 0 ||
      (joined.indexOf('credit note') >= 0 && joined.indexOf('amount') >= 0);
    const looksLikeStopSection = joined.indexOf('reference lists') >= 0 ||
      joined.indexOf('refund summary dashboard') >= 0 ||
      joined.indexOf('credit note summary') >= 0 ||
      joined.indexOf('comparison') >= 0 ||
      joined.indexOf('key metrics') >= 0;

    if(looksLikeStopSection){ mode = null; continue; }

    if(looksLikeRefundHeader){
      mode = 'refund'; colMap = buildColMap(row); headerRowsSeen++;
      resolvedCols.refundAmountKey = findKeyFuzzy(colMap, ['item price (\u20b9)','item price','price (\u20b9)','amount (\u20b9)','amount','price']);
      resolvedCols.refundReasonKey = findKeyFuzzy(colMap, ['reason for refund','reason']);
      resolvedCols.refundDateKey = findKeyFuzzy(colMap, ['date processed','processed date','processed on']);
      continue;
    }
    if(looksLikeCNHeader){
      mode = 'cn'; colMap = buildColMap(row); headerRowsSeen++;
      resolvedCols.cnAmountKey = findKeyFuzzy(colMap, ['credit note amount (\u20b9)','credit note amount','amount (\u20b9)','amount']);
      resolvedCols.cnReasonKey = findKeyFuzzy(colMap, ['reason for credit note','reason']);
      resolvedCols.cnDateKey = findKeyFuzzy(colMap, ['date processed','processed date','processed on']);
      continue;
    }

    if(mode === 'refund' || mode === 'cn'){
      const obj = {};
      Object.keys(colMap).forEach(k => { obj[k] = row[colMap[k]]; });
      if(mode === 'refund') refundRows.push(obj); else cnRows.push(obj);
    }
  }
  return {refundRows, cnRows, resolvedCols, headerRowsSeen};
}

function aggregateRefundRows(rows, amountCol, reasonCol, dateCol){
  const byMonth = {};
  let skippedNoAmountCol = 0;
  let monthSource = dateCol ? 'processed-date' : 'assumed-current-month';
  const cmk = currentMonthKey();
  rows.forEach(row => {
    if(!amountCol || !(amountCol in row)){ skippedNoAmountCol++; return; }
    const amt = parseAmount(row[amountCol]);
    if(!amt) return; // treat blank/zero/unparseable amounts as not-a-line-item
    // Prefer an explicit processing date (when the refund/CN actually happened) over the
    // order date, which only reflects when the original purchase was made and can be
    // months earlier. If neither is available, assume the row belongs to the current
    // month, since these exports are typically already scoped that way (e.g. "MTD Aug").
    let mk = (dateCol && monthKeyFromDate(row[dateCol])) ||
             monthKeyFromHelper(row['Month (helper)']) ||
             cmk;
    const channel = (row['Channel'] || '').trim();
    const isOnline = channel.toLowerCase() === 'online';
    const reason = (reasonCol && row[reasonCol] ? String(row[reasonCol]).trim() : '') || 'Unspecified';
    const category = (row['Category'] || 'Uncategorized').trim() || 'Uncategorized';
    const store = (row['POS Location / Store'] || '').trim();
    const orderId = row['Order ID'] || '';

    byMonth[mk] = byMonth[mk] || { total:0, onlineTotal:0, storeTotal:0, lineItems:0, orderSet:new Set(),
      byReason:{}, byCategory:{}, byStore:{},
      byReasonOnline:{}, byReasonOffline:{}, byCategoryOnline:{}, byCategoryOffline:{} };
    const m = byMonth[mk];
    m.total += amt;
    if(isOnline) m.onlineTotal += amt; else m.storeTotal += amt;
    m.lineItems++;
    if(orderId) m.orderSet.add(orderId);
    m.byReason[reason] = (m.byReason[reason] || 0) + amt;
    m.byCategory[category] = (m.byCategory[category] || 0) + amt;
    if(store) m.byStore[store] = (m.byStore[store] || 0) + amt;
    if(isOnline){
      m.byReasonOnline[reason] = (m.byReasonOnline[reason] || 0) + amt;
      m.byCategoryOnline[category] = (m.byCategoryOnline[category] || 0) + amt;
    } else {
      m.byReasonOffline[reason] = (m.byReasonOffline[reason] || 0) + amt;
      m.byCategoryOffline[category] = (m.byCategoryOffline[category] || 0) + amt;
    }
  });
  const byMonthClean = {};
  Object.keys(byMonth).forEach(mk => {
    const m = byMonth[mk];
    byMonthClean[mk] = { total:m.total, onlineTotal:m.onlineTotal, storeTotal:m.storeTotal,
      lineItems:m.lineItems, orders:m.orderSet.size, byReason:m.byReason, byCategory:m.byCategory, byStore:m.byStore,
      byReasonOnline:m.byReasonOnline, byReasonOffline:m.byReasonOffline,
      byCategoryOnline:m.byCategoryOnline, byCategoryOffline:m.byCategoryOffline };
  });
  return {byMonth: byMonthClean, skippedNoAmountCol, monthSource};
}

async function handleCombinedRefundFile(file){
  const statusEl = document.getElementById('bsc-refund-upload-status');
  statusEl.textContent = 'Reading file...';
  statusEl.style.color = 'var(--text-mute)';
  try{
    const rawRows = await fileToRawRows(file);
    const {refundRows, cnRows, resolvedCols, headerRowsSeen} = splitRefundAndCNRows(rawRows);

    if(headerRowsSeen === 0){
      const nonEmptySample = rawRows.filter(r => !isRawRowEmpty(r)).slice(0,1)[0] || [];
      statusEl.textContent = 'Couldn\u2019t find a refund or credit note table \u2014 no header row containing \u201cReason for Refund\u201d or \u201cReason for Credit Note\u201d was found in ' +
        rawRows.length + ' rows read. First row seen: ' + JSON.stringify(nonEmptySample).slice(0,200);
      statusEl.style.color = 'var(--bad)';
      render();
      return;
    }
    if(refundRows.length === 0 && cnRows.length === 0){
      statusEl.textContent = 'Found a header row, but no data rows underneath it \u2014 check the file has rows directly below the header with no gaps.';
      statusEl.style.color = 'var(--bad)';
      render();
      return;
    }

    let msgs = [];
    const cmk = currentMonthKey();

    if(refundRows.length){
      if(!resolvedCols.refundAmountKey){
        msgs.push('Refunds: found ' + refundRows.length + ' rows but couldn\u2019t identify the amount column \u2014 check for a column like \u201cItem Price (\u20b9)\u201d.');
      } else {
        const {byMonth, skippedNoAmountCol, monthSource} = aggregateRefundRows(refundRows, resolvedCols.refundAmountKey, resolvedCols.refundReasonKey, resolvedCols.refundDateKey);
        const summary = { byMonth, uploadedAt: new Date().toISOString() };
        await db.set('refunds-summary', JSON.stringify(summary));
        state.refundsData = summary;
        const thisMonth = byMonth[cmk];
        const srcNote = resolvedCols.refundDateKey ? '' : ' [assumed current month, no processed-date column found]';
        msgs.push('Refunds: ' + (thisMonth ? (fmtINR(thisMonth.total) + ' in ' + cmk + ' (' + thisMonth.lineItems + ' items)') : 'no rows matched ' + cmk) + srcNote);
      }
    }
    if(cnRows.length){
      if(!resolvedCols.cnAmountKey){
        msgs.push('Credit notes: found ' + cnRows.length + ' rows but couldn\u2019t identify the amount column \u2014 check for a column like \u201cCredit Note Amount (\u20b9)\u201d.');
      } else {
        const {byMonth, skippedNoAmountCol, monthSource} = aggregateRefundRows(cnRows, resolvedCols.cnAmountKey, resolvedCols.cnReasonKey, resolvedCols.cnDateKey);
        const summary = { byMonth, uploadedAt: new Date().toISOString() };
        await db.set('cn-summary', JSON.stringify(summary));
        state.cnData = summary;
        const thisMonth = byMonth[cmk];
        const srcNote = resolvedCols.cnDateKey ? '' : ' [assumed current month, no processed-date column found]';
        msgs.push('Credit notes: ' + (thisMonth ? (fmtINR(thisMonth.total) + ' in ' + cmk + ' (' + thisMonth.lineItems + ' items)') : 'no rows matched ' + cmk) + srcNote);
      }
    }

    statusEl.textContent = msgs.join('  \u2022  ');
    statusEl.style.color = 'var(--good)';
  }catch(e){
    statusEl.textContent = 'Could not read that file. ' + (e && e.message ? e.message : String(e));
    statusEl.style.color = 'var(--bad)';
    console.error(e);
  }
  render();
}


async function loadAllDays(){
  try{
    const dayKeys = await db.list('day-');
    if(!dayKeys || !dayKeys.length) return;
    for(const k of dayKeys){
      try{
        const raw = await db.get(k);
        if(raw){
          const parsed = JSON.parse(raw);
          state.days[parsed.date] = parsed.stores;
          state.billDays[parsed.date] = parsed.bills || {};
          state.catDays[parsed.date] = parsed.categories || {};
          state.newRevDays[parsed.date] = parsed.newRev || {};
          state.repRevDays[parsed.date] = parsed.repRev || {};
          state.newBillDays[parsed.date] = parsed.newBills || {};
          state.repBillDays[parsed.date] = parsed.repBills || {};
          state.catUnitDays[parsed.date] = parsed.categoryUnits || {};
          state.stylistRevDays[parsed.date] = parsed.stylistRev || {};
          state.stylistBillDays[parsed.date] = parsed.stylistBills || {};
          state.storeUnitDays[parsed.date] = parsed.storeUnits || {};
          state.stylistStoreRevDays[parsed.date] = parsed.stylistStoreRev || {};
        }
      }catch(e){}
    }
  }catch(e){ console.error('load error', e); }
}

async function saveDay(date, stores, bills, categories, newRev, repRev, newBills, repBills, categoryUnits, stylistRev, stylistBills, storeUnits, stylistStoreRev){
  await db.set('day-' + date, JSON.stringify({date, stores, bills, categories, newRev, repRev, newBills, repBills, categoryUnits, stylistRev, stylistBills, storeUnits, stylistStoreRev}));
}

// ---------- csv parsing ----------
function parseCSVFile(file){
  return new Promise((resolve, reject) => {
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: (res) => resolve(res.data),
      error: reject,
    });
  });
}

function dateKeyFromRow(row){
  if(row['Day']) return row['Day'].slice(0,10);
  if(row['Hour']) return row['Hour'].slice(0,10);
  return null;
}

async function handleFiles(fileList){
  const statusEl = document.getElementById('bsc-upload-status');
  statusEl.textContent = 'Reading file...';
  statusEl.style.color = 'var(--text-mute)';
  let totalRowsAdded = 0;
  let daysTouched = new Set();
  try{
    for(const file of fileList){
      const rows = await parseCSVFile(file);
      const byDateStore = {};
      const byDateStoreBillSet = {};       // dk -> store -> Set(orderName), all bills
      const byDateStoreNewBillSet = {};    // dk -> store -> Set(orderName), new-customer bills
      const byDateStoreRepBillSet = {};    // dk -> store -> Set(orderName), repeat-customer bills
      const byDateCat = {};                // dk -> category -> revenue
      const byDateCatUnits = {};           // dk -> category -> units (quantity)
      const byDateStoreNewRev = {};        // dk -> store -> new-customer revenue
      const byDateStoreRepRev = {};        // dk -> store -> repeat-customer revenue
      const byDateStylistRev = {};         // dk -> stylist -> revenue
      const byDateStylistBillSet = {};     // dk -> stylist -> Set(orderName)
      const byDateStoreUnits = {};         // dk -> store -> units (quantity)
      const byDateStylistStoreRev = {};    // dk -> stylist -> store -> revenue (to find each stylist's home store)
      rows.forEach(row => {
        if(row['Order or return'] !== 'order') return;
        const dk = dateKeyFromRow(row);
        if(!dk) return;
        const store = (row['POS location name'] || 'Online').trim();
        const gross = parseFloat(row['Gross sales']) || 0;
        const tax = parseFloat(row['Taxes']) || 0;
        const rev = gross + tax;
        const qty = parseFloat(row['Quantity ordered']) || 0;
        const orderName = row['Order name'] || '';
        const rawType = (row['Product type'] || 'Uncategorized').trim() || 'Uncategorized';
        const sku = (row['Product variant SKU'] || '');
        // Shirt SKUs without a dash (e.g. BOMSH04CM00256) are MTM/bespoke; SKUs with a
        // dash (e.g. BOM-SHI-33034-BROWN38) are RTW. This is the confirmed rule.
        let cat = rawType;
        if(rawType.toLowerCase() === 'shirt'){
          cat = sku.includes('-') ? 'RTW Shirt' : 'MTM Shirt';
        }
        const segment = (row['New or returning customer'] || '').trim().toLowerCase();
        const isNew = segment === 'new';
        const isReturning = segment === 'returning';
        const stylist = (row['Assisting staff member name'] || '').trim();

        byDateStore[dk] = byDateStore[dk] || {};
        byDateStore[dk][store] = (byDateStore[dk][store] || 0) + rev;

        byDateStoreBillSet[dk] = byDateStoreBillSet[dk] || {};
        byDateStoreBillSet[dk][store] = byDateStoreBillSet[dk][store] || new Set();
        if(orderName) byDateStoreBillSet[dk][store].add(orderName);

        byDateCat[dk] = byDateCat[dk] || {};
        byDateCat[dk][cat] = (byDateCat[dk][cat] || 0) + rev;
        byDateCatUnits[dk] = byDateCatUnits[dk] || {};
        byDateCatUnits[dk][cat] = (byDateCatUnits[dk][cat] || 0) + qty;

        byDateStoreUnits[dk] = byDateStoreUnits[dk] || {};
        byDateStoreUnits[dk][store] = (byDateStoreUnits[dk][store] || 0) + qty;

        if(isNew){
          byDateStoreNewRev[dk] = byDateStoreNewRev[dk] || {};
          byDateStoreNewRev[dk][store] = (byDateStoreNewRev[dk][store] || 0) + rev;
          byDateStoreNewBillSet[dk] = byDateStoreNewBillSet[dk] || {};
          byDateStoreNewBillSet[dk][store] = byDateStoreNewBillSet[dk][store] || new Set();
          if(orderName) byDateStoreNewBillSet[dk][store].add(orderName);
        } else if(isReturning){
          byDateStoreRepRev[dk] = byDateStoreRepRev[dk] || {};
          byDateStoreRepRev[dk][store] = (byDateStoreRepRev[dk][store] || 0) + rev;
          byDateStoreRepBillSet[dk] = byDateStoreRepBillSet[dk] || {};
          byDateStoreRepBillSet[dk][store] = byDateStoreRepBillSet[dk][store] || new Set();
          if(orderName) byDateStoreRepBillSet[dk][store].add(orderName);
        }

        if(stylist){
          byDateStylistRev[dk] = byDateStylistRev[dk] || {};
          byDateStylistRev[dk][stylist] = (byDateStylistRev[dk][stylist] || 0) + rev;
          byDateStylistBillSet[dk] = byDateStylistBillSet[dk] || {};
          byDateStylistBillSet[dk][stylist] = byDateStylistBillSet[dk][stylist] || new Set();
          if(orderName) byDateStylistBillSet[dk][stylist].add(orderName);
          byDateStylistStoreRev[dk] = byDateStylistStoreRev[dk] || {};
          byDateStylistStoreRev[dk][stylist] = byDateStylistStoreRev[dk][stylist] || {};
          byDateStylistStoreRev[dk][stylist][store] = (byDateStylistStoreRev[dk][stylist][store] || 0) + rev;
        }

        daysTouched.add(dk);
      });
      for(const dk in byDateStore){
        const bills = {};
        const billSets = byDateStoreBillSet[dk] || {};
        Object.keys(billSets).forEach(store => { bills[store] = billSets[store].size; });

        const newBills = {};
        const newBillSets = byDateStoreNewBillSet[dk] || {};
        Object.keys(newBillSets).forEach(store => { newBills[store] = newBillSets[store].size; });

        const repBills = {};
        const repBillSets = byDateStoreRepBillSet[dk] || {};
        Object.keys(repBillSets).forEach(store => { repBills[store] = repBillSets[store].size; });

        const stylistBills = {};
        const stylistBillSets = byDateStylistBillSet[dk] || {};
        Object.keys(stylistBillSets).forEach(st => { stylistBills[st] = stylistBillSets[st].size; });

        const newRev = byDateStoreNewRev[dk] || {};
        const repRev = byDateStoreRepRev[dk] || {};
        const categories = byDateCat[dk] || {};
        const categoryUnits = byDateCatUnits[dk] || {};
        const stylistRev = byDateStylistRev[dk] || {};
        const storeUnits = byDateStoreUnits[dk] || {};
        const stylistStoreRev = byDateStylistStoreRev[dk] || {};

        state.days[dk] = byDateStore[dk];
        state.billDays[dk] = bills;
        state.catDays[dk] = categories;
        state.catUnitDays[dk] = categoryUnits;
        state.newRevDays[dk] = newRev;
        state.repRevDays[dk] = repRev;
        state.newBillDays[dk] = newBills;
        state.repBillDays[dk] = repBills;
        state.stylistRevDays[dk] = stylistRev;
        state.stylistBillDays[dk] = stylistBills;
        state.storeUnitDays[dk] = storeUnits;
        state.stylistStoreRevDays[dk] = stylistStoreRev;

        await saveDay(dk, byDateStore[dk], bills, categories, newRev, repRev, newBills, repBills, categoryUnits, stylistRev, stylistBills, storeUnits, stylistStoreRev);
        totalRowsAdded++;
      }
    }
    statusEl.textContent = 'Saved ' + daysTouched.size + ' day' + (daysTouched.size===1?'':'s') + ': ' + Array.from(daysTouched).sort().join(', ');
    statusEl.style.color = 'var(--good)';
  }catch(e){
    statusEl.textContent = 'Could not read that file. Make sure it is a Shopify sales export CSV.';
    statusEl.style.color = 'var(--bad)';
    console.error(e);
  }
  render();
}

// ---------- calculations ----------
function dayType(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.getDay();
  return (dow === 0 || dow === 6) ? 'weekend' : 'weekday';
}

function offlineRegion(store){
  return REGION_MAP[store] || null;
}

function storeTargetForDay(store, dateStr){
  const rec = STORE_LOOKUP[store];
  if(!rec) return null;
  return dayType(dateStr) === 'weekend' ? rec.weekend_target : rec.weekday_target;
}

function getSortedDays(){
  return Object.keys(state.days).sort();
}

function computeStoreTotals(dayFilter){
  const totals = {}; // store -> {actual, target}
  Object.keys(TARGETS.reduce((acc,t)=>{acc[t.pos_name]=1;return acc;},{})).forEach(s=>{
    totals[s] = {actual: 0, target: 0, days: 0};
  });
  getSortedDays().filter(dayFilter).forEach(dk => {
    const dayData = state.days[dk];
    Object.keys(totals).forEach(store => {
      const tgt = storeTargetForDay(store, dk);
      if(tgt !== null){
        totals[store].target += tgt;
        totals[store].actual += (dayData[store] || 0);
        totals[store].days += 1;
      }
    });
  });
  return totals;
}

function computeRegionTotals(storeTotals){
  const regions = {North:{actual:0,target:0}, South:{actual:0,target:0}, West:{actual:0,target:0}};
  Object.keys(storeTotals).forEach(store => {
    const rec = STORE_LOOKUP[store];
    if(!rec) return;
    regions[rec.region].actual += storeTotals[store].actual;
    regions[rec.region].target += storeTotals[store].target;
  });
  return regions;
}

function fmtINR(n){
  n = Math.round(n);
  if(Math.abs(n) >= 10000000) return '\u20b9' + (n/10000000).toFixed(2) + 'Cr';
  if(Math.abs(n) >= 100000) return '\u20b9' + (n/100000).toFixed(2) + 'L';
  return '\u20b9' + n.toLocaleString('en-IN');
}
function fmtPct(n){ return (isFinite(n) ? n.toFixed(1) : '0.0') + '%'; }
function achColor(pct){
  if(pct >= 100) return 'var(--good)';
  if(pct >= 80) return 'var(--warn)';
  return 'var(--bad)';
}

  const cmk = currentMonthKey();

  rangeBar.style.cssText = 'padding:12px 24px 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap;';

  const maxDate = allDays.length ? allDays[allDays.length-1] : '';
  const prefillStart = usingCustomRange ? state.dateRange.start : (days.length ? days[0] : '');
  const prefillEnd = usingCustomRange ? state.dateRange.end : (days.length ? days[days.length-1] : '');

    <span style="font-size:11.5px; color:var(--text-mute);">Date range:</span>
    <input type="date" id="bsc-range-start" value="${prefillStart}"

    <span style="font-size:11.5px; color:var(--text-mute);">to</span>
    <input type="date" id="bsc-range-end" value="${prefillEnd}"
      style="background:var(--panel); border:0.5px solid var(--line2); color:var(--text); font-size:12px; padding:5px 8px; border-radius:6px; font-family:inherit; color-scheme:dark;">
    <button id="bsc-range-apply" style="background:var(--brass); color:#1a1408; border:none; font-size:12px; font-weight:600; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:inherit;">Apply</button>
    ${usingCustomRange ? '<button id="bsc-range-reset" style="background:none; border:0.5px solid var(--line2); color:var(--text-dim); font-size:12px; padding:6px 12px; border-radius:6px; cursor:pointer; font-family:inherit;">Reset to current month</button>' : ''}
  `;
  root.appendChild(rangeBar);

  if(olderDaysExcluded > 0){
    const scopeNote = document.createElement('div');
    scopeNote.style.cssText = 'padding:8px 24px 0; font-size:11.5px; color:var(--text-mute);';
    scopeNote.textContent = usingCustomRange
      ? 'Showing ' + state.dateRange.start + ' to ' + state.dateRange.end + ' (' + days.length + ' day' + (days.length===1?'':'s') + '). ' + olderDaysExcluded + ' other stored day(s) are outside this range.'
      : 'Showing ' + cmk + ' only (' + days.length + ' day' + (days.length===1?'':'s') + '). ' +
        olderDaysExcluded + ' day' + (olderDaysExcluded===1?'':'s') + ' from other months are stored but hidden from these tabs.';
    root.appendChild(scopeNote);
  }

  if(days.length === 0 && state.activeTab !== 'refunds'){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:60px 24px; text-align:center;';
    if(usingCustomRange){
      empty.innerHTML = `
        <i class="ti ti-calendar-off" style="font-size:32px; color:var(--text-mute); margin-bottom:12px; display:block;" aria-hidden="true"></i>
        <div style="font-size:15px; color:var(--text-dim); margin-bottom:4px;">No data in ${state.dateRange.start} to ${state.dateRange.end}</div>
        <div style="font-size:13px; color:var(--text-mute); margin-bottom:16px;">None of your uploaded days fall inside that range. Pick a different range above, or reset it.</div>

      resetBtn.onclick = () => { state.dateRange = null; render(); };
      empty.appendChild(resetBtn);
    } else {
      empty.innerHTML = `
        <i class="ti ti-chart-bar" style="font-size:32px; color:var(--text-mute); margin-bottom:12px; display:block;" aria-hidden="true"></i>
        <div style="font-size:15px; color:var(--text-dim); margin-bottom:4px;">No data yet</div>
        <div style="font-size:13px; color:var(--text-mute);">This dashboard hasn\u2019t been updated with data for the current period yet \u2014 check back soon, or check the Refunds &amp; CN tab below.</div>
      `;
    }
    root.appendChild(empty);
    const tabBarEmpty = document.createElement('div');
    tabBarEmpty.style.cssText = 'display:flex; gap:2px; padding:0 24px 16px; border-bottom:1px solid var(--line);';
    const b = document.createElement('button');
    b.textContent = 'Refunds & CN';
    b.style.cssText = 'background:none; border:none; border-bottom:2px solid transparent; color:var(--text-mute); font-size:13.5px; font-weight:500; padding:9px 16px; cursor:pointer; font-family:inherit;';
    b.onclick = () => { state.activeTab = 'refunds'; render(); };
    tabBarEmpty.appendChild(b);
    root.appendChild(tabBarEmpty);
    attachHandlers();
    return;
  }

  // tabs
  const tabBar = document.createElement('div');
  tabBar.style.cssText = 'display:flex; gap:2px; padding:16px 24px 0; border-bottom:1px solid var(--line);';
  const tabs = [
    {id:'overview', label:'Overview', icon:'ti-layout-dashboard'},
    {id:'stores', label:'Store-wise', icon:'ti-building-store'},
    {id:'regions', label:'Region-wise', icon:'ti-map-2'},
    {id:'trend', label:'Daily trend', icon:'ti-chart-line'},
    {id:'category', label:'Category', icon:'ti-shirt'},
    {id:'refunds', label:'Refunds & CN', icon:'ti-receipt-refund'},
    {id:'stylists', label:'Stylists', icon:'ti-user-star'},
  ];
  tabs.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.label;
    b.dataset.tab = t.id;
    const active = state.activeTab === t.id;
    b.style.cssText = `background:none; border:none; border-bottom:2px solid ${active?'var(--brass)':'transparent'};
      color:${active?'var(--text)':'var(--text-mute)'}; font-size:13.5px; font-weight:${active?'600':'500'};
      padding:9px 16px; cursor:pointer; font-family:inherit;`;
    b.onclick = () => { state.activeTab = t.id; render(); };
    tabBar.appendChild(b);
  });
  root.appendChild(tabBar);

  const body = document.createElement('div');
  body.style.cssText = 'padding:20px 24px 24px;';
  root.appendChild(body);

  if(state.activeTab === 'overview') renderOverview(body, days);
  if(state.activeTab === 'stores') renderStores(body, days);
  if(state.activeTab === 'regions') renderRegions(body, days);
  if(state.activeTab === 'trend') renderTrend(body, days);
  if(state.activeTab === 'category') renderCategoryAOV(body, days);
  if(state.activeTab === 'refunds') renderRefunds(body);
  if(state.activeTab === 'stylists') renderStylists(body, days);

  attachHandlers();
}

function dayLabel(dk){
  const d = new Date(dk + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', weekday:'short'});
}

function renderOverview(body, days){
  const todayStr = todayDateKey();
  let latestDay = days[days.length-1];
  let isPartialToday = false;
  // If the most recent upload is for today, that day's sales are still coming in and
  // will look artificially low (or zero) if the day isn't over yet -- so the headline
  // "day" card falls back to the last full day instead. Today's partial numbers are
  // still counted in month-to-date, just not used as the misleading "day" snapshot.
  if(latestDay === todayStr && days.length > 1){
    latestDay = days[days.length-2];
    isPartialToday = true;
  }
  const storeTotalsMTD = computeStoreTotals(() => true);
  const regionTotalsMTD = computeRegionTotals(storeTotalsMTD);
  const storeTotalsToday = computeStoreTotals(d => d === latestDay);
  const regionTotalsToday = computeRegionTotals(storeTotalsToday);

  const mtdActual = Object.values(regionTotalsMTD).reduce((s,r)=>s+r.actual,0);
  const mtdTarget = Object.values(regionTotalsMTD).reduce((s,r)=>s+r.target,0);
  const todayActual = Object.values(regionTotalsToday).reduce((s,r)=>s+r.actual,0);
  const todayTarget = Object.values(regionTotalsToday).reduce((s,r)=>s+r.target,0);

  if(isPartialToday){
    const partialNote = document.createElement('div');
    partialNote.style.cssText = 'font-size:12px; color:var(--text-mute); margin-bottom:14px; padding:10px 14px; background:var(--panel); border-radius:8px;';
    partialNote.innerHTML = '<i class="ti ti-clock" style="font-size:14px; vertical-align:-2px; margin-right:6px;" aria-hidden="true"></i>' +
      'You\u2019ve uploaded data for today (' + dayLabel(days[days.length-1]) + '), but it\u2019s still an in-progress day, so the snapshot below shows ' + dayLabel(latestDay) + ' (the last full day) instead. ' +
      'Today\u2019s partial numbers are still included in the month-to-date total.';
    body.appendChild(partialNote);
  }

  const cardsRow = document.createElement('div');
  cardsRow.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;';
  const cards = [
    {label: dayLabel(latestDay) + ' actual', val: fmtINR(todayActual), sub: 'vs target ' + fmtINR(todayTarget)},
    {label: dayLabel(latestDay) + ' ach%', val: fmtPct(todayTarget?todayActual/todayTarget*100:0), color: achColor(todayTarget?todayActual/todayTarget*100:0)},
    {label: 'Month-to-date actual', val: fmtINR(mtdActual), sub: 'vs target ' + fmtINR(mtdTarget)},
    {label: 'MTD ach%', val: fmtPct(mtdTarget?mtdActual/mtdTarget*100:0), color: achColor(mtdTarget?mtdActual/mtdTarget*100:0)},
    {label: 'Overall NPS', val: state.npsData && state.npsData.overall !== null && state.npsData.overall !== undefined ? state.npsData.overall.toFixed(1) : '\u2014', sub: state.npsData ? Object.keys(state.npsData.byStore||{}).length + ' stores' : 'Upload NPS file below'},
  ];
  cards.forEach(c => {
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--panel); border-radius:10px; padding:14px 16px;';
    card.innerHTML = `<div style="font-size:12px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
      <div style="font-size:22px; font-weight:600; color:${c.color||'var(--text)'};" class="bsc-mono">${c.val}</div>
      ${c.sub?`<div style="font-size:11.5px; color:var(--text-mute); margin-top:3px;">${c.sub}</div>`:''}`;
    cardsRow.appendChild(card);
  });
  body.appendChild(cardsRow);

  const regionHead = document.createElement('div');
  regionHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  regionHead.textContent = 'Region snapshot \u2014 ' + dayLabel(latestDay) + ' vs month-to-date';
  body.appendChild(regionHead);

  const table = document.createElement('table');
  table.style.cssText = 'font-size:13px; margin-bottom:8px;';
  let rows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">Region</td><td style="padding:6px 10px; text-align:right;">Today target</td>' +
    '<td style="padding:6px 10px; text-align:right;">Today actual</td><td style="padding:6px 10px; text-align:right;">Today ach%</td>' +
    '<td style="padding:6px 10px; text-align:right;">MTD ach%</td></tr>';
  ['North','South','West'].forEach(reg => {
    const t = regionTotalsToday[reg], m = regionTotalsMTD[reg];
    const achT = t.target ? t.actual/t.target*100 : 0;
    const achM = m.target ? m.actual/m.target*100 : 0;
    rows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; font-weight:500;">${reg}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(t.target)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(t.actual)}</td>
      <td style="padding:8px 10px; text-align:right; color:${achColor(achT)}; font-weight:600;" class="bsc-mono">${fmtPct(achT)}</td>
      <td style="padding:8px 10px; text-align:right; color:${achColor(achM)}; font-weight:600;" class="bsc-mono">${fmtPct(achM)}</td>
    </tr>`;
  });
  table.innerHTML = rows;
  body.appendChild(table);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:14px; line-height:1.6;';
  note.textContent = 'Targets are derived from each store\u2019s monthly target split into weekday/weekend daily figures using its own actual July performance ratio. ' + days.length + ' day(s) of data loaded.';
  body.appendChild(note);

  }

function renderStores(body, days){
  const dayFilter = () => true;
  const totals = computeStoreTotals(dayFilter);
  const rowsArr = Object.keys(totals).map(store => {
    const t = totals[store];
    const ach = t.target ? t.actual/t.target*100 : 0;
    const aug25 = BASELINE.aug25StoreRevenue ? BASELINE.aug25StoreRevenue[store] : null;
    let sssg = null;
    if(aug25 && t.days > 0){
      // Only a month total is available for Aug 2025, so pro-rate by the number of days
      // you've uploaded this month -- same approach as the region-level comparison.
      const proRatedLastYear = aug25 * (t.days / BASELINE.aug25.days);
      sssg = proRatedLastYear ? (t.actual - proRatedLastYear) / proRatedLastYear * 100 : null;
    }
    return {store, region: STORE_LOOKUP[store] ? STORE_LOOKUP[store].region : '-', ...t, ach, sssg};
  }).filter(r => r.days > 0).sort((a,b) => a.ach - b.ach);

  const storeOrder = rowsArr.map(r => r.store); // canonical order, reused by the AOV table below

  const headTvA = document.createElement('div');
  headTvA.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  headTvA.textContent = 'Target vs achievement';
  body.appendChild(headTvA);

  const table = document.createElement('table');
  table.style.cssText = 'font-size:13px; margin-bottom:28px;';
  let rows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">Store</td><td style="padding:6px 10px;">Region</td>' +
    '<td style="padding:6px 10px; text-align:right;">Target</td><td style="padding:6px 10px; text-align:right;">Actual</td>' +
    '<td style="padding:6px 10px; text-align:right;">Ach%</td><td style="padding:6px 10px; text-align:right;">SSSG</td><td style="padding:6px 10px; text-align:right;">NPS</td></tr>';
  rowsArr.forEach(r => {
    const sssgCell = r.sssg === null
      ? '<td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">New store</td>'
      : `<td style="padding:8px 10px; text-align:right; color:${r.sssg>=0?'var(--good)':'var(--bad)'}; font-weight:600;" class="bsc-mono">${r.sssg>=0?'+':''}${r.sssg.toFixed(1)}%</td>`;
    const npsVal = state.npsData && state.npsData.byStore ? state.npsData.byStore[r.store] : undefined;
    const npsCell = (npsVal === undefined || npsVal === null)
      ? '<td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">\u2014</td>'
      : `<td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${npsVal.toFixed(1)}</td>`;
    rows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; font-weight:500;">${r.store}</td>
      <td style="padding:8px 10px; color:var(--text-mute);">${r.region}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(r.target)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(r.actual)}</td>
      <td style="padding:8px 10px; text-align:right; color:${achColor(r.ach)}; font-weight:600;" class="bsc-mono">${fmtPct(r.ach)}</td>
      ${sssgCell}
      ${npsCell}
    </tr>`;
  });
  table.innerHTML = rows;
  body.appendChild(table);

  const sssgNote = document.createElement('div');
  sssgNote.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:-20px; margin-bottom:28px; line-height:1.6;';
  sssgNote.textContent = 'SSSG compares this store\u2019s revenue so far this month against its August 2025 revenue, pro-rated to the same number of days \u2014 an approximation, since only a full-month total exists for Aug 2025, not a daily breakdown. "New store" means it wasn\u2019t open (or had no comparable revenue) in August 2025.';
  body.appendChild(sssgNote);

  // ---- AOV / New vs Repeat / UPT breakdown ----
  const nvrTotals = {};
  days.forEach(dk => {
    const revs = state.days[dk] || {};
    const bills = state.billDays[dk] || {};
    const newRev = state.newRevDays[dk] || {};
    const repRev = state.repRevDays[dk] || {};
    const newBills = state.newBillDays[dk] || {};
    const repBills = state.repBillDays[dk] || {};
    const units = state.storeUnitDays[dk] || {};
    Object.keys(revs).forEach(store => {
      if(!offlineRegion(store)) return;
      nvrTotals[store] = nvrTotals[store] || {rev:0, bills:0, newRev:0, repRev:0, newBills:0, repBills:0, units:0};
      const n = nvrTotals[store];
      n.rev += revs[store] || 0;
      n.bills += bills[store] || 0;
      n.newRev += newRev[store] || 0;
      n.repRev += repRev[store] || 0;
      n.newBills += newBills[store] || 0;
      n.repBills += repBills[store] || 0;
      n.units += units[store] || 0;
    });
  });
  const nvrArr = storeOrder.filter(store => nvrTotals[store]).map(store => {
    const n = nvrTotals[store];
    return {
      store, region: offlineRegion(store),
      aov: n.bills ? n.rev/n.bills : 0,
      newAov: n.newBills ? n.newRev/n.newBills : 0,
      repAov: n.repBills ? n.repRev/n.repBills : 0,
      newBills: n.newBills, repBills: n.repBills,
      newRev: n.newRev, repRev: n.repRev,
      upt: n.bills ? n.units/n.bills : 0,
    };
  });
  // same order as the Target vs Achievement table above (ach%, ascending)

  const hasSegmentData = nvrArr.some(r => r.newBills > 0 || r.repBills > 0);
  const hasUnitData = nvrArr.some(r => r.upt > 0);

  const headAov = document.createElement('div');
  headAov.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  headAov.textContent = 'AOV, UPT and new vs repeat, with change vs July 2026 \u2014 same store order as Target vs Achievement above';
  body.appendChild(headAov);

  if(!hasSegmentData){
    const warn = document.createElement('div');
    warn.style.cssText = 'font-size:12px; color:var(--text-mute); margin-bottom:16px; padding:10px 14px; background:var(--panel); border-radius:8px;';
    warn.textContent = 'Your uploaded CSV(s) don\u2019t have a \u201cNew or returning customer\u201d column populated, so new/repeat splits show as zero. AOV (all customers) still works below.';
    body.appendChild(warn);
  }
  if(!hasUnitData){
    const warn2 = document.createElement('div');
    warn2.style.cssText = 'font-size:12px; color:var(--text-mute); margin-bottom:16px; padding:10px 14px; background:var(--panel); border-radius:8px;';
    warn2.textContent = 'Your uploaded CSV(s) don\u2019t have a \u201cQuantity ordered\u201d column populated, so UPT shows as zero.';
    body.appendChild(warn2);
  }

  const aovTable = document.createElement('table');
  aovTable.style.cssText = 'font-size:13px;';
  let aovRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">Store</td><td style="padding:6px 10px;">Region</td>' +
    '<td style="padding:6px 10px; text-align:right;">AOV</td><td style="padding:6px 10px; text-align:right;">vs Jul</td>' +
    '<td style="padding:6px 10px; text-align:right;">UPT</td><td style="padding:6px 10px; text-align:right;">vs Jul</td>' +
    '<td style="padding:6px 10px; text-align:right;">New AOV</td><td style="padding:6px 10px; text-align:right;">vs Jul</td>' +
    '<td style="padding:6px 10px; text-align:right;">Repeat AOV</td><td style="padding:6px 10px; text-align:right;">vs Jul</td>' +
    '<td style="padding:6px 10px; text-align:right;">New bills</td><td style="padding:6px 10px; text-align:right;">Repeat bills</td>' +
    '<td style="padding:6px 10px; text-align:right;">New revenue</td><td style="padding:6px 10px; text-align:right;">Repeat revenue</td></tr>';
  function deltaCell(now, then){
    if(!then) return '<td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">\u2014</td>';
    const pct = (now-then)/then*100;
    const color = pct >= 0 ? 'var(--good)' : 'var(--bad)';
    return `<td style="padding:8px 10px; text-align:right; color:${color}; font-weight:600;" class="bsc-mono">${pct>=0?'+':''}${pct.toFixed(1)}%</td>`;
  }

      <div style="font-size:12px; color:var(--text-mute); margin-top:6px;">${fmtINR(r.actual)} of ${fmtINR(r.target)}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-top:8px; padding-top:8px; border-top:0.5px solid var(--line);">NPS: <span style="color:var(--text); font-weight:600;" class="bsc-mono">${regNps!==null?regNps.toFixed(1):'\u2014'}</span></div>`;
    grid.appendChild(card);

          {label:'Actual', data:['North','South','West'].map(r=>Math.round(regionTotals[r].actual)), backgroundColor:'#c9a15b', borderRadius:4},
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: {
          x: {ticks:{color:'#9a9da5'}, grid:{display:false}},

        },
        plugins: { legend: { display:false } }
      }
    });
  });

  const legend = document.createElement('div');
  legend.style.cssText = 'display:flex; gap:16px; margin-top:10px; margin-bottom:28px; font-size:12px; color:var(--text-dim);';
  legend.innerHTML = `<span style="display:flex; align-items:center; gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:#383e49;"></span>Target</span>
    <span style="display:flex; align-items:center; gap:5px;"><span style="width:9px;height:9px;border-radius:2px;background:#c9a15b;"></span>Actual</span>`;
  body.appendChild(legend);

  // ---- Daily trend, by region ----
  const trendHead = document.createElement('div');
  trendHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  trendHead.textContent = 'Daily trend by region';
  body.appendChild(trendHead);

    const revs = state.days[dk] || {};

        datasets: ['North','South','West'].map(reg => ({
          label: reg, data: dailyByRegion[reg].map(v=>Math.round(v)),
          borderColor: regionColors[reg], backgroundColor: regionColors[reg]+'22',
          pointRadius:3, tension:0.15,
        }))
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: {
          x: {ticks:{color:'#9a9da5', maxRotation:45, autoSkip:false}, grid:{display:false}},
          y: {ticks:{color:'#9a9da5', callback:(v)=>fmtINR(v)}, grid:{color:'#2c313a'}}
        },
        plugins: { legend: { display:true, labels:{color:'#e9e6df', font:{size:11}} } }

  const trendSpacer = document.createElement('div');
  trendSpacer.style.cssText = 'margin-bottom:28px;';

  // ---- Revenue vs last month (same date range) and last year (pro-rated) ----
  const compHead = document.createElement('div');
  compHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  const dayNumbers = days.map(dk => new Date(dk+'T00:00:00').getDate());
  const maxDayNum = dayNumbers.length ? Math.max(...dayNumbers) : 0;
  compHead.textContent = 'Revenue vs same dates last month and last year (through day ' + maxDayNum + ' of the month)';
  body.appendChild(compHead);

  // Last month (July 2026): sum actual daily data for day 1..maxDayNum
  const julyDaily = BASELINE.july26DailyRegion || {};
  const lastMonthRegion = {North:0, South:0, West:0};
  for(let d=1; d<=maxDayNum; d++){
    const dayData = julyDaily[String(d)] || julyDaily[d] || {};
    ['North','South','West'].forEach(reg => { lastMonthRegion[reg] += dayData[reg] || 0; });
  }
  const lastMonthHasData = maxDayNum > 0 && Object.values(lastMonthRegion).some(v=>v>0);

  // Last year (Aug 2025): only a month total is available, so pro-rate by day count (approximation)
  const lastYearRegion = {};
  ['North','South','West'].forEach(reg => {
    lastYearRegion[reg] = BASELINE.aug25.region[reg] * (maxDayNum / BASELINE.aug25.days);
  });

  const compTable = document.createElement('table');
  compTable.style.cssText = 'font-size:13px;';

    '<td style="padding:6px 10px; text-align:right;">Jul 2026 (same dates)</td><td style="padding:6px 10px; text-align:right;">vs Jul</td>' +
    '<td style="padding:6px 10px; text-align:right;">Aug 2025 (pro-rated)</td><td style="padding:6px 10px; text-align:right;">vs Aug\u201925</td></tr>';
  ['North','South','West'].forEach(reg => {
    const now = regionTotals[reg].actual;
    const lm = lastMonthHasData ? lastMonthRegion[reg] : null;
    const ly = lastYearRegion[reg];
    const vsLm = lm ? (now-lm)/lm*100 : null;
    const vsLy = ly ? (now-ly)/ly*100 : null;
    compRows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; font-weight:500;">${reg}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(now)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${lm!==null?fmtINR(lm):'\u2014'}</td>
      <td style="padding:8px 10px; text-align:right; color:${vsLm===null?'var(--text-mute)':(vsLm>=0?'var(--good)':'var(--bad)')}; font-weight:600;" class="bsc-mono">${vsLm!==null?((vsLm>=0?'+':'')+vsLm.toFixed(1)+'%'):'\u2014'}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(ly)}</td>
      <td style="padding:8px 10px; text-align:right; color:${vsLy===null?'var(--text-mute)':(vsLy>=0?'var(--good)':'var(--bad)')}; font-weight:600;" class="bsc-mono">${vsLy!==null?((vsLy>=0?'+':'')+vsLy.toFixed(1)+'%'):'\u2014'}</td>
    </tr>`;
  });
  compTable.innerHTML = compRows;
  body.appendChild(compTable);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:14px; line-height:1.6;';
  note.textContent = 'Jul 2026 figures are real day-by-day revenue for the same day-of-month range you\u2019ve uploaded so far. ' +
    'Aug 2025 only exists as a full-month total in this dashboard, so it\u2019s pro-rated by day count (day ' + maxDayNum + ' of ' + BASELINE.aug25.days + ') as an approximation \u2014 ' +
    'not a true day-for-day comparison, since footfall isn\u2019t evenly spread across a month.';
  body.appendChild(note);
}

    Object.keys(state.days[dk]).forEach(store => {
      if(offlineRegion(store)){
        actual += state.days[dk][store];
      }
    });
    Object.keys(STORE_LOOKUP).forEach(store => {
      const t = storeTargetForDay(store, dk);
      if(t !== null) target += t;
    });
    return {dk, actual, target};
  });

  const canvasWrap = document.createElement('div');
  canvasWrap.style.cssText = 'position:relative; height:280px; margin-bottom:16px;';
  canvasWrap.innerHTML = `<canvas id="bsc-trend-chart" role="img" aria-label="Daily actual vs target revenue trend"></canvas>`;

      type: 'line',

        labels: dailyTotals.map(d => dayLabel(d.dk)),

    <span style="display:flex; align-items:center; gap:5px;"><span style="width:14px;height:2px;background:#c9a15b;"></span>Actual</span>`;

  const table = document.createElement('table');
  table.style.cssText = 'font-size:13px;';
  let rows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">Day</td><td style="padding:6px 10px; text-align:right;">Target</td>' +
    '<td style="padding:6px 10px; text-align:right;">Actual</td><td style="padding:6px 10px; text-align:right;">Ach%</td></tr>';

    const ach = d.target ? d.actual/d.target*100 : 0;
    rows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px;">${dayLabel(d.dk)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(d.target)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(d.actual)}</td>
      <td style="padding:8px 10px; text-align:right; color:${achColor(ach)}; font-weight:600;" class="bsc-mono">${fmtPct(ach)}</td>
    </tr>`;
