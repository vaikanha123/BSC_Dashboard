function renderTrainingCohort(body, days, cfg){
  const cmk = currentMonthKey();
  const TRAINING_COHORT = cfg.cohortList;
  const STORE_SPECIFIC_STYLISTS = cfg.storeOverrides; // per-stylist store scoping, see COHORT_CONFIGS
  const COHORT_BASELINE = cfg.baseline;
  const STYLIST_DETAIL = cfg.stylistDetail;
  const baseLbl = cfg.baselineLabel; // e.g. 'Jul' / 'Aug', used in short "vs X" labels
  const baseFullLbl = cfg.baselineFullLabel; // e.g. 'July' / 'August', used in prose

  // Per-day, per-cohort aggregation (respects whatever date range is currently selected)
  const cohortDaily = {}; // dk -> {training:{rev,bills,units}, rest:{rev,bills,units}}
  days.forEach(dk => {
    const revs = state.stylistRevDays[dk] || {};
    const bills = state.stylistBillDays[dk] || {};
    const units = state.stylistUnitDays[dk] || {};
    const storeRevD = state.stylistStoreRevDays[dk] || {};
    const storeBillsD = state.stylistStoreBillsDays[dk] || {};
    const storeUnitsD = state.stylistStoreUnitsDays[dk] || {};
    const dayAgg = {training:{rev:0,bills:0,units:0}, rest:{rev:0,bills:0,units:0}};
    Object.keys(revs).forEach(st => {
      const norm = st.trim().toLowerCase();
      const bucket = TRAINING_COHORT.includes(norm) ? 'training' : 'rest';
      if(bucket === 'training' && STORE_SPECIFIC_STYLISTS[norm]){
        const targetStore = STORE_SPECIFIC_STYLISTS[norm];
        dayAgg.training.rev += (storeRevD[st] && storeRevD[st][targetStore]) || 0;
        dayAgg.training.bills += (storeBillsD[st] && storeBillsD[st][targetStore]) || 0;
        dayAgg.training.units += (storeUnitsD[st] && storeUnitsD[st][targetStore]) || 0;
        return;
      }
      dayAgg[bucket].rev += revs[st] || 0;
      dayAgg[bucket].bills += bills[st] || 0;
      dayAgg[bucket].units += units[st] || 0;
    });
    cohortDaily[dk] = dayAgg;
  });

  const totals = {training:{rev:0,bills:0,units:0}, rest:{rev:0,bills:0,units:0}};
  days.forEach(dk => {
    ['training','rest'].forEach(b => {
      totals[b].rev += cohortDaily[dk][b].rev;
      totals[b].bills += cohortDaily[dk][b].bills;
      totals[b].units += cohortDaily[dk][b].units;
    });
  });

  // Pooled cards and the revenue-impact estimate compare against everything since the baseline
  // month, not just the live current period -- so fold in any already-closed months (cfg.priorClosedMonths)
  // between the baseline and now (cohort 1: Aug + Sep; cohort 2: Sep).
  const combinedTotals = {training: {...totals.training}, rest: {...totals.rest}};
  (cfg.priorClosedMonths || []).forEach(pm => {
    ['training','rest'].forEach(b => {
      combinedTotals[b].rev += pm[b].revenue || 0;
      combinedTotals[b].bills += pm[b].bills || 0;
      combinedTotals[b].units += pm[b].units || 0;
    });
  });
  const priorLabels = (cfg.priorClosedMonths || []).map(pm => pm.label);
  const periodLabel = priorLabels.length ? (priorLabels.join('+') + '\u2013' + cmk + ' combined') : cmk;

  function metricsFor(t){
    return {
      aov: t.bills ? t.rev/t.bills : 0,
      asp: t.units ? t.rev/t.units : 0,
      upt: t.bills ? t.units/t.bills : 0,
    };
  }
  const mTraining = metricsFor(combinedTotals.training);
  const mRest = metricsFor(combinedTotals.rest);

  if(combinedTotals.training.bills === 0 && combinedTotals.rest.bills === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:30px 14px; text-align:center; color:var(--text-mute); font-size:13px;';
    empty.textContent = 'No stylist data in the selected range.';
    body.appendChild(empty);
    return;
  }

  const head = document.createElement('div');
  head.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  head.textContent = cfg.cohortLabel + ' (' + TRAINING_COHORT.length + ' stylists) vs rest of network \u2014 ' + periodLabel;
  body.appendChild(head);

  function deltaVsBaseline(now, then){
    if(!then) return null;
    return (now-then)/then*100;
  }

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-bottom:24px;';
  [
    {label:'Training cohort', m:mTraining, base:COHORT_BASELINE.training, color:'var(--brass)'},
    {label:'Rest of network', m:mRest, base:COHORT_BASELINE.rest, color:'var(--text-dim)'},
  ].forEach(g => {
    const card = document.createElement('div');
    card.style.cssText = `background:var(--panel); border-radius:10px; padding:16px; border-left:3px solid ${g.color};`;
    const rows = ['aov','asp','upt'].map(metric => {
      const label = metric.toUpperCase();
      const val = metric === 'upt' ? g.m[metric].toFixed(2) : fmtINR(g.m[metric]);
      const delta = deltaVsBaseline(g.m[metric], g.base ? g.base[metric] : null);
      const deltaStr = delta === null ? '' :
        ` <span style="color:${delta>=0?'var(--good)':'var(--bad)'}; font-weight:600;">(${delta>=0?'+':''}${delta.toFixed(1)}% vs ${baseLbl})</span>`;
      return `<div style="display:flex; justify-content:space-between; padding:6px 0; border-top:0.5px solid var(--line);">
        <span style="color:var(--text-mute); font-size:12px;">${label}</span>
        <span class="bsc-mono" style="font-size:13px; font-weight:600;">${val}${deltaStr}</span>
      </div>`;
    }).join('');
    card.innerHTML = `<div style="font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px;">${g.label}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-bottom:8px;">${g.label==='Training cohort'?combinedTotals.training.bills:combinedTotals.rest.bills} bills \u00b7 ${fmtINR(g.label==='Training cohort'?combinedTotals.training.rev:combinedTotals.rest.rev)} revenue</div>
      ${rows}`;
    grid.appendChild(card);
  });
  body.appendChild(grid);

  // ---- Revenue impact of training (Method 2: training's AOV vs a counterfactual where it
  // moved with the same growth as rest-of-network -- isolates the training-specific effect
  // from whatever the whole business experienced this period). ----
  if(mRest.aov && COHORT_BASELINE.rest && COHORT_BASELINE.rest.aov){
    const restGrowthPct = (mRest.aov - COHORT_BASELINE.rest.aov) / COHORT_BASELINE.rest.aov * 100;
    const counterfactualAov = COHORT_BASELINE.training.aov * (1 + restGrowthPct/100);
    const impactRev = (mTraining.aov - counterfactualAov) * combinedTotals.training.bills;
    const impactColor = impactRev >= 0 ? 'var(--good)' : 'var(--bad)';
    const impactCard = document.createElement('div');
    impactCard.style.cssText = `background:var(--panel); border-radius:10px; padding:18px 20px; margin-bottom:24px; border-left:3px solid ${impactColor};`;
    impactCard.innerHTML = `<div style="font-size:12px; color:var(--text-mute); margin-bottom:6px;">Estimated revenue impact of training vs rest-of-network trend</div>
      <div style="font-size:28px; font-weight:700; color:${impactColor};" class="bsc-mono">${impactRev>=0?'+':''}${fmtINR(impactRev)}</div>
      <div style="font-size:11.5px; color:var(--text-mute); margin-top:8px; line-height:1.6;">
        Rest of network moved ${restGrowthPct>=0?'+':''}${restGrowthPct.toFixed(1)}% vs ${baseFullLbl}. If training had followed that same trend, its AOV would have been ${fmtINR(counterfactualAov)} instead of its actual ${fmtINR(mTraining.aov)}.
        Applied to ${combinedTotals.training.bills.toLocaleString('en-IN')} training-cohort bills ${periodLabel}, that gap is worth the figure above \u2014
        this isolates the training-specific effect from whatever the whole business experienced over that period, but is a correlation, not proof of causation.
      </div>`;
    body.appendChild(impactCard);
  }

  // ---- Per-stylist "% individually improved" -- matches the same stat on the Stylist
  // Weekly Tracker exactly: each training-cohort stylist's own AOV/ASP/UPT, baseline vs this period.
  const stylistMtd = {}; // name (lowercase) -> {rev,bills,units}
  // STORE_SPECIFIC_STYLISTS is declared at the top of this function and reused here.
  days.forEach(dk => {
    const revs = state.stylistRevDays[dk] || {};
    const bills = state.stylistBillDays[dk] || {};
    const units = state.stylistUnitDays[dk] || {};
    const storeRevD = state.stylistStoreRevDays[dk] || {};
    const storeBillsD = state.stylistStoreBillsDays[dk] || {};
    const storeUnitsD = state.stylistStoreUnitsDays[dk] || {};
    Object.keys(revs).forEach(st => {
      const norm = st.trim().toLowerCase();
      if(!TRAINING_COHORT.includes(norm)) return;
      stylistMtd[norm] = stylistMtd[norm] || {rev:0, bills:0, units:0};
      if(STORE_SPECIFIC_STYLISTS[norm]){
        const targetStore = STORE_SPECIFIC_STYLISTS[norm];
        const rec = storeRevD[st] ? storeRevD[st][targetStore] : null;
        if(rec){
          stylistMtd[norm].rev += rec || 0;
          stylistMtd[norm].bills += (storeBillsD[st] && storeBillsD[st][targetStore]) || 0;
          stylistMtd[norm].units += (storeUnitsD[st] && storeUnitsD[st][targetStore]) || 0;
        }
      } else {
        stylistMtd[norm].rev += revs[st] || 0;
        stylistMtd[norm].bills += bills[st] || 0;
        stylistMtd[norm].units += units[st] || 0;
      }
    });
  });

  const indivHead = document.createElement('div');
  indivHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  indivHead.textContent = 'Individually improved vs ' + baseFullLbl + ' \u2014 training cohort only';
  body.appendChild(indivHead);

  const indivGrid = document.createElement('div');
  indivGrid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:24px;';
  ['aov','asp','upt'].forEach(metric => {
    let up = 0, down = 0;
    Object.keys(STYLIST_DETAIL).forEach(name => {
      const base = STYLIST_DETAIL[name][metric];
      const t = stylistMtd[name];
      if(!base || !t) return;
      let val;
      if(metric === 'aov') val = t.bills ? t.rev/t.bills : null;
      else if(metric === 'asp') val = t.units ? t.rev/t.units : null;
      else val = t.bills ? t.units/t.bills : null;
      if(val === null) return;
      if(val >= base) up++; else down++;
    });
    const total = up + down;
    const pct = total ? Math.round(up/total*100) : 0;
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--panel); border-radius:10px; padding:14px 16px;';
    card.innerHTML = `<div style="font-size:11px; color:var(--text-mute); margin-bottom:6px;">${metric.toUpperCase()} \u2014 individually up vs ${baseFullLbl}</div>
      <div style="font-size:20px; font-weight:600; color:var(--text);" class="bsc-mono">${pct}%</div>
      <div style="font-size:11px; color:var(--text-mute); margin-top:4px;">${up} of ${total} stylists</div>`;
    indivGrid.appendChild(card);
  });
  body.appendChild(indivGrid);

  // ---- Daily AOV trend, both cohorts ----
  const trendHead = document.createElement('div');
  trendHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  trendHead.textContent = 'Daily AOV trend \u2014 ' + cfg.cohortLabel.toLowerCase() + ' vs rest of network';
  body.appendChild(trendHead);

  const dailyAovTraining = days.map(dk => {
    const t = cohortDaily[dk].training;
    return t.bills ? t.rev/t.bills : null;
  });
  const dailyAovRest = days.map(dk => {
    const t = cohortDaily[dk].rest;
    return t.bills ? t.rev/t.bills : null;
  });

  const canvasWrap = document.createElement('div');
  canvasWrap.style.cssText = 'position:relative; height:260px; margin-bottom:8px;';
  canvasWrap.innerHTML = `<canvas id="bsc-cohort-trend-chart" role="img" aria-label="Daily AOV trend, training cohort vs rest of network"></canvas>`;
  body.appendChild(canvasWrap);

  requestAnimationFrame(() => {
    const ctx = document.getElementById('bsc-cohort-trend-chart');
    if(!ctx || !window.Chart) return;
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: days.map(dayLabel),
        datasets: [
          {label:'Training cohort', data: dailyAovTraining.map(v=>v===null?null:Math.round(v)), borderColor:'#c9a15b', backgroundColor:'rgba(201,161,91,0.1)', pointRadius:3, tension:0.15, spanGaps:true},
          {label:'Rest of network', data: dailyAovRest.map(v=>v===null?null:Math.round(v)), borderColor:'#9a9da5', backgroundColor:'rgba(154,157,165,0.08)', pointRadius:3, tension:0.15, spanGaps:true},
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        scales: {
          x: {ticks:{color:'#9a9da5', maxRotation:45, autoSkip:false}, grid:{display:false}},
          y: {ticks:{color:'#9a9da5', callback:(v)=>fmtINR(v)}, grid:{color:'#2c313a'}}
        },
        plugins: { legend: { display:true, labels:{color:'#e9e6df', font:{size:11}} } }
      }
    });
  });

  const legendSpacer = document.createElement('div');
  legendSpacer.style.cssText = 'margin-bottom:20px;';
  body.appendChild(legendSpacer);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:6px; line-height:1.6;';
  note.textContent = cfg.cohortLabel + ' is the same ' + TRAINING_COHORT.length + '-stylist roster tracked in the separate Stylist Weekly Tracker. ' +
    'This view recalculates from whatever date range you\u2019ve selected above, so it updates automatically as new sales data is added \u2014 no separate upload needed. ' +
    baseFullLbl + ' baseline % shows growth for each cohort since the month the training program\u2019s comparison point was set.';
  body.appendChild(note);
}

function renderSMCohort(body, days){
  const cmk = currentMonthKey();
  const curLbl = cmk.split('-')[0], prevLbl = prevMonthInfo().short; // AOV columns: live month vs the month before

  // Per-store live-month figures (the sep*/aug* names below date from when this tab was Sep vs Aug:
  // for AOV they now mean live month / previous month; for NPS and audit they are still Sep / Aug).
  const sepRev = {}, sepBills = {};
  SM_COHORT_STORES.forEach(s => { sepRev[s] = 0; sepBills[s] = 0; });
  days.forEach(dk => {
    const revs = state.days[dk] || {};
    const bills = state.billDays[dk] || {};
    SM_COHORT_STORES.forEach(s => {
      sepRev[s] += revs[s] || 0;
      sepBills[s] += bills[s] || 0;
    });
  });

  const rows = SM_COHORT_STORES.map(store => {
    const sepAov = sepBills[store] ? sepRev[store]/sepBills[store] : null;
    const augAov = BASELINE.prevMonthStoreAOV && BASELINE.prevMonthStoreAOV[store] ? BASELINE.prevMonthStoreAOV[store].aov : null;
    const aovDelta = (sepAov !== null && augAov) ? (sepAov-augAov)/augAov*100 : null;
    const npsSep = SEP_NPS_BYSTORE[store];
    const npsAug = AUG_NPS_BYSTORE[store];
    const npsDelta = (npsSep !== null && npsSep !== undefined && npsAug !== null && npsAug !== undefined) ? (npsSep-npsAug) : null;
    const auditSep = SEP_AUDIT_BYSTORE[store], auditAug = AUG_AUDIT_BYSTORE[store];
    const auditDelta = (auditSep !== null && auditSep !== undefined && auditAug !== null && auditAug !== undefined) ? (auditSep-auditAug) : null;
    return {
      store, region: STORE_LOOKUP[store] ? STORE_LOOKUP[store].region : '-',
      sepRev: sepRev[store], sepBills: sepBills[store], sepAov, augAov, aovDelta,
      npsSep, npsAug, npsDelta, auditSep, auditAug, auditDelta,
    };
  });

  const head = document.createElement('div');
  head.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  head.textContent = 'SM Cohort (' + SM_COHORT_STORES.length + ' stores) — ' + cmk;
  body.appendChild(head);

  // ---- Cohort rollup ----
  const totalSepRev = rows.reduce((a,r) => a+r.sepRev, 0);
  const totalSepBills = rows.reduce((a,r) => a+r.sepBills, 0);
  const pooledSepAov = totalSepBills ? totalSepRev/totalSepBills : 0;
  function avg(vals){
    const v = vals.filter(x => x !== null && x !== undefined);
    return v.length ? v.reduce((a,b) => a+b, 0)/v.length : null;
  }
  // August AOV is a simple average of each store's AOV, not a revenue-weighted pool like September --
  // per-store August bill counts aren't retained on this dashboard, so true pooling isn't possible for it.
  const avgAugAov = avg(rows.map(r => r.augAov));
  const pooledAovDelta = avgAugAov ? (pooledSepAov-avgAugAov)/avgAugAov*100 : null;
  const avgNpsAug = avg(rows.map(r => r.npsAug));
  const avgNpsSep = avg(rows.map(r => r.npsSep));
  const npsDelta = (avgNpsAug !== null && avgNpsSep !== null) ? (avgNpsSep-avgNpsAug) : null;
  const avgAuditAug = avg(rows.map(r => r.auditAug));
  const avgAuditSep = avg(rows.map(r => r.auditSep));
  const auditDelta = (avgAuditAug !== null && avgAuditSep !== null) ? (avgAuditSep-avgAuditAug) : null;

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-bottom:10px;';
  grid.innerHTML = `
    <div style="background:var(--panel); border-radius:10px; padding:16px; border-left:3px solid var(--brass);">
      <div style="font-size:11px; color:var(--text-mute); margin-bottom:6px;">Cohort AOV — ${cmk}</div>
      <div style="font-size:22px; font-weight:700; color:${pooledAovDelta===null?'var(--text)':(pooledAovDelta>=0?'var(--good)':'var(--bad)')};" class="bsc-mono">${fmtINR(pooledSepAov)}</div>
      <div style="font-size:11.5px; color:var(--text-mute); margin-top:6px;">vs ${prevLbl} avg ${avgAugAov ? fmtINR(avgAugAov) : '—'}</div>
    </div>
    <div style="background:var(--panel); border-radius:10px; padding:16px; border-left:3px solid var(--brass);">
      <div style="font-size:11px; color:var(--text-mute); margin-bottom:6px;">Cohort NPS — Sep, avg across stores</div>
      <div style="font-size:22px; font-weight:700; color:${npsDelta===null?'var(--text)':(npsDelta>=0?'var(--good)':'var(--bad)')};" class="bsc-mono">${avgNpsSep!==null ? avgNpsSep.toFixed(1) : '—'}</div>
      <div style="font-size:11.5px; color:var(--text-mute); margin-top:6px;">vs Aug avg ${avgNpsAug!==null ? avgNpsAug.toFixed(1) : '—'}</div>
    </div>
    <div style="background:var(--panel); border-radius:10px; padding:16px; border-left:3px solid var(--brass);">
      <div style="font-size:11px; color:var(--text-mute); margin-bottom:6px;">Cohort Audit Score — Sep W1, avg across stores</div>
      <div style="font-size:22px; font-weight:700; color:${auditDelta===null?'var(--text)':(auditDelta>=0?'var(--good)':'var(--bad)')};" class="bsc-mono">${avgAuditSep!==null ? avgAuditSep.toFixed(1)+'%' : '—'}</div>
      <div style="font-size:11.5px; color:var(--text-mute); margin-top:6px;">vs Aug avg ${avgAuditAug!==null ? avgAuditAug.toFixed(1)+'%' : '—'}</div>
    </div>
  `;
  body.appendChild(grid);

  const rollupNote = document.createElement('div');
  rollupNote.style.cssText = 'font-size:11px; color:var(--text-mute); margin-bottom:24px; line-height:1.6;';
  rollupNote.textContent = 'Cohort AOV is pooled (sum revenue ÷ sum bills) for ' + curLbl + ', live from whatever date range is selected above; ' + prevLbl + ' is a simple average of each store’s AOV, since per-store bill counts for a closed month aren’t retained on this dashboard for a true revenue-weighted pool. NPS and Audit Score still compare September with August — no ' + curLbl + ' survey or audit data has been loaded yet. They are simple averages across the cohort’s stores in each month — a store with no data that period is excluded from the average rather than counted as zero.';
  body.appendChild(rollupNote);

  // ---- Per-store table ----
  const tableHead = document.createElement('div');
  tableHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  tableHead.textContent = 'By store';
  body.appendChild(tableHead);

  const table = document.createElement('table');
  table.style.cssText = 'font-size:13px;';
  function dash(v, decimals, suffix){
    if(v === null || v === undefined) return '<td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">—</td>';
    return `<td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${v.toFixed(decimals)}${suffix||''}</td>`;
  }
  // Sep cell colored by its own delta vs Aug -- no separate Δ column, the color on the number is the signal.
  function dashColoredBySep(v, delta, decimals, suffix){
    if(v === null || v === undefined) return '<td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">—</td>';
    const color = delta === null ? 'var(--text)' : (delta >= 0 ? 'var(--good)' : 'var(--bad)');
    return `<td style="padding:8px 10px; text-align:right; color:${color}; font-weight:600;" class="bsc-mono">${v.toFixed(decimals)}${suffix||''}</td>`;
  }
  let tRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">Store</td><td style="padding:6px 10px;">Region</td>' +
    '<td style="padding:6px 10px; text-align:right;">NPS Aug</td><td style="padding:6px 10px; text-align:right;">NPS Sep</td>' +
    '<td style="padding:6px 10px; text-align:right;">Audit Aug</td><td style="padding:6px 10px; text-align:right;">Audit Sep</td>' +
    '<td style="padding:6px 10px; text-align:right;">AOV ' + prevLbl + '</td><td style="padding:6px 10px; text-align:right;">AOV ' + curLbl + '</td></tr>';
  rows.forEach(r => {
    const aovSepColor = r.sepAov === null ? 'var(--text-mute)' : (r.aovDelta===null?'var(--brass)':(r.aovDelta>=0?'var(--good)':'var(--bad)'));
    tRows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; font-weight:500;">${r.store}</td>
      <td style="padding:8px 10px; color:var(--text-mute);">${r.region}</td>
      ${dash(r.npsAug, 1)}
      ${dashColoredBySep(r.npsSep, r.npsDelta, 1)}
      ${dash(r.auditAug, 1, '%')}
      ${dashColoredBySep(r.auditSep, r.auditDelta, 1, '%')}
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${r.augAov ? fmtINR(r.augAov) : '—'}</td>
      <td style="padding:8px 10px; text-align:right; color:${aovSepColor}; font-weight:600;" class="bsc-mono">${r.sepAov !== null ? fmtINR(r.sepAov) : '—'}</td>
    </tr>`;
  });
  table.innerHTML = tRows;
  body.appendChild(table);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:16px; line-height:1.6;';
  note.textContent = 'AOV ' + curLbl + ' recalculates from whatever date range you’ve selected above, so it updates automatically as new sales data is added. Audit Sep is the "Sep W1" column from the Compliance Score Sheet — the latest audit on file, not a full-month figure like Audit Aug, so that comparison is more directional than the AOV/NPS ones. NPS Sep and Audit Sep are colored green where the store improved vs August, red where it declined; AOV ' + curLbl + ' is colored against ' + prevLbl + '.';
  body.appendChild(note);
}

function renderStylists(body, days){
  // Build full per-(stylist, store) breakdown, not just each stylist's single "home" store --
  // this is what lets store/region filters correctly include a stylist's partial contribution
  // to a store even when it isn't their main base.
  const stylistStoreBreakdown = {}; // stylist -> store -> {rev, bills, units}
  days.forEach(dk => {
    const storeRev = state.stylistStoreRevDays[dk] || {};
    const storeBills = state.stylistStoreBillsDays[dk] || {};
    const storeUnits = state.stylistStoreUnitsDays[dk] || {};
    Object.keys(storeRev).forEach(st => {
      stylistStoreBreakdown[st] = stylistStoreBreakdown[st] || {};
      Object.keys(storeRev[st]).forEach(store => {
        stylistStoreBreakdown[st][store] = stylistStoreBreakdown[st][store] || {rev:0, bills:0, units:0};
        stylistStoreBreakdown[st][store].rev += storeRev[st][store] || 0;
        stylistStoreBreakdown[st][store].bills += (storeBills[st] && storeBills[st][store]) || 0;
        stylistStoreBreakdown[st][store].units += (storeUnits[st] && storeUnits[st][store]) || 0;
      });
    });
  });

  function homeStoreFor(stylist){
    const stores = stylistStoreBreakdown[stylist];
    if(!stores) return '\u2014';
    let best = null, bestRev = -1;
    Object.keys(stores).forEach(store => { if(stores[store].rev > bestRev){ bestRev = stores[store].rev; best = store; } });
    return best || '\u2014';
  }

  const cmk = currentMonthKey();
  const allStylists = Object.keys(stylistStoreBreakdown);

  if(allStylists.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:30px 14px; text-align:center; color:var(--text-mute); font-size:13px;';
    empty.textContent = 'No stylist data found in your uploaded CSV(s) \u2014 make sure the file has an \u201cAssisting staff member name\u201d column populated.';
    body.appendChild(empty);
    return;
  }

  // ---- Store / Region filters ----
  const allStoresWithStylists = Array.from(new Set(allStylists.flatMap(st => Object.keys(stylistStoreBreakdown[st])))).filter(s => offlineRegion(s)).sort();
  const allRegionsWithStylists = ['North','South','West'].filter(reg => allStoresWithStylists.some(s => offlineRegion(s) === reg));

  const filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center;';
  filterBar.innerHTML = `
    <span style="font-size:11.5px; color:var(--text-mute);">Filter:</span>
    <select id="bsc-stylist-region-filter" style="background:var(--panel); border:0.5px solid var(--line2); color:var(--text); font-size:12px; padding:6px 10px; border-radius:6px; font-family:inherit;">
      <option value="all"${state.stylistFilterRegion==='all'?' selected':''}>All regions</option>
      ${allRegionsWithStylists.map(reg => `<option value="${reg}"${state.stylistFilterRegion===reg?' selected':''}>${reg}</option>`).join('')}
    </select>
    <select id="bsc-stylist-store-filter" style="background:var(--panel); border:0.5px solid var(--line2); color:var(--text); font-size:12px; padding:6px 10px; border-radius:6px; font-family:inherit; max-width:220px;">
      <option value="all"${state.stylistFilterStore==='all'?' selected':''}>All stores</option>
      ${allStoresWithStylists.map(s => `<option value="${s}"${state.stylistFilterStore===s?' selected':''}>${s}</option>`).join('')}
    </select>
  `;
  body.appendChild(filterBar);

  // Build the row set based on the active filter. Unfiltered: each stylist's TOTAL across all
  // stores, labeled with their home (highest-revenue) store. Store filter: only that store's
  // slice of each stylist's numbers -- includes every stylist with ANY activity there, not just
  // those whose home store matches. Region filter: summed across that region's stores only.
  let stArr = [];
  if(state.stylistFilterStore !== 'all'){
    const targetStore = state.stylistFilterStore;
    allStylists.forEach(st => {
      const rec = stylistStoreBreakdown[st][targetStore];
      if(rec && (rec.rev > 0 || rec.bills > 0)){
        stArr.push({ stylist: st, store: targetStore, region: offlineRegion(targetStore) || '\u2014',
          rev: rec.rev, bills: rec.bills, units: rec.units,
          aov: rec.bills ? rec.rev/rec.bills : 0, upt: rec.bills ? rec.units/rec.bills : 0 });
      }
    });
  } else if(state.stylistFilterRegion !== 'all'){
    const targetRegion = state.stylistFilterRegion;
    allStylists.forEach(st => {
      let rev=0, bills=0, units=0;
      Object.keys(stylistStoreBreakdown[st]).forEach(store => {
        if(offlineRegion(store) === targetRegion){
          rev += stylistStoreBreakdown[st][store].rev;
          bills += stylistStoreBreakdown[st][store].bills;
          units += stylistStoreBreakdown[st][store].units;
        }
      });
      if(rev > 0 || bills > 0){
        stArr.push({ stylist: st, store: homeStoreFor(st), region: targetRegion,
          rev, bills, units, aov: bills ? rev/bills : 0, upt: bills ? units/bills : 0 });
      }
    });
  } else {
    allStylists.forEach(st => {
      let rev=0, bills=0, units=0;
      Object.keys(stylistStoreBreakdown[st]).forEach(store => {
        rev += stylistStoreBreakdown[st][store].rev;
        bills += stylistStoreBreakdown[st][store].bills;
        units += stylistStoreBreakdown[st][store].units;
      });
      const home = homeStoreFor(st);
      stArr.push({ stylist: st, store: home, region: offlineRegion(home) || '\u2014',
        rev, bills, units, aov: bills ? rev/bills : 0, upt: bills ? units/bills : 0 });
    });
  }
  stArr = stArr.sort((a,b) => b.rev - a.rev);

  if(stArr.length === 0){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:30px 14px; text-align:center; color:var(--text-mute); font-size:13px;';
    empty.textContent = 'No stylists match this filter.';
    body.appendChild(empty);
    attachStylistFilterHandlers();
    return;
  }

  const totalRev = stArr.reduce((s,r)=>s+r.rev,0);

  // ---- Call-outs: notable performers, not just the raw list ----
  const MIN_BILLS_FOR_RATE_CALLOUTS = 3; // avoid a 1-bill stylist "winning" AOV by fluke
  const eligibleForRate = stArr.filter(r => r.bills >= MIN_BILLS_FOR_RATE_CALLOUTS);

  const byRevenue = stArr[0];
  const byBills = [...stArr].sort((a,b) => b.bills - a.bills)[0];
  const byAov = eligibleForRate.length ? [...eligibleForRate].sort((a,b) => b.aov - a.aov)[0] : null;

  const calloutHead = document.createElement('div');
  calloutHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  calloutHead.textContent = 'Call-outs \u2014 ' + cmk;
  body.appendChild(calloutHead);

  const calloutGrid = document.createElement('div');
  calloutGrid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:24px;';
  const callouts = [
    {label:'Top revenue', name: byRevenue.stylist, store: byRevenue.store, val: fmtINR(byRevenue.rev), sub: byRevenue.bills + ' bills \u00b7 AOV ' + fmtINR(byRevenue.aov), color:'var(--good)'},
    {label:'Busiest (most bills)', name: byBills.stylist, store: byBills.store, val: byBills.bills + ' bills', sub: fmtINR(byBills.rev) + ' revenue', color:'var(--brass)'},
    byAov ? {label:'Highest AOV (' + MIN_BILLS_FOR_RATE_CALLOUTS + '+ bills)', name: byAov.stylist, store: byAov.store, val: fmtINR(byAov.aov), sub: byAov.bills + ' bills', color:'var(--good)'} : null,
  ].filter(Boolean);
  callouts.forEach(c => {
    const card = document.createElement('div');
    card.style.cssText = `background:var(--panel); border-radius:10px; padding:14px 16px; border-left:3px solid ${c.color};`;
    card.innerHTML = `<div style="font-size:11.5px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
      <div style="font-size:14px; font-weight:600; color:var(--text); margin-bottom:2px;">${c.name}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-bottom:6px;">${c.store}</div>
      <div style="font-size:18px; font-weight:600; color:${c.color};" class="bsc-mono">${c.val}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-top:4px;">${c.sub}</div>`;
    calloutGrid.appendChild(card);
  });
  body.appendChild(calloutGrid);

  const cardsRow = document.createElement('div');
  cardsRow.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;';
  const cards = [
    {label:'Stylists shown (' + cmk + ')', val: String(stArr.length)},
    {label:'Total attributed revenue', val: fmtINR(totalRev)},
    {label:'Avg revenue / stylist', val: fmtINR(totalRev/stArr.length)},
    {label:'Avg bills / stylist', val: (stArr.reduce((s,r)=>s+r.bills,0)/stArr.length).toFixed(1)},
  ];
  cards.forEach(c => {
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--panel); border-radius:10px; padding:14px 16px;';
    card.innerHTML = `<div style="font-size:12px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
      <div style="font-size:20px; font-weight:600; color:var(--text);" class="bsc-mono">${c.val}</div>`;
    cardsRow.appendChild(card);
  });
  body.appendChild(cardsRow);

  const head = document.createElement('div');
  head.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  head.textContent = 'MTD stylist-wise performance \u2014 ' + cmk +
    (state.stylistFilterStore !== 'all' ? ' \u2014 ' + state.stylistFilterStore + ' only' :
     state.stylistFilterRegion !== 'all' ? ' \u2014 ' + state.stylistFilterRegion + ' only' : '');
  body.appendChild(head);

  const table = document.createElement('table');
  table.style.cssText = 'font-size:13px;';
  let rows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">#</td><td style="padding:6px 10px;">Stylist</td><td style="padding:6px 10px;">Store</td><td style="padding:6px 10px;">Region</td>' +
    '<td style="padding:6px 10px; text-align:right;">Revenue</td><td style="padding:6px 10px; text-align:right;">% of total</td>' +
    '<td style="padding:6px 10px; text-align:right;">Bills</td><td style="padding:6px 10px; text-align:right;">AOV</td><td style="padding:6px 10px; text-align:right;">UPT</td></tr>';
  stArr.forEach((r,i) => {
    rows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; color:var(--text-mute);" class="bsc-mono">${i+1}</td>
      <td style="padding:8px 10px; font-weight:500;">${r.stylist}</td>
      <td style="padding:8px 10px; color:var(--text-mute);">${r.store}</td>
      <td style="padding:8px 10px; color:var(--text-mute);">${r.region}</td>
      <td style="padding:8px 10px; text-align:right; color:var(--brass); font-weight:600;" class="bsc-mono">${fmtINR(r.rev)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtPct(totalRev?r.rev/totalRev*100:0)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${r.bills}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(r.aov)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${r.upt.toFixed(2)}</td>
    </tr>`;
  });
  table.innerHTML = rows;
  body.appendChild(table);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:14px; line-height:1.6;';
  note.textContent = 'Attributed from the \u201cAssisting staff member name\u201d column in your sales CSV. With no filter, \u201cStore\u201d shows wherever each stylist generated the most revenue, but their total spans all stores they worked at. ' +
    'Filtering by store or region shows only that slice of each stylist\u2019s numbers, and includes every stylist with any activity there \u2014 not just those based there. UPT = units \u00f7 bills. ' +
    'Orders with no stylist recorded (e.g. most online orders) are excluded here, so totals will be lower than store-wide MTD revenue.';
  body.appendChild(note);

  attachStylistFilterHandlers();
}

function attachStylistFilterHandlers(){
  const regionSel = document.getElementById('bsc-stylist-region-filter');
  if(regionSel) regionSel.addEventListener('change', (e) => {
    state.stylistFilterRegion = e.target.value;
    state.stylistFilterStore = 'all'; // reset store filter when region changes, to avoid an impossible combo
    render();
  });
  const storeSel = document.getElementById('bsc-stylist-store-filter');
  if(storeSel) storeSel.addEventListener('change', (e) => {
    state.stylistFilterStore = e.target.value;
    render();
  });
}

function renderCategoryAOV(body, days){
  // Category revenue and units, aggregated across all uploaded days
  const catTotals = {};
  const catUnits = {};
  days.forEach(dk => {
    const cats = state.catDays[dk] || {};
    const units = state.catUnitDays[dk] || {};
    Object.keys(cats).forEach(c => { catTotals[c] = (catTotals[c] || 0) + cats[c]; });
    Object.keys(units).forEach(c => { catUnits[c] = (catUnits[c] || 0) + units[c]; });
  });
  const catArr = Object.keys(catTotals).map(c => ({cat:c, rev:catTotals[c], units: catUnits[c]||0})).sort((a,b)=>b.rev-a.rev);
  const catTotal = catArr.reduce((s,c)=>s+c.rev,0);

  // Last month (August 2026) category mix, for the % of sales comparison
  const lastMonthCat = BASELINE.prevMonthCategory || {};
  const lastMonthTotal = Object.values(lastMonthCat).reduce((s,v)=>s+v,0);

  // Exact MTD-vs-MTD units comparison: match each selected day to the SAME day-of-month
  // in August 2026 (e.g. Sep 3 vs Aug 3), rather than pro-rating a full-month total. Falls
  // back gracefully for any day-of-month August doesn't have data for (only 1-30 exist).
  const julyDailyCatUnits = BASELINE.prevMonthDailyCategoryUnits || {};
  const matchedJulyCatUnits = {};
  let matchedDayCount = 0;
  days.forEach(dk => {
    const dayNum = new Date(dk + 'T00:00:00').getDate();
    const julyDay = julyDailyCatUnits[dayNum] || julyDailyCatUnits[String(dayNum)];
    if(julyDay){
      matchedDayCount++;
      Object.keys(julyDay).forEach(c => { matchedJulyCatUnits[c] = (matchedJulyCatUnits[c] || 0) + julyDay[c]; });
    }
  });

  const catHead = document.createElement('div');
  catHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
  catHead.textContent = 'Category-wise sales vs last month (' + prevMonthInfo().full + ') \u2014 all uploaded days combined';
  body.appendChild(catHead);

  const catTable = document.createElement('table');
  catTable.style.cssText = 'font-size:13px;';
  let catRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
    '<td style="padding:6px 10px;">Category</td><td style="padding:6px 10px; text-align:right;">Revenue</td>' +
    '<td style="padding:6px 10px; text-align:right;">Units</td><td style="padding:6px 10px; text-align:right;">Units vs ' + prevMonthInfo().short + ' (MTD)</td>' +
    '<td style="padding:6px 10px; text-align:right;">% of sales</td><td style="padding:6px 10px; text-align:right;">' + prevMonthInfo().short + ' % of sales</td>' +
    '<td style="padding:6px 10px; text-align:right;">Change (pp)</td></tr>';
  catArr.forEach(c => {
    const pctNow = catTotal ? c.rev/catTotal*100 : 0;
    const pctLast = lastMonthTotal ? (lastMonthCat[c.cat]||0)/lastMonthTotal*100 : null;
    const delta = (pctLast !== null) ? pctNow - pctLast : null;
    const julyUnitsMatched = matchedDayCount > 0 ? (matchedJulyCatUnits[c.cat] || 0) : null;
    const unitsGrowth = (julyUnitsMatched !== null && julyUnitsMatched > 0) ? (c.units - julyUnitsMatched) / julyUnitsMatched * 100 : null;
    catRows += `<tr style="border-top:1px solid var(--line);">
      <td style="padding:8px 10px; font-weight:500;">${c.cat}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(c.rev)}</td>
      <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${Math.round(c.units).toLocaleString('en-IN')}</td>
      <td style="padding:8px 10px; text-align:right; color:${unitsGrowth===null?'var(--text-mute)':(unitsGrowth>=0?'var(--good)':'var(--bad)')}; font-weight:600;" class="bsc-mono">${unitsGrowth!==null?((unitsGrowth>=0?'+':'')+unitsGrowth.toFixed(1)+'%'):'\u2014'}</td>
      <td style="padding:8px 10px; text-align:right; color:var(--brass);" class="bsc-mono">${fmtPct(pctNow)}</td>
      <td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">${pctLast!==null?fmtPct(pctLast):'\u2014'}</td>
      <td style="padding:8px 10px; text-align:right; color:${delta===null?'var(--text-mute)':(delta>=0?'var(--good)':'var(--bad)')}; font-weight:600;" class="bsc-mono">${delta!==null?((delta>=0?'+':'')+delta.toFixed(1)+'pp'):'\u2014'}</td>
    </tr>`;
  });
  catTable.innerHTML = catRows;
  body.appendChild(catTable);

  const note = document.createElement('div');
  note.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-top:14px; line-height:1.6;';
  note.textContent = 'MTM vs RTW Shirt: SKUs with a dash (e.g. BOM-SHI-33034) are RTW; SKUs without one (e.g. BOMSH04CM00256) are MTM. ' +
    '"Units vs ' + prevMonthInfo().short + ' (MTD)" matches each of your ' + days.length + ' selected day(s) to the SAME day-of-month in ' + prevMonthInfo().full + ' (' + matchedDayCount + ' day(s) matched) \u2014 a real MTD-vs-MTD comparison, not a pro-rated estimate. ' +
    'The ' + prevMonthInfo().short + ' % of sales column is a fixed baseline from ' + prevMonthInfo().full + '\u2019s full month \u2014 ' +
    'a rising % here means that category is taking a bigger share of the mix than it did last month, not necessarily that its revenue is up in absolute terms. ' +
    'AOV and UPT by store live on the Store-wise tab.';
  body.appendChild(note);
}

function renderRefunds(body){
  const cmk = currentMonthKey();

  const rangeNote = document.createElement('div');
  rangeNote.style.cssText = 'font-size:11.5px; color:var(--text-mute); margin-bottom:16px;';
  rangeNote.textContent = 'This tab shows the month picked at the top (' + cmk + ') and doesn\u2019t follow the date range picker above \u2014 refund/CN data is only tracked at month-level, not day-by-day.';
  body.appendChild(rangeNote);

  
  const refundMonth = state.refundsData && state.refundsData.byMonth ? state.refundsData.byMonth[cmk] : null;
  const cnMonth = state.cnData && state.cnData.byMonth ? state.cnData.byMonth[cmk] : null;

  if(!refundMonth && !cnMonth){
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:30px 14px; text-align:center; color:var(--text-mute); font-size:13px;';
    empty.textContent = isArchiveView()
      ? 'No refund or credit note file on record for ' + cmk + ' (only Jul-2026 onwards are archived in the standard format).'
      : 'No refund or credit note data uploaded for ' + cmk + ' yet.';
    body.appendChild(empty);
    attachRefundHandlers();
    return;
  }

  // ---- Revenue for this month, from uploaded sales CSVs ----
  const days = getSortedDays().filter(dk => {
    const d = new Date(dk + 'T00:00:00');
    return currentMonthKeyForDate(d) === cmk;
  });
  let onlineRev = 0, offlineRev = 0;
  const regionRev = {North:0, South:0, West:0};
  const storeRev = {};
  const storeBills = {};
  days.forEach(dk => {
    const revs = state.days[dk] || {};
    const bills = state.billDays[dk] || {};
    Object.keys(revs).forEach(store => {
      const reg = offlineRegion(store);
      storeRev[store] = (storeRev[store] || 0) + revs[store];
      storeBills[store] = (storeBills[store] || 0) + (bills[store] || 0);
      if(reg){ offlineRev += revs[store]; regionRev[reg] += revs[store]; }
      else { onlineRev += revs[store]; }
    });
  });
  const totalRev = onlineRev + offlineRev;
  const hasRevenue = totalRev > 0;

  if(!hasRevenue){
    const warn = document.createElement('div');
    warn.style.cssText = 'font-size:12px; color:var(--warn); margin-bottom:16px; padding:10px 14px; background:var(--panel); border-radius:8px;';
    warn.textContent = 'No sales CSV uploaded for ' + cmk + ' yet \u2014 upload one on the Overview tab to see refund/CN as a % of revenue. Showing raw amounts only for now.';
    body.appendChild(warn);
  }

  const refundTotal = refundMonth ? refundMonth.total : 0;
  const cnTotal = cnMonth ? cnMonth.total : 0;

  const cardsRow = document.createElement('div');
  cardsRow.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px;';
  const cards = [
    {label:'Total refunds (' + cmk + ')', val: fmtINR(refundTotal), sub: refundMonth ? (refundMonth.lineItems + ' line items, ' + refundMonth.orders + ' orders') : 'No data'},
    {label:'Total credit notes (' + cmk + ')', val: fmtINR(cnTotal), sub: cnMonth ? (cnMonth.lineItems + ' line items, ' + cnMonth.orders + ' orders') : 'No data'},
    {label:'Refund + CN combined', val: fmtINR(refundTotal+cnTotal), sub: hasRevenue ? fmtPct((refundTotal+cnTotal)/totalRev*100) + ' of total revenue' : 'Upload sales CSV for %'},
    {label:'Refund % of revenue', val: hasRevenue ? fmtPct(refundTotal/totalRev*100) : '\u2014', sub: hasRevenue ? fmtINR(totalRev) + ' revenue' : 'Upload sales CSV'},
    {label:'CN % of revenue', val: hasRevenue ? fmtPct(cnTotal/totalRev*100) : '\u2014', sub: hasRevenue ? 'vs same revenue base' : 'Upload sales CSV'},
  ];
  cards.forEach(c => {
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--panel); border-radius:10px; padding:14px 16px;';
    card.innerHTML = `<div style="font-size:12px; color:var(--text-mute); margin-bottom:6px;">${c.label}</div>
      <div style="font-size:20px; font-weight:600; color:var(--text);" class="bsc-mono">${c.val}</div>
      <div style="font-size:11px; color:var(--text-mute); margin-top:4px;">${c.sub}</div>`;
    cardsRow.appendChild(card);
  });
  body.appendChild(cardsRow);

  // ---- Online vs Offline ----
  if(hasRevenue){
    const channelHead = document.createElement('div');
    channelHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    channelHead.textContent = 'Online vs offline \u2014 ' + cmk;
    body.appendChild(channelHead);

    const chTable = document.createElement('table');
    chTable.style.cssText = 'font-size:13px; margin-bottom:24px;';
    const onlineRefund = refundMonth ? refundMonth.onlineTotal : 0;
    const storeRefund = refundMonth ? refundMonth.storeTotal : 0;
    const onlineCN = cnMonth ? cnMonth.onlineTotal : 0;
    const storeCN = cnMonth ? cnMonth.storeTotal : 0;
    chTable.innerHTML = `<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">
        <td style="padding:6px 10px;">Channel</td><td style="padding:6px 10px; text-align:right;">Revenue</td>
        <td style="padding:6px 10px; text-align:right;">Refund %</td><td style="padding:6px 10px; text-align:right;">CN %</td><td style="padding:6px 10px; text-align:right;">Total %</td></tr>
      <tr style="border-top:1px solid var(--line);"><td style="padding:8px 10px; font-weight:500;">Online</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(onlineRev)}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${onlineRev?fmtPct(onlineRefund/onlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${onlineRev?fmtPct(onlineCN/onlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600; color:var(--brass);" class="bsc-mono">${onlineRev?fmtPct((onlineRefund+onlineCN)/onlineRev*100):'\u2014'}</td></tr>
      <tr style="border-top:1px solid var(--line);"><td style="padding:8px 10px; font-weight:500;">Offline</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(offlineRev)}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${offlineRev?fmtPct(storeRefund/offlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600;" class="bsc-mono">${offlineRev?fmtPct(storeCN/offlineRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:600; color:var(--brass);" class="bsc-mono">${offlineRev?fmtPct((storeRefund+storeCN)/offlineRev*100):'\u2014'}</td></tr>
      <tr style="border-top:1.5px solid var(--line2);"><td style="padding:8px 10px; font-weight:700;">Total</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700;" class="bsc-mono">${fmtINR(totalRev)}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700;" class="bsc-mono">${totalRev?fmtPct(refundTotal/totalRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700;" class="bsc-mono">${totalRev?fmtPct(cnTotal/totalRev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; font-weight:700; color:var(--brass);" class="bsc-mono">${totalRev?fmtPct((refundTotal+cnTotal)/totalRev*100):'\u2014'}</td></tr>`;
    body.appendChild(chTable);

    // ---- Region-wise ----
    const regHead = document.createElement('div');
    regHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    regHead.textContent = 'Region-wise \u2014 ' + cmk;
    body.appendChild(regHead);

    const regTable = document.createElement('table');
    regTable.style.cssText = 'font-size:13px; margin-bottom:24px;';
    let regRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
      '<td style="padding:6px 10px;">Region</td><td style="padding:6px 10px; text-align:right;">Revenue</td>' +
      '<td style="padding:6px 10px; text-align:right;">Refunds</td><td style="padding:6px 10px; text-align:right;">Refund %</td>' +
      '<td style="padding:6px 10px; text-align:right;">CN</td><td style="padding:6px 10px; text-align:right;">CN %</td></tr>';
    ['North','South','West'].forEach(reg => {
      let regRefund = 0, regCN = 0;
      if(refundMonth) Object.keys(refundMonth.byStore || {}).forEach(s => { if(offlineRegion(s) === reg) regRefund += refundMonth.byStore[s]; });
      if(cnMonth) Object.keys(cnMonth.byStore || {}).forEach(s => { if(offlineRegion(s) === reg) regCN += cnMonth.byStore[s]; });
      const rev = regionRev[reg];
      regRows += `<tr style="border-top:1px solid var(--line);">
        <td style="padding:8px 10px; font-weight:500;">${reg}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(rev)}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(regRefund)}</td>
        <td style="padding:8px 10px; text-align:right; color:var(--brass); font-weight:600;" class="bsc-mono">${rev?fmtPct(regRefund/rev*100):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(regCN)}</td>
        <td style="padding:8px 10px; text-align:right; color:var(--brass); font-weight:600;" class="bsc-mono">${rev?fmtPct(regCN/rev*100):'\u2014'}</td>
      </tr>`;
    });
    regTable.innerHTML = regRows;
    body.appendChild(regTable);

    // ---- Store-wise ----
    const stHead = document.createElement('div');
    stHead.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    stHead.textContent = 'Store-wise \u2014 ' + cmk;
    body.appendChild(stHead);

    const allStores = new Set(Object.keys(storeRev).filter(s => offlineRegion(s)));
    if(refundMonth) Object.keys(refundMonth.byStore || {}).forEach(s => { if(offlineRegion(s)) allStores.add(s); });
    if(cnMonth) Object.keys(cnMonth.byStore || {}).forEach(s => { if(offlineRegion(s)) allStores.add(s); });

    let stArr = Array.from(allStores).map(s => {
      const rev = storeRev[s] || 0;
      const bills = storeBills[s] || 0;
      const rf = refundMonth && refundMonth.byStore ? (refundMonth.byStore[s] || 0) : 0;
      const cn = cnMonth && cnMonth.byStore ? (cnMonth.byStore[s] || 0) : 0;
      const rfCount = refundMonth && refundMonth.byStoreCount ? (refundMonth.byStoreCount[s] || 0) : 0;
      const cnCount = cnMonth && cnMonth.byStoreCount ? (cnMonth.byStoreCount[s] || 0) : 0;
      const rfBillPct = bills ? rfCount/bills*100 : 0;
      const cnBillPct = bills ? cnCount/bills*100 : 0;
      return {store:s, region: offlineRegion(s), rev, bills, rf, cn, rfCount, cnCount, rfBillPct, cnBillPct, rfPct: rev?rf/rev*100:0, cnPct: rev?cn/rev*100:0};
    });

    // ---- Filter bar: region + sort ----
    const availableRegions = ['North','South','West'].filter(reg => stArr.some(s => s.region === reg));
    const stFilterBar = document.createElement('div');
    stFilterBar.style.cssText = 'display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:center;';
    stFilterBar.innerHTML = `
      <span style="font-size:11.5px; color:var(--text-mute);">Filter:</span>
      <select id="bsc-refund-store-region-filter" style="background:var(--panel); border:0.5px solid var(--line2); color:var(--text); font-size:12px; padding:6px 10px; border-radius:6px; font-family:inherit;">
        <option value="all"${state.refundStoreFilterRegion==='all'?' selected':''}>All regions</option>
        ${availableRegions.map(reg => `<option value="${reg}"${state.refundStoreFilterRegion===reg?' selected':''}>${reg}</option>`).join('')}
      </select>
      <span style="font-size:11.5px; color:var(--text-mute); margin-left:4px;">Sort by:</span>
      <select id="bsc-refund-store-sort" style="background:var(--panel); border:0.5px solid var(--line2); color:var(--text); font-size:12px; padding:6px 10px; border-radius:6px; font-family:inherit;">
        <option value="refund"${state.refundStoreSortBy==='refund'?' selected':''}>Refund % (high to low)</option>
        <option value="cn"${state.refundStoreSortBy==='cn'?' selected':''}>CN % (high to low)</option>
        <option value="revenue"${state.refundStoreSortBy==='revenue'?' selected':''}>Revenue (high to low)</option>
      </select>
    `;
    body.appendChild(stFilterBar);

    if(state.refundStoreFilterRegion !== 'all') stArr = stArr.filter(s => s.region === state.refundStoreFilterRegion);
    if(state.refundStoreSortBy === 'cn') stArr.sort((a,b) => b.cnPct - a.cnPct);
    else if(state.refundStoreSortBy === 'revenue') stArr.sort((a,b) => b.rev - a.rev);
    else stArr.sort((a,b) => b.rfPct - a.rfPct);

    const stTable = document.createElement('table');
    stTable.style.cssText = 'font-size:13px; margin-bottom:16px;';
    let stRows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
      '<td style="padding:6px 10px;">Store</td><td style="padding:6px 10px;">Region</td>' +
      '<td style="padding:6px 10px; text-align:right;">Revenue</td><td style="padding:6px 10px; text-align:right;">Total Bills</td>' +
      '<td style="padding:6px 10px; text-align:right;">Refund %</td><td style="padding:6px 10px; text-align:right;">Refund Bills %</td>' +
      '<td style="padding:6px 10px; text-align:right;">CN %</td><td style="padding:6px 10px; text-align:right;">CN Bills %</td></tr>';
    if(stArr.length === 0){
      stRows += '<tr><td colspan="8" style="padding:16px 10px; text-align:center; color:var(--text-mute);">No stores match this filter.</td></tr>';
    }
    stArr.forEach(s => {
      // Color coding is independent per column: refund% color only reflects refund%, CN% color only reflects CN%.
      stRows += `<tr style="border-top:1px solid var(--line);">
        <td style="padding:8px 10px; font-weight:500;">${s.store}</td>
        <td style="padding:8px 10px; color:var(--text-mute);">${s.region}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(s.rev)}</td>
        <td style="padding:8px 10px; text-align:right; color:var(--text-mute);" class="bsc-mono">${s.bills || '\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; color:${achColor(100-s.rfPct*8)}; font-weight:600;" class="bsc-mono">${s.rev?fmtPct(s.rfPct):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; color:${achColor(100-s.rfBillPct*8)}; font-weight:600;" class="bsc-mono">${s.bills?fmtPct(s.rfBillPct):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; color:${achColor(100-s.cnPct*3)}; font-weight:600;" class="bsc-mono">${s.rev?fmtPct(s.cnPct):'\u2014'}</td>
        <td style="padding:8px 10px; text-align:right; color:${achColor(100-s.cnBillPct*3)}; font-weight:600;" class="bsc-mono">${s.bills?fmtPct(s.cnBillPct):'\u2014'}</td>
      </tr>`;
    });
    stTable.innerHTML = stRows;
    body.appendChild(stTable);

    attachRefundStoreFilterHandlers();
  }

  // ---- Reasons explorer: one filterable table (type / channel / breakdown / metric dropdowns)
  // instead of a fixed grid of 10 always-shown tables. ----
  function channelLabel(ch){
    return ch === 'online' ? 'Online' : ch === 'offline' ? 'Offline' : 'Online + Offline';
  }

  function renderReasonsExplorer(){
    const prevBaseline = (typeof PREV_MONTH_REFUND_CN !== 'undefined' && PREV_MONTH_REFUND_CN.month) ? PREV_MONTH_REFUND_CN : null;

    // The offline half of the Aug baseline is built from in-store "order rows" (see
    // BSC_Dashboard_Runbook.md); the online half comes from BASELINE.prevMonthOnlineRevenue,
    // derived separately from a full Aug 1-31 sales export (2026-09-18).
    let augOfflineRev = 0;
    if(typeof BASELINE !== 'undefined' && BASELINE.prevMonthDailyRegion){
      Object.values(BASELINE.prevMonthDailyRegion).forEach(dayObj => {
        Object.values(dayObj).forEach(v => augOfflineRev += v);
      });
    }
    const augOnlineRev = (typeof BASELINE !== 'undefined' && BASELINE.prevMonthOnlineRevenue) ? BASELINE.prevMonthOnlineRevenue : 0;
    const augMonthLabel = prevBaseline ? prevBaseline.month : prevMonthInfo().key;

    const head = document.createElement('div');
    head.style.cssText = 'font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:10px;';
    head.textContent = 'Reasons — ' + cmk;
    body.appendChild(head);

    const selStyle = 'background:var(--panel); border:0.5px solid var(--line2); color:var(--text); font-size:12px; padding:6px 10px; border-radius:6px; font-family:inherit;';
    const filterBar = document.createElement('div');
    filterBar.style.cssText = 'display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; align-items:center;';
    filterBar.innerHTML = `
      <select id="bsc-reason-type" style="${selStyle}">
        <option value="refund"${state.reasonType==='refund'?' selected':''}>Refunds</option>
        <option value="cn"${state.reasonType==='cn'?' selected':''}>Credit notes</option>
      </select>
      <select id="bsc-reason-channel" style="${selStyle}">
        <option value="both"${state.reasonChannel==='both'?' selected':''}>Online + Offline</option>
        <option value="online"${state.reasonChannel==='online'?' selected':''}>Online</option>
        <option value="offline"${state.reasonChannel==='offline'?' selected':''}>Offline</option>
      </select>
      <select id="bsc-reason-breakdown" style="${selStyle}">
        <option value="reason"${state.reasonBreakdown==='reason'?' selected':''}>By reason</option>
        <option value="category"${state.reasonBreakdown==='category'?' selected':''}>By category</option>
      </select>
    `;
    body.appendChild(filterBar);

    const curObj = state.reasonType === 'cn' ? cnMonth : refundMonth;
    const augObj = prevBaseline ? (state.reasonType === 'cn' ? prevBaseline.cn : prevBaseline.refund) : null;

    function mapFor(obj, breakdown, channel){
      if(!obj) return {};
      const key = breakdown === 'category'
        ? (channel === 'online' ? 'byCategoryOnline' : channel === 'offline' ? 'byCategoryOffline' : 'byCategory')
        : (channel === 'online' ? 'byReasonOnline' : channel === 'offline' ? 'byReasonOffline' : 'byReason');
      return obj[key] || {};
    }

    const curMap = mapFor(curObj, state.reasonBreakdown, state.reasonChannel);
    const augMap = mapFor(augObj, state.reasonBreakdown, state.reasonChannel);

    const curChannelRev = state.reasonChannel === 'online' ? onlineRev : state.reasonChannel === 'offline' ? offlineRev : totalRev;
    const augChannelRev = state.reasonChannel === 'online' ? augOnlineRev : state.reasonChannel === 'offline' ? augOfflineRev : (augOfflineRev + augOnlineRev);

    const curLocalTotal = Object.values(curMap).reduce((s,v)=>s+v,0);
    const augLocalTotal = Object.values(augMap).reduce((s,v)=>s+v,0);
    const curPctDenom = (hasRevenue && curChannelRev) ? curChannelRev : curLocalTotal;
    const augPctDenom = (augObj && augChannelRev) ? augChannelRev : augLocalTotal;

    const labels = new Set([...Object.keys(curMap), ...Object.keys(augMap)]);
    let rows = Array.from(labels).map(label => {
      const curAmt = curMap[label] || 0;
      const augAmt = augMap[label] || 0;
      const curPct = curPctDenom ? curAmt/curPctDenom*100 : null;
      const augPct = (augObj && augPctDenom) ? augAmt/augPctDenom*100 : null;
      return {label, curAmt, augAmt, curPct, augPct};
    }).filter(r => r.curAmt > 0 || r.augAmt > 0);
    rows.sort((a,b) => b.curAmt - a.curAmt);

    const note = document.createElement('div');
    note.style.cssText = 'font-size:11px; color:var(--text-mute); margin-bottom:10px; line-height:1.5;';
    let noteText = (hasRevenue
      ? '% of ' + cmk + ' revenue uses ' + channelLabel(state.reasonChannel).toLowerCase() + ' revenue for ' + cmk + ' (' + fmtINR(curChannelRev) + ').'
      : 'No sales CSV uploaded for ' + cmk + ' yet, so % of ' + cmk + ' revenue shows % of this table’s own total instead.');
    noteText += ' ';
    noteText += (!augObj
      ? 'No ' + augMonthLabel + ' refund/CN baseline set yet — see BSC_Dashboard_Runbook.md for how to build PREV_MONTH_REFUND_CN.'
      : '% of ' + augMonthLabel + ' revenue uses ' + channelLabel(state.reasonChannel).toLowerCase() + ' revenue for ' + augMonthLabel + ' (' + fmtINR(augChannelRev) + ').');
    note.textContent = noteText;
    body.appendChild(note);

    const t = document.createElement('table');
    t.style.cssText = 'font-size:13px; margin-bottom:24px;';
    const breakdownLabel = state.reasonBreakdown === 'category' ? 'Category' : 'Reason';
    let trows = '<tr style="color:var(--text-mute); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em;">' +
      '<td style="padding:6px 10px;">' + breakdownLabel + '</td>' +
      '<td style="padding:6px 10px; text-align:right;">Amount</td>' +
      '<td style="padding:6px 10px; text-align:right;">% of ' + cmk + ' revenue</td>' +
      '<td style="padding:6px 10px; text-align:right;">% of ' + augMonthLabel + ' revenue</td></tr>';
    if(rows.length === 0){
      trows += '<tr><td colspan="4" style="padding:16px 10px; text-align:center; color:var(--text-mute);">No data for this combination.</td></tr>';
    }
    rows.forEach(r => {
      trows += `<tr style="border-top:1px solid var(--line);">
        <td style="padding:8px 10px; font-weight:500;">${r.label}</td>
        <td style="padding:8px 10px; text-align:right;" class="bsc-mono">${fmtINR(r.curAmt)}</td>
        <td style="padding:8px 10px; text-align:right; color:var(--brass); font-weight:600;" class="bsc-mono">${r.curPct!==null?fmtPct(r.curPct):'—'}</td>
        <td style="padding:8px 10px; text-align:right; color:var(--text-mute); font-weight:600;" class="bsc-mono">${r.augPct!==null?fmtPct(r.augPct):'—'}</td>
      </tr>`;
    });
    t.innerHTML = trows;
    body.appendChild(t);
  }

  renderReasonsExplorer();

  attachRefundHandlers();
  attachReasonsFilterHandlers();
}

function currentMonthKeyForDate(d){
  const monNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return monNames[d.getMonth()] + '-' + d.getFullYear();
}

function attachRefundHandlers(){
  const ri = document.getElementById('bsc-refund-input');
  if(ri) ri.addEventListener('change', (e) => { if(e.target.files[0]) handleCombinedRefundFile(e.target.files[0]); });
}

function attachRefundStoreFilterHandlers(){
  const regionSel = document.getElementById('bsc-refund-store-region-filter');
  if(regionSel) regionSel.addEventListener('change', (e) => {
    state.refundStoreFilterRegion = e.target.value;
    render();
  });
  const sortSel = document.getElementById('bsc-refund-store-sort');
  if(sortSel) sortSel.addEventListener('change', (e) => {
    state.refundStoreSortBy = e.target.value;
    render();
  });
}

function attachReasonsFilterHandlers(){
  const bindings = [
    ['bsc-reason-type', 'reasonType'],
    ['bsc-reason-channel', 'reasonChannel'],
    ['bsc-reason-breakdown', 'reasonBreakdown'],
  ];
  bindings.forEach(([id, key]) => {
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', (e) => {
      state[key] = e.target.value;
      render();
    });
  });
}

function attachHandlers(){
  const rangeApply = document.getElementById('bsc-range-apply');
  if(rangeApply) rangeApply.addEventListener('click', () => {
    const s = document.getElementById('bsc-range-start').value;
    const e = document.getElementById('bsc-range-end').value;
    if(!s || !e){ alert('Pick both a start and end date.'); return; }
    if(s > e){ alert('Start date must be before end date.'); return; }
    state.dateRange = {start: s, end: e};
    render();
  });
  const rangeReset = document.getElementById('bsc-range-reset');
  if(rangeReset) rangeReset.addEventListener('click', () => {
    state.dateRange = null;
    render();
  });
}

function renderManageDataPanel(){
  const panel = document.createElement('div');
  panel.style.cssText = 'margin:0 24px 16px; background:var(--panel); border:1px solid var(--line2); border-radius:10px; padding:16px;';

  const allDays = getSortedDays();
  const byMonth = {};
  allDays.forEach(dk => {
    const mk = currentMonthKeyForDate(new Date(dk+'T00:00:00'));
    byMonth[mk] = byMonth[mk] || [];
    byMonth[mk].push(dk);
  });

  let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div style="font-size:13px; font-weight:600; color:var(--text-dim);">Stored sales days (by month)</div>
    <button id="bsc-close-manage" style="background:none; border:none; color:var(--text-mute); cursor:pointer; font-size:18px; line-height:1;">&times;</button>
  </div>`;

  if(allDays.length === 0){
    html += '<div style="font-size:12.5px; color:var(--text-mute);">No sales data stored yet.</div>';
  } else {
    Object.keys(byMonth).sort().forEach(mk => {
      const daysInMonth = byMonth[mk].sort();
      const monthTotal = daysInMonth.reduce((s,dk) => {
        const revs = state.days[dk] || {};
        return s + Object.values(revs).reduce((a,b)=>a+b,0);
      }, 0);
      const isCurrent = mk === currentMonthKey();
      html += `<div style="margin-bottom:10px; padding:10px 12px; background:var(--panel2); border-radius:8px; ${isCurrent?'border:1px solid var(--brass);':''}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <div style="font-size:12.5px; font-weight:600; color:${isCurrent?'var(--brass)':'var(--text-dim)'};">${mk}${isCurrent?' (current \u2014 shown on dashboard)':' (hidden from dashboard tabs)'}</div>
          <button data-delete-month="${mk}" style="background:none; border:0.5px solid var(--bad); color:var(--bad); font-size:11px; padding:3px 8px; border-radius:6px; cursor:pointer; font-family:inherit;">Delete this month</button>
        </div>
        <div style="font-size:11.5px; color:var(--text-mute); margin-bottom:6px;">${daysInMonth.length} day(s) \u2014 ${fmtINR(monthTotal)} total</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">`;
      daysInMonth.forEach(dk => {
        const dayTotal = Object.values(state.days[dk]||{}).reduce((a,b)=>a+b,0);
        html += `<span style="font-size:11px; color:var(--text-mute); background:var(--ink); padding:3px 8px; border-radius:6px; display:inline-flex; align-items:center; gap:6px;">
          ${dk} (${fmtINR(dayTotal)}) <button data-delete-day="${dk}" style="background:none; border:none; color:var(--bad); cursor:pointer; font-size:12px; padding:0; line-height:1;">&times;</button>
        </span>`;
      });
      html += `</div></div>`;
    });
  }

  html += `<div style="display:flex; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">
    <button id="bsc-clear-all-sales" style="background:none; border:0.5px solid var(--bad); color:var(--bad); font-size:12px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:inherit;">Clear all sales data</button>
    <button id="bsc-clear-refunds" style="background:none; border:0.5px solid var(--bad); color:var(--bad); font-size:12px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer; font-family:inherit;">Clear refund/CN data</button>
  </div>
  <div style="font-size:11px; color:var(--text-mute); margin-top:10px; line-height:1.5;">
    If a store\u2019s numbers look too high, check here for days from other months sitting in storage \u2014 they\u2019re excluded from the dashboard\u2019s calculations automatically, but this is where you can permanently delete them if you\u2019d rather clean things up.
  </div>`;

  panel.innerHTML = html;
  return panel;
}

async function deleteDay(dk){
  await db.delete('day-' + dk);
  delete state.days[dk];
  delete state.billDays[dk];
  delete state.catDays[dk];
  delete state.newRevDays[dk];
  delete state.repRevDays[dk];
  delete state.newBillDays[dk];
  delete state.repBillDays[dk];
  delete state.catUnitDays[dk];
  delete state.stylistRevDays[dk];
  delete state.stylistBillDays[dk];
  delete state.storeUnitDays[dk];
  delete state.stylistStoreRevDays[dk];
}

async function clearAllSalesData(){
  const allDays = getSortedDays();
  for(const dk of allDays) await deleteDay(dk);
}

async function clearRefundData(){
  await db.delete('refunds-summary');
  await db.delete('cn-summary');
  state.refundsData = null;
  state.cnData = null;
}

function attachManagePanelHandlers(){
  const closeBtn = document.getElementById('bsc-close-manage');
  if(closeBtn) closeBtn.addEventListener('click', () => { state.showManagePanel = false; render(); });

  document.querySelectorAll('[data-delete-day]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await deleteDay(btn.getAttribute('data-delete-day'));
      render();
    });
  });
  document.querySelectorAll('[data-delete-month]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const mk = btn.getAttribute('data-delete-month');
      const toDelete = getSortedDays().filter(dk => currentMonthKeyForDate(new Date(dk+'T00:00:00')) === mk);
      if(!confirm('Delete all ' + toDelete.length + ' day(s) of stored data for ' + mk + '? This can\u2019t be undone.')) return;
      for(const dk of toDelete) await deleteDay(dk);
      render();
    });
  });
  const clearAllBtn = document.getElementById('bsc-clear-all-sales');
  if(clearAllBtn) clearAllBtn.addEventListener('click', async () => {
    if(!confirm('Delete ALL stored sales days, across every month? This can\u2019t be undone.')) return;
    await clearAllSalesData();
    render();
  });
  const clearRefundsBtn = document.getElementById('bsc-clear-refunds');
  if(clearRefundsBtn) clearRefundsBtn.addEventListener('click', async () => {
    if(!confirm('Delete all stored refund and credit note data? This can\u2019t be undone.')) return;
    await clearRefundData();
    render();
  });
}

async function exportAllData(){
  const raw = await db.allKeysRaw();
  const blob = new Blob([JSON.stringify({exportedAt: new Date().toISOString(), data: raw}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bsc-console-data-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importAllData(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const data = parsed.data || parsed;
    for(const key of Object.keys(data)){
      if(data[key] !== null && data[key] !== undefined) await db.set(key, data[key]);
    }
    await loadAllDays();
    await loadRefundData();
    render();
  }catch(e){
    console.error('Import failed', e);
    alert('Could not read that file \u2014 make sure it\u2019s a JSON file exported from this dashboard.');
  }
}

// ---------- init ----------
async function init(){
  const root = document.getElementById('bsc-root');
  root.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-mute); font-size:13px;">Loading...</div>';
  loadBakedInData();
  state.loading = false;
  render();
}

// The live month's data as baked into this file, kept so the dropdown can switch back to it
// after an archived month has been swapped into the shared globals below.
let LIVE_MONTH = null;
const archiveCache = {};
const clone = (o) => JSON.parse(JSON.stringify(o));
// Swap a const object's contents in place (BASELINE etc. are consts the render code reads directly).
function replaceContents(target, src){
  Object.keys(target).forEach(k => delete target[k]);
  Object.assign(target, src || {});
}

function applyMonthBundle(b){
  ['days','billDays','catDays','newRevDays','repRevDays','newBillDays','repBillDays','catUnitDays',
   'stylistRevDays','stylistBillDays','storeUnitDays','stylistStoreRevDays','stylistStoreBillsDays',
   'stylistStoreUnitsDays','stylistUnitDays'].forEach(k => { state[k] = {}; });
  loadSeedDays(b.days);
  replaceContents(BASELINE, b.baseline);
  replaceContents(DAILY_TARGETS, b.dailyTargets);
  replaceContents(PREV_MONTH_REFUND_CN, b.prevRefundCn);
  state.refundsData = b.refunds;
  state.cnData = b.cn;
  state.npsData = b.nps;
  state.targetsNote = b.targetsNote || null;
}

async function selectMonth(mk){
  state.dateRange = null;
  if(!mk || mk === LIVE_MONTH.month){
    state.viewMonth = null;
    applyMonthBundle(LIVE_MONTH);
    render();
    return;
  }
  const entry = ARCHIVE_MONTHS.find(e => e.key === mk);
  if(!entry) return;
  if(!archiveCache[mk]){
    state.monthLoading = mk;
    render();
    try{
      const r = await fetch(entry.file, {cache: 'no-cache'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      archiveCache[mk] = await r.json();
    }catch(e){
      state.monthLoading = null;
      alert('Could not load ' + mk + ' (' + e.message + ').');
      render();
      return;
    }
    state.monthLoading = null;
  }
  state.viewMonth = mk;
  applyMonthBundle(clone(archiveCache[mk]));
  // Training/SM cohort tabs track live programmes against fixed baselines -- live month only.
  if(['cohort1','cohort2','smcohort'].includes(state.activeTab)) state.activeTab = 'overview';
  render();
}

function loadBakedInData(){
  // This dashboard is read-only: everything it shows comes directly from the data
  // baked into this file (live month) or its data/months/*.json archive files (past months)
  // -- never from browser storage. That guarantees every visitor sees exactly the same numbers.
  LIVE_MONTH = {
    month: liveMonthKey(),
    days: typeof SEED_DAYS !== 'undefined' ? SEED_DAYS : {},
    baseline: clone(BASELINE),
    dailyTargets: clone(DAILY_TARGETS),
    prevRefundCn: clone(PREV_MONTH_REFUND_CN),
    refunds: typeof SEED_REFUNDS !== 'undefined' ? SEED_REFUNDS : null,
    cn: typeof SEED_CN !== 'undefined' ? SEED_CN : null,
    nps: typeof SEED_NPS !== 'undefined' ? SEED_NPS : null,
    targetsNote: null,
  };
  applyMonthBundle(LIVE_MONTH);
}

function loadSeedDays(seedDays){
  if(seedDays){
    for(const dk of Object.keys(seedDays)){
      const d = seedDays[dk];
      state.days[dk] = d.stores;
      state.billDays[dk] = d.bills || {};
      state.catDays[dk] = d.categories || {};
      state.newRevDays[dk] = d.newRev || {};
      state.repRevDays[dk] = d.repRev || {};
      state.newBillDays[dk] = d.newBills || {};
      state.repBillDays[dk] = d.repBills || {};
      state.catUnitDays[dk] = d.categoryUnits || {};
      state.stylistRevDays[dk] = d.stylistRev || {};
      state.stylistBillDays[dk] = d.stylistBills || {};
      state.storeUnitDays[dk] = d.storeUnits || {};
      state.stylistStoreRevDays[dk] = d.stylistStoreRev || {};
      state.stylistUnitDays[dk] = d.stylistUnits || {};
      state.stylistStoreBillsDays[dk] = d.stylistStoreBills || {};
      state.stylistStoreUnitsDays[dk] = d.stylistStoreUnits || {};
    }
  }
}
init();

})();
</script>

</div>
